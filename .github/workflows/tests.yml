name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Suíte Playwright (npm test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Confere que o FIREBASE_CONFIG está em produção (só quando o alvo é a main)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: node tests/check_firebase_config.js
