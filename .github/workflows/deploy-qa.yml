name: Deploy QA (Firebase Hosting)

# Só a branch qa publica automaticamente — não existe equivalente pra main, que continua sendo
# publicada só pelo GitHub Pages (ver docs/STANDALONE-SETUP.md e CLAUDE.md).
on:
  push:
    branches: [qa]

jobs:
  deploy_qa:
    name: Publica app/biri-prints-3d-standalone.html no Firebase Hosting (QA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy no Firebase Hosting (projeto biri-prints-3d-qa)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_QA_SERVICE_ACCOUNT }}'
          projectId: biri-prints-3d-qa
          channelId: live
