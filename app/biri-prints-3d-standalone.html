        <button class="icon-btn" data-add-orc="${p.id}" title="Adicionar a um orçamento">${iconAdicionarOrcamento()}</button>
        <button class="icon-btn icon-btn-danger" data-del="${p.id}" title="Excluir">${iconExcluir()}</button>
      </div>
    </div>
  </div>`;
}

function wireCatGridButtons(grid){
  grid.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=> openProdutoEditor(b.dataset.edit));
  });
  grid.querySelectorAll('[data-dup]').forEach(b=>{
    b.addEventListener('click', ()=> openProdutoEditor(b.dataset.dup, true));
  });
  grid.querySelectorAll('[data-add-orc]').forEach(b=>{
    b.addEventListener('click', ()=> openOrcamentoBuilder(null, b.dataset.addOrc));
  });
  grid.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=> confirmThenDelete(b, ()=> deleteProduto(b.dataset.del)));
  });
}

function renderCatalogo(main){
  const produtos = state.produtos;
  if(produtos.length===0){
    main.innerHTML = `${offlineBanner()}<div class="empty">${iconLayers()}<h3>Nenhuma peça salva ainda</h3><p>Clique em "Adicionar Produto" pra calcular o preço e salvar sua primeira peça no catálogo.</p><button class="btn btn-primary" id="goCalc">Adicionar Produto</button></div>`;
    document.getElementById('goCalc').addEventListener('click', abrirNovoProduto);
    addFab('fabAdicionarProduto', abrirNovoProduto);
    return;
  }

  const f = state.catalogoFiltros;
  const {lo, hi} = catalogoLimitesPreco();
  const precoMinAtual = f.precoMin!=null ? f.precoMin : lo;
  const precoMaxAtual = f.precoMax!=null ? f.precoMax : hi;

  main.innerHTML = `${offlineBanner()}
    <div class="row" style="justify-content:space-between; margin-bottom:2px; gap:8px; flex-wrap:wrap;">
      <p class="section-label" id="catContagem" style="margin-bottom:0;"></p>
      <div class="row" style="gap:8px; flex-wrap:wrap;">
        <select class="ipt" id="catOrdenar" style="width:auto; max-width:100%;">
          <option value="nome-asc">Nome (A–Z)</option>
          <option value="nome-desc">Nome (Z–A)</option>
          <option value="preco-desc">Preço (maior primeiro)</option>
          <option value="preco-asc">Preço (menor primeiro)</option>
        </select>
        <button class="btn btn-sm filtros-toggle-mobile" id="btnToggleFiltrosCatalogo">Filtros</button>
        <button class="btn btn-sm" id="btnLimparFiltrosCatalogo" style="display:none;">Limpar filtros</button>
        <button class="btn btn-sm" id="btnCompartilharCatalogo">Compartilhar lista</button>
      </div>
    </div>
    <div class="filtros-catalogo${state.catalogoFiltrosAbertos?' aberto':''}" id="filtrosCatalogoPanel">
      <div>
        <p class="filtro-titulo">Impressora</p>
        <div class="chk-list">
          ${state.impressoras.map(i=>`<label class="chk-item"><input type="checkbox" class="cat-filtro-impressora" value="${i.id}" ${f.impressoras.includes(i.id)?'checked':''}><span>${i.nome}</span></label>`).join('') || '<p class="meta">Nenhuma impressora cadastrada</p>'}
        </div>
      </div>
      <div>
        <p class="filtro-titulo">Material</p>
        <div class="chk-list">
          ${state.materiais.map(m=>`<label class="chk-item"><input type="checkbox" class="cat-filtro-material" value="${m.id}" ${f.materiais.includes(m.id)?'checked':''}><span>${m.nome}</span></label>`).join('') || '<p class="meta">Nenhum material cadastrado</p>'}
        </div>
      </div>
      <div>
        <p class="filtro-titulo">Faixa de preço</p>
        <div class="price-range-inputs">
          <input class="ipt" type="number" id="catPrecoMinInput" min="${lo}" max="${hi}" step="1" value="${precoMinAtual}">
          <input class="ipt" type="number" id="catPrecoMaxInput" min="${lo}" max="${hi}" step="1" value="${precoMaxAtual}">
        </div>
        <div class="price-range-slider">
          <div class="price-range-track"><div class="price-range-fill" id="catPrecoFill"></div></div>
          <input type="range" id="catPrecoMinRange" min="${lo}" max="${hi}" step="1" value="${precoMinAtual}">
          <input type="range" id="catPrecoMaxRange" min="${lo}" max="${hi}" step="1" value="${precoMaxAtual}">
        </div>
      </div>
      <div>
        <p class="filtro-titulo">Buscar por nome</p>
        <input class="ipt" id="catBuscaInput" placeholder="Buscar por nome..." value="${f.busca||''}" style="width:100%;">
      </div>
    </div>
    <div class="produtos-lista" id="catGrid" style="margin-top:12px;"></div>`;

  addFab('fabAdicionarProduto', abrirNovoProduto);
  document.getElementById('btnCompartilharCatalogo').addEventListener('click', openCompartilharCatalogo);

  const ordenarSel = document.getElementById('catOrdenar');
  ordenarSel.value = state.catalogoOrdenacao;
  ordenarSel.addEventListener('change', ()=>{
    state.catalogoOrdenacao = ordenarSel.value;
    atualizarGridCatalogo();
  });

  const painel = document.getElementById('filtrosCatalogoPanel');
  document.getElementById('btnToggleFiltrosCatalogo').addEventListener('click', ()=>{
    state.catalogoFiltrosAbertos = !state.catalogoFiltrosAbertos;
    painel.classList.toggle('aberto', state.catalogoFiltrosAbertos);
  });

  const contagemEl = document.getElementById('catContagem');
  const limparBtn = document.getElementById('btnLimparFiltrosCatalogo');
  const grid = document.getElementById('catGrid');
  const minRange = document.getElementById('catPrecoMinRange');
  const maxRange = document.getElementById('catPrecoMaxRange');
  const minInput = document.getElementById('catPrecoMinInput');
  const maxInput = document.getElementById('catPrecoMaxInput');
  const fill = document.getElementById('catPrecoFill');

  function atualizarTrackFill(){
    const min = Number(minRange.value), max = Number(maxRange.value);
    const pctMin = ((min-lo)/(hi-lo))*100;
    const pctMax = ((max-lo)/(hi-lo))*100;
    fill.style.left = pctMin + '%';
    fill.style.width = Math.max(0, pctMax-pctMin) + '%';
  }
  atualizarTrackFill();

  // Re-render "leve": só o grid + contador + botão de limpar. Usado pela busca (debounced) e
  // pelo slider/campos de preço, pra não recriar o painel de filtros a cada tecla/arrasto — o
  // que perderia o foco do campo de texto ou interromperia o arrasto do slider.
  function atualizarGridCatalogo(){
    const filtrados = produtosFiltrados();
    const ativo = catalogoFiltroAtivo();
    contagemEl.textContent = ativo
      ? `${filtrados.length} de ${produtos.length} peça${produtos.length>1?'s':''} encontrada${filtrados.length===1?'':'s'}`
      : `${produtos.length} peça${produtos.length>1?'s':''} no catálogo`;
    limparBtn.style.display = ativo ? '' : 'none';
    if(filtrados.length===0){
      grid.innerHTML = `<div class="empty">${iconSliders()}<h3>Nenhuma peça encontrada</h3><p>Tenta ajustar ou limpar os filtros pra ver outras peças do catálogo.</p></div>`;
      return;
    }
    grid.innerHTML = produtosOrdenados(filtrados).map(produtoCardHtml).join('');
    wireCatGridButtons(grid);
  }
  atualizarGridCatalogo();

  document.querySelectorAll('.cat-filtro-impressora').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const id = chk.value;
      if(chk.checked) f.impressoras.push(id); else f.impressoras = f.impressoras.filter(x=>x!==id);
      sincronizarURLFiltros();
      renderMain();
    });
  });
  document.querySelectorAll('.cat-filtro-material').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const id = chk.value;
      if(chk.checked) f.materiais.push(id); else f.materiais = f.materiais.filter(x=>x!==id);
      sincronizarURLFiltros();
      renderMain();
    });
  });

  function aplicarFaixaPreco(min, max){
    f.precoMin = min<=lo ? null : min;
    f.precoMax = max>=hi ? null : max;
    sincronizarURLFiltros();
    atualizarGridCatalogo();
  }
  minRange.addEventListener('input', ()=>{
    let min = Number(minRange.value), max = Number(maxRange.value);
    if(min>max){ min = max; minRange.value = min; }
    minInput.value = min;
    atualizarTrackFill();
    aplicarFaixaPreco(min, max);
  });
  maxRange.addEventListener('input', ()=>{
    let min = Number(minRange.value), max = Number(maxRange.value);
    if(max<min){ max = min; maxRange.value = max; }
    maxInput.value = max;
    atualizarTrackFill();
    aplicarFaixaPreco(min, max);
  });
  minInput.addEventListener('input', ()=>{
    let min = Number(minInput.value);
    if(!isFinite(min)) return;
    let max = Number(maxRange.value);
    if(min>max) min = max;
    minRange.value = min;
    atualizarTrackFill();
    aplicarFaixaPreco(min, max);
  });
  maxInput.addEventListener('input', ()=>{
    let max = Number(maxInput.value);
    if(!isFinite(max)) return;
    let min = Number(minRange.value);
    if(max<min) max = min;
    maxRange.value = max;
    atualizarTrackFill();
    aplicarFaixaPreco(min, max);
  });

  let buscaTimeout = null;
  document.getElementById('catBuscaInput').addEventListener('input', (e)=>{
    const valor = e.target.value;
    clearTimeout(buscaTimeout);
    buscaTimeout = setTimeout(()=>{
      f.busca = valor;
      sincronizarURLFiltros();
      atualizarGridCatalogo();
    }, 300);
  });

  limparBtn.addEventListener('click', ()=>{
    state.catalogoFiltros = { impressoras: [], materiais: [], precoMin: null, precoMax: null, busca: '' };
    sincronizarURLFiltros();
    renderMain();
  });
}

function gerarTextoCatalogo(produtos){
  if(!produtos || produtos.length===0) return '';
  let txt = `● *Catálogo Biri Prints 3D*\n\n`;
  produtos.forEach(p=>{
    const r = precoAjustado(p, state.config);
    txt += `◆ *${p.nome}* — ${fmtBRL(r.precoFinal)}\n`;
  });
  txt += `\n_Valores sujeitos a alteração._`;
  const promoAtiva = (state.promocoes||[]).some(promo => promocaoStatus(promo)==='ativa');
  if(promoAtiva){
    txt += `\n\n▲ Kits com desconto disponíveis nesse período — me chama!`;
  }
  return txt;
}

async function copiarOuCompartilharTexto(txt){
  if(navigator.share){
    try{
      await navigator.share({text: txt});
      showToast('Compartilhado');
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // usuário cancelou o compartilhamento
      // outro erro (ex.: não suportado nesse navegador) -> cai pro clipboard
    }
  }
  const done = () => showToast('Lista copiada');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else {
    fallbackCopy(txt, done);
  }
}

function openCompartilharCatalogo(){
  if(state.produtos.length===0){ showToast('Cadastre peças no catálogo primeiro'); return; }
  const checks = state.produtos.map(p=>`
    <label class="row" style="gap:9px; cursor:pointer;">
      <input type="checkbox" class="share-prod-chk" data-id="${p.id}" checked style="width:18px;height:18px;flex:none;">
      <span style="font-size:.86rem; flex:1;">${p.nome}</span>
    </label>`).join('');

  openModal('Compartilhar catálogo', `
    <div class="stack">
      <div>
        <p class="section-label">Peças a incluir</p>
        <div class="stack" style="max-height:220px; overflow-y:auto;">${checks}</div>
      </div>
      <div>
        <p class="section-label">Prévia</p>
        <textarea class="ipt mono" id="shPreview" readonly rows="10" style="resize:vertical; white-space:pre-wrap;"></textarea>
      </div>
      <button class="btn btn-primary btn-block" id="shCopiar">Copiar / Compartilhar</button>
    </div>
  `, (bd)=>{
    const atualizarPreview = ()=>{
      const idsSelecionados = new Set([...bd.querySelectorAll('.share-prod-chk:checked')].map(c=>c.dataset.id));
      const selecionados = state.produtos.filter(p=>idsSelecionados.has(p.id));
      bd.querySelector('#shPreview').value = gerarTextoCatalogo(selecionados);
    };
    atualizarPreview();
    bd.querySelectorAll('.share-prod-chk').forEach(chk=> chk.addEventListener('change', atualizarPreview));
    bd.querySelector('#shCopiar').addEventListener('click', ()=>{
      const idsSelecionados = new Set([...bd.querySelectorAll('.share-prod-chk:checked')].map(c=>c.dataset.id));
      if(idsSelecionados.size===0){ showToast('Selecione pelo menos uma peça'); return; }
      copiarOuCompartilharTexto(bd.querySelector('#shPreview').value);
    });
  });
}

function openProdutoEditor(id, duplicar){
  const existing = byId(state.produtos, id);
  if(!existing) return;
  const totalMin = Math.round((Number(existing.tempo_horas)||0) * 60);
  const initH = Math.floor(totalMin/60), initM = totalMin%60;
  const ajusteAtual = Number(existing.ajuste_manual)||0;
  const nomeInicial = duplicar ? `${existing.nome} (cópia)` : existing.nome;
  const materialOptions = state.materiais.map(m=>
    `<option value="${m.id}" ${m.id===existing.material_id?'selected':''}>${m.nome} — ${m.marca} (${fmtBRL(m.preco_kg)}/kg)</option>`
  ).join('');
  const impressoraOptionsPadrao = state.impressoras.map(i=>
    `<option value="${i.id}" ${i.id===existing.impressora_id?'selected':''}>${i.nome}</option>`
  ).join('');

  openModal(duplicar?'Duplicar peça':'Editar peça', `
    ${duplicar?'<p style="font-size:.8rem;color:var(--text-muted);margin:0 0 4px;">Revise os dados abaixo e salve — isso cria uma peça nova, sem alterar a original.</p>':''}
    <div class="stack">
      <label class="field"><span>Nome da peça<span class="req">*</span></span><input class="ipt" id="epNome" value="${nomeInicial}"></label>
      <div class="grid-2">
        <label class="field"><span>Material<span class="req">*</span></span><select class="ipt" id="epMaterial">${materialOptions}</select></label>
        <label class="field"><span>Impressora padrão<span class="req">*</span></span><select class="ipt" id="epImpressora">${impressoraOptionsPadrao}</select></label>
      </div>
      <div class="grid-2">
        <label class="field"><span>Gramatura (g)<span class="req">*</span></span><input class="ipt" id="epGram" type="number" step="0.1" value="${existing.gramatura}"></label>
        <label class="field"><span>Custo de embalagem (R$)</span><input class="ipt" id="epEmb" type="number" step="0.01" value="${Number(existing.custo_embalagem)||0}"></label>
      </div>
      <div class="field">
        <span>Tempo de máquina<span class="req">*</span></span>
        <div class="row" style="gap:6px;">
          <input class="ipt time-input" id="epTempoH" type="number" min="0" step="1" value="${initH}">
          <span class="unit-suffix">h</span>
          <input class="ipt time-input" id="epTempoM" type="number" min="0" max="59" step="1" value="${initM}">
          <span class="unit-suffix">min</span>
        </div>
      </div>

      <div class="breakdown-row"><span class="lbl">Preço calculado pela fórmula</span><span class="mono" id="epCalculado"></span></div>

      <label class="row" style="gap:9px; cursor:pointer;">
        <input type="checkbox" id="epUsarAjuste" style="width:18px;height:18px;flex:none;">
        <span style="font-size:.86rem;">Definir um preço manual (ajuste de mercado)</span>
      </label>
      <div id="epAjusteBox" class="stack" style="display:none;">
        <label class="field">
          <span>Preço final (R$)</span>
          <input class="ipt" id="epPrecoFinal" type="number" step="0.01">
        </label>
        <button type="button" class="textbtn" id="epReset" style="align-self:flex-start;">Usar o valor calculado</button>
        <p style="font-size:.76rem;color:var(--text-muted);margin:0;">Some por cima do valor calculado — se você mudar material, gramatura, tempo etc. depois, o cálculo se atualiza sozinho e esse ajuste continua sendo aplicado em cima do novo valor.</p>
      </div>
      <p id="epSemAjusteNote" style="font-size:.76rem;color:var(--text-muted);margin:0;">Sem essa opção marcada, o preço final é sempre o valor calculado pela fórmula, acima.</p>

      <div>
        <p class="section-label">Perfis por impressora (opcional)</p>
        <p style="font-size:.76rem;color:var(--text-muted);margin:0 0 8px;">Se essa peça leva um tempo ou gramatura diferente em outra impressora, cadastre o perfil aqui. Sem perfil, a peça usa os valores acima em qualquer impressora escolhida num orçamento.</p>
        <div class="stack" id="epPerfis"></div>
        <button type="button" class="textbtn" id="epAddPerfil" style="align-self:flex-start;">+ Adicionar perfil de impressora</button>
      </div>

      <div>
        <p class="section-label">Partes e cores</p>
        <p style="font-size:.76rem;color:var(--text-muted);margin:0 0 8px;">Toda peça tem pelo menos uma parte. Cada parte pode ter cor fixa ou deixar o cliente escolher no orçamento, e também aceitar um texto personalizado (ex.: nome gravado) — são independentes. Não aparece na lista do Catálogo, só aqui na edição.</p>
        <div class="stack" id="epPartes"></div>
        <button type="button" class="textbtn" id="epAddParte" style="align-self:flex-start;">+ Adicionar parte</button>
      </div>

      <button class="btn btn-primary btn-block" id="epSave">${duplicar?'Salvar como nova peça':'Salvar alterações'}</button>
    </div>
  `, (bd)=>{
    const readDraftAndRecalc = () => {
      const material = byId(state.materiais, bd.querySelector('#epMaterial').value);
      const impressora = byId(state.impressoras, bd.querySelector('#epImpressora').value);
      const gramatura = bd.querySelector('#epGram').value;
      const h = Number(bd.querySelector('#epTempoH').value)||0, m = Number(bd.querySelector('#epTempoM').value)||0;
      const custo_embalagem = bd.querySelector('#epEmb').value;
      const r = calcPreco({material, impressora, gramatura, tempo_horas: h+m/60, custo_embalagem}, state.config);
      bd.querySelector('#epCalculado').textContent = fmtBRL(r.precoFinal);
      return r;
    };
    let lastCalc = readDraftAndRecalc();

    const chk = bd.querySelector('#epUsarAjuste');
    const box = bd.querySelector('#epAjusteBox');
    const semAjusteNote = bd.querySelector('#epSemAjusteNote');
    const syncBoxVisibility = () => {
      box.style.display = chk.checked ? 'flex' : 'none';
      semAjusteNote.style.display = chk.checked ? 'none' : 'block';
    };
    chk.checked = ajusteAtual !== 0;
    bd.querySelector('#epPrecoFinal').value = (lastCalc.precoFinal + ajusteAtual).toFixed(2);
    syncBoxVisibility();

    chk.addEventListener('change', ()=>{
      if(chk.checked){ bd.querySelector('#epPrecoFinal').value = (lastCalc.precoFinal + ajusteAtual).toFixed(2); }
      syncBoxVisibility();
    });

    ['epMaterial','epImpressora','epGram','epTempoH','epTempoM','epEmb'].forEach(id=>{
      bd.querySelector('#'+id).addEventListener('input', ()=>{ lastCalc = readDraftAndRecalc(); });
    });
    bd.querySelector('#epImpressora').addEventListener('change', ()=>{ lastCalc = readDraftAndRecalc(); renderPerfis(); });
    bd.querySelector('#epReset').addEventListener('click', ()=>{
      bd.querySelector('#epPrecoFinal').value = lastCalc.precoFinal.toFixed(2);
    });

    // ---- perfis por impressora (tempo/gramatura alternativos) ----
    let perfis = existing.perfis_impressora
      ? Object.entries(existing.perfis_impressora).map(([impressora_id, v])=>({impressora_id, gramatura:v.gramatura, tempo_horas:v.tempo_horas}))
      : [];
    const renderPerfis = ()=>{
      const box2 = bd.querySelector('#epPerfis');
      const impressoraPadraoId = bd.querySelector('#epImpressora').value;
      box2.innerHTML = perfis.length ? perfis.map((pf,i)=>{
        const outrosEscolhidos = perfis.filter((_,j)=>j!==i).map(p=>p.impressora_id).concat([impressoraPadraoId]);
        const opts = state.impressoras.filter(imp=> !outrosEscolhidos.includes(imp.id) || imp.id===pf.impressora_id)
          .map(imp=>`<option value="${imp.id}" ${imp.id===pf.impressora_id?'selected':''}>${imp.nome}</option>`).join('');
        const totalMin2 = Math.round((Number(pf.tempo_horas)||0)*60);
        const ph = Math.floor(totalMin2/60), pm = totalMin2%60;
        return `<div class="card" style="padding:10px;">
          <div class="stack">
            <div class="grid-2">
              <select class="ipt perfil-imp" data-idx="${i}">${opts}</select>
              <input class="ipt perfil-gram" data-idx="${i}" type="number" step="0.1" value="${pf.gramatura}" placeholder="Gramatura (g)">
            </div>
            <div class="row" style="gap:6px;">
              <input class="ipt time-input perfil-h" data-idx="${i}" type="number" min="0" step="1" value="${ph}">
              <span class="unit-suffix">h</span>
              <input class="ipt time-input perfil-m" data-idx="${i}" type="number" min="0" max="59" step="1" value="${pm}">
              <span class="unit-suffix">min</span>
              <button type="button" class="btn btn-ghost btn-sm" data-rm-perfil="${i}">✕</button>
            </div>
          </div>
        </div>`;
      }).join('') : `<p style="color:var(--text-muted); font-size:.8rem;">Nenhum perfil alternativo cadastrado.</p>`;

      box2.querySelectorAll('.perfil-imp').forEach(sel=> sel.addEventListener('change', ()=>{ perfis[Number(sel.dataset.idx)].impressora_id = sel.value; renderPerfis(); }));
      box2.querySelectorAll('.perfil-gram').forEach(inp=> inp.addEventListener('input', ()=>{ perfis[Number(inp.dataset.idx)].gramatura = inp.value; }));
      box2.querySelectorAll('.perfil-h, .perfil-m').forEach(inp=> inp.addEventListener('input', ()=>{
        const idx = Number(inp.dataset.idx);
        const hh = Number(box2.querySelector(`.perfil-h[data-idx="${idx}"]`).value)||0;
        const mm = Number(box2.querySelector(`.perfil-m[data-idx="${idx}"]`).value)||0;
        perfis[idx].tempo_horas = hh + mm/60;
      }));
      box2.querySelectorAll('[data-rm-perfil]').forEach(b=> b.addEventListener('click', ()=>{ perfis.splice(Number(b.dataset.rmPerfil),1); renderPerfis(); }));
    };
    renderPerfis();

    bd.querySelector('#epAddPerfil').addEventListener('click', ()=>{
      const usados = perfis.map(p=>p.impressora_id).concat([bd.querySelector('#epImpressora').value]);
      const disponivel = state.impressoras.find(imp=> !usados.includes(imp.id));
      if(!disponivel){ showToast('Cadastre outra impressora em Admin pra adicionar um perfil'); return; }
      perfis.push({impressora_id: disponivel.id, gramatura: existing.gramatura||0, tempo_horas: existing.tempo_horas||0});
      renderPerfis();
    });

    // ---- partes (cor fixa/personalizável + texto personalizável, por parte) ----
    // A lista de cores oferecida é sempre a do material ATUAL do produto (select #epMaterial) — a
    // mesma cor pode valer pra vários materiais, mas cada material tem seu próprio conjunto (ver
    // Admin > Cores). Por isso corOptionsHtml recebe o material_id a cada render, não uma vez só.
    let partes = (existing.partes && existing.partes.length) ? existing.partes.map(p=>({...p})) : [novaParteDefault()];
    const renderPartes = ()=>{
      const box = bd.querySelector('#epPartes');
      const materialAtualId = bd.querySelector('#epMaterial').value;
      const materialAtual = byId(state.materiais, materialAtualId);
      const corasAtivasDoMaterial = state.cores.filter(c=> c.ativa!==false && (c.material_ids||[]).includes(materialAtualId));
      box.innerHTML = partes.map((pt,i)=>{
        const semCorNoMaterial = corasAtivasDoMaterial.length===0;
        // Sem atalho pra abrir "Nova cor" daqui: o modal desse app não é empilhável (abrir outro
        // modal por cima fecha/descarta este), então um atalho assim perderia as edições em
        // andamento na peça. O aviso deixa claro o que falta; cadastrar a cor é em Admin > Cores.
        const avisoSemCor = `<p style="font-size:.76rem;color:${pt.tipo_cor==='personalizavel'?'var(--danger)':'var(--text-muted)'};margin:4px 0 0;">Nenhuma cor cadastrada pra ${materialAtual?materialAtual.nome:'esse material'} ainda — cadastre em Admin &gt; Cores.</p>`;
        return `<div class="card stack" style="padding:10px;">
          <div class="row" style="justify-content:space-between; align-items:center; gap:8px;">
            <input class="ipt parte-nome" data-idx="${i}" value="${pt.nome||''}" placeholder="Nome da parte (opcional) — ex.: Corpo, Tampa" style="flex:1;">
            ${partes.length>1 ? `<button type="button" class="btn btn-ghost btn-sm" data-rm-parte="${i}">✕</button>` : ''}
          </div>
          <div class="row" style="gap:14px; flex-wrap:wrap;">
            <label class="row" style="gap:6px; cursor:pointer;">
              <input type="radio" name="parteCor${i}" class="parte-tipocor" data-idx="${i}" value="fixa" ${pt.tipo_cor!=='personalizavel'?'checked':''}>
              <span style="font-size:.84rem;">Cor fixa</span>
            </label>
            <label class="row" style="gap:6px; cursor:pointer;">
              <input type="radio" name="parteCor${i}" class="parte-tipocor" data-idx="${i}" value="personalizavel" ${pt.tipo_cor==='personalizavel'?'checked':''}>
              <span style="font-size:.84rem;">Cor personalizável</span>
            </label>
          </div>
          ${pt.tipo_cor!=='personalizavel'
            ? `<label class="field"><span>Cor</span><select class="ipt parte-cor" data-idx="${i}">${corOptionsHtml(pt.cor_fixa_id, materialAtualId)}</select></label>${semCorNoMaterial?avisoSemCor:''}`
            : (semCorNoMaterial
              ? avisoSemCor
              : `<p style="font-size:.76rem;color:var(--text-muted);margin:0;">O cliente escolhe a cor dessa parte (entre as de ${materialAtual?materialAtual.nome:'material atual'}) na hora do orçamento.</p>`)}
          <label class="row" style="gap:8px; cursor:pointer;">
            <input type="checkbox" class="parte-texto-chk" data-idx="${i}" style="width:17px;height:17px;flex:none;" ${pt.texto_personalizavel?'checked':''}>
            <span style="font-size:.84rem;">Aceita texto personalizável (ex.: nome gravado)</span>
          </label>
          ${pt.texto_personalizavel ? `
            <div class="grid-2">
              <label class="field"><span>Rótulo do campo<span class="req">*</span></span><input class="ipt parte-rotulo" data-idx="${i}" value="${pt.rotulo_texto||''}" placeholder="Ex.: Nome"></label>
              <label class="field"><span>Limite de caracteres (opcional)</span><input class="ipt parte-maxchars" data-idx="${i}" type="number" min="1" step="1" value="${pt.texto_max_chars||''}" placeholder="Sem limite"></label>
            </div>
            <label class="row" style="gap:8px; cursor:pointer;">
              <input type="checkbox" class="parte-texto-obrig" data-idx="${i}" style="width:17px;height:17px;flex:none;" ${pt.texto_obrigatorio?'checked':''}>
              <span style="font-size:.84rem;">Texto obrigatório (bloqueia converter o orçamento em pedido sem preencher)</span>
            </label>` : ''}
        </div>`;
      }).join('');

      box.querySelectorAll('.parte-nome').forEach(inp=> inp.addEventListener('input', ()=>{ partes[Number(inp.dataset.idx)].nome = inp.value; }));
      box.querySelectorAll('.parte-tipocor').forEach(r=> r.addEventListener('change', ()=>{ partes[Number(r.dataset.idx)].tipo_cor = r.value; renderPartes(); }));
      box.querySelectorAll('.parte-cor').forEach(sel=> sel.addEventListener('change', ()=>{ partes[Number(sel.dataset.idx)].cor_fixa_id = sel.value; }));
      box.querySelectorAll('.parte-texto-chk').forEach(chk=> chk.addEventListener('change', ()=>{ partes[Number(chk.dataset.idx)].texto_personalizavel = chk.checked; renderPartes(); }));
      box.querySelectorAll('.parte-rotulo').forEach(inp=> inp.addEventListener('input', ()=>{ partes[Number(inp.dataset.idx)].rotulo_texto = inp.value; }));
      box.querySelectorAll('.parte-maxchars').forEach(inp=> inp.addEventListener('input', ()=>{ partes[Number(inp.dataset.idx)].texto_max_chars = inp.value; }));
      box.querySelectorAll('.parte-texto-obrig').forEach(chk=> chk.addEventListener('change', ()=>{ partes[Number(chk.dataset.idx)].texto_obrigatorio = chk.checked; }));
      box.querySelectorAll('[data-rm-parte]').forEach(b=> b.addEventListener('click', ()=>{ partes.splice(Number(b.dataset.rmParte),1); renderPartes(); }));
    };
    renderPartes();

    bd.querySelector('#epAddParte').addEventListener('click', ()=>{ partes.push(novaParteDefault()); renderPartes(); });

    // Trocar o material pode invalidar cores fixas já escolhidas (a cor só vale pro(s) material(is)
    // marcado(s) em Admin > Cores) — reseta pra "sem cor definida" em vez de deixar uma cor que não
    // existe mais nesse material presa no cadastro, e avisa que precisa escolher de novo.
    bd.querySelector('#epMaterial').addEventListener('change', ()=>{
      const materialAtualId = bd.querySelector('#epMaterial').value;
      let resetou = false;
      partes.forEach(p=>{
        if(p.cor_fixa_id){
          const cor = byId(state.cores, p.cor_fixa_id);
          if(!cor || !(cor.material_ids||[]).includes(materialAtualId)){ p.cor_fixa_id = ''; resetou = true; }
        }
      });
      if(resetou) showToast('Cor de alguma parte não existe nesse material — escolha de novo');
      renderPartes();
    });

    bd.querySelector('#epSave').addEventListener('click', ()=>{
      clearFieldErrors(bd);
      const nome = bd.querySelector('#epNome').value.trim();
      const material_id = bd.querySelector('#epMaterial').value;
      const impressora_id = bd.querySelector('#epImpressora').value;
      const gramatura = Number(bd.querySelector('#epGram').value)||0;
      const h = Number(bd.querySelector('#epTempoH').value)||0, m = Number(bd.querySelector('#epTempoM').value)||0;
      let temErro = false;
      if(!nome){ markFieldError(bd.querySelector('#epNome'), 'Dá um nome pra peça'); temErro=true; }
      if(!material_id){ markFieldError(bd.querySelector('#epMaterial'), 'Cadastre um material em Admin primeiro'); temErro=true; }
      if(!impressora_id){ markFieldError(bd.querySelector('#epImpressora'), 'Cadastre uma impressora em Admin primeiro'); temErro=true; }
      if(!(gramatura>0)){ markFieldError(bd.querySelector('#epGram'), 'Informe a gramatura da peça'); temErro=true; }
      if(!((h + m/60)>0)){ markFieldErrorPair(bd.querySelector('#epTempoH'), bd.querySelector('#epTempoM'), 'Informe o tempo de máquina'); temErro=true; }
      partes.forEach((p, i)=>{
        if(p.texto_personalizavel && !(p.rotulo_texto||'').trim()){
          markFieldError(bd.querySelector(`.parte-rotulo[data-idx="${i}"]`), 'Defina um rótulo pro campo de texto');
          temErro = true;
        }
        if(p.tipo_cor==='personalizavel' && !state.cores.some(c=>c.ativa!==false && (c.material_ids||[]).includes(material_id))){
          temErro = true; // aviso já fica visível dentro do card da parte (renderPartes)
        }
      });
      if(temErro){ showToast('Confere os campos destacados'); focusFirstInvalid(bd); bd.querySelector('#epPartes').scrollIntoView({behavior:'smooth', block:'center'}); return; }
      const custo_embalagem = Number(bd.querySelector('#epEmb').value)||0;
      const material = byId(state.materiais, material_id);
      const impressora = byId(state.impressoras, impressora_id);
      const r = calcPreco({material, impressora, gramatura, tempo_horas: h+m/60, custo_embalagem}, state.config);
      let ajuste_manual = 0;
      if(chk.checked){
        const raw = bd.querySelector('#epPrecoFinal').value.trim();
        const precoFinalDesejado = raw==='' ? r.precoFinal : Number(raw);
        ajuste_manual = isFinite(precoFinalDesejado) ? (precoFinalDesejado - r.precoFinal) : 0;
      }
      const perfis_impressora = {};
      perfis.forEach(p=>{ if(p.impressora_id) perfis_impressora[p.impressora_id] = {gramatura:Number(p.gramatura)||0, tempo_horas:Number(p.tempo_horas)||0}; });
      const partesFinal = partes.map(p=>({
        id: p.id || uid(),
        nome: (p.nome||'').trim(),
        tipo_cor: p.tipo_cor==='personalizavel' ? 'personalizavel' : 'fixa',
        cor_fixa_id: p.tipo_cor==='personalizavel' ? '' : (p.cor_fixa_id||''),
        texto_personalizavel: !!p.texto_personalizavel,
        rotulo_texto: p.texto_personalizavel ? (p.rotulo_texto||'').trim() : '',
        texto_max_chars: (p.texto_personalizavel && Number(p.texto_max_chars)>0) ? Number(p.texto_max_chars) : null,
        texto_obrigatorio: p.texto_personalizavel ? !!p.texto_obrigatorio : false,
      }));
      const data = {nome, material_id, impressora_id, gramatura, tempo_horas: h+m/60, custo_embalagem, ajuste_manual, perfis_impressora, partes: partesFinal};

      if(duplicar){
        // Ids de parte novos na cópia — não afeta nada hoje (cada orçamento guarda produto_id +
        // parte_id juntos), mas evita duas peças diferentes compartilhando o mesmo id de parte.
        data.partes = partesFinal.map(p=>({...p, id: uid()}));
        if(!state.dbOk){
          data.id = uid(); data.criado_em = new Date().toISOString();
          state.produtos = [data, ...state.produtos];
          closeModal(); state.tab='catalogo'; renderNav(); renderMain(); showToast('Peça duplicada (modo local)');
          return;
        }
        state.db.collection('produtos').add({...data, criado_em: new Date().toISOString()})
          .then(()=>{ closeModal(); showToast('Peça duplicada'); })
          .catch(()=> showToast('Não deu pra salvar agora'));
        return;
      }

      if(!state.dbOk){ Object.assign(existing, data); closeModal(); renderMain(); showToast('Salvo (modo local)'); return; }
      state.db.collection('produtos').doc(existing.id).update(data)
        .then(()=>{ closeModal(); showToast('Peça atualizada'); })
        .catch(()=> showToast('Não deu pra salvar agora'));
    });
  });
}

function confirmThenAction(btn, onConfirm, opts={}){
  const confirmText = opts.confirmText || 'Confirmar?';
  const confirmClass = opts.confirmClass || 'btn-danger';
  if(btn.dataset.confirming){ onConfirm(); return; }
  btn.dataset.confirming='1';
  const original = btn.textContent;
  btn.textContent = confirmText;
  btn.classList.add(confirmClass);
  setTimeout(()=>{ if(btn.isConnected){ btn.dataset.confirming=''; btn.textContent=original; btn.classList.remove(confirmClass); } }, 2500);
}
function confirmThenDelete(btn, onConfirm){ confirmThenAction(btn, onConfirm, {confirmText:'Confirmar?', confirmClass:'btn-danger'}); }

function deleteProduto(id){
  if(!state.dbOk){ state.produtos = state.produtos.filter(p=>p.id!==id); renderMain(); return; }
  state.db.collection('produtos').doc(id).delete().then(()=>showToast('Peça removida')).catch(()=>showToast('Não deu pra excluir agora'));
}

/* ================= ORÇAMENTOS ================= */
// Status "rascunho" é o padrão — um orçamento antigo sem o campo `status` (de antes dessa
// distinção existir) conta como rascunho também, nunca fica "orfão" fora dos filtros.
const statusOrcamento = o => (o.status==='enviado' || o.status==='pedido') ? o.status : 'rascunho';

// Depois que um orçamento vira pedido, ele ganha um sub-status próprio de acompanhamento de
// produção/entrega (independente do status "rascunho/enviado/pedido" acima). "aberto" é o padrão
// pra pedido sem esse campo ainda. "Pago" é um campo à parte (booleano), não uma etapa dessa
// sequência — o vendedor pode cobrar adiantado ou só na entrega.
const PEDIDO_STAGES = [
  {v:'aberto', label:'Aberto'},
  {v:'em_producao', label:'Em produção'},
  {v:'pronto', label:'Pronto'},
  {v:'entregue', label:'Entregue'},
];
const PEDIDO_BADGE_CLASS = {aberto:'badge-muted', em_producao:'badge-warn', pronto:'badge-accent', entregue:'badge-pedido', cancelado:'badge-danger'};
const PEDIDO_BADGE_LABEL = {aberto:'Aberto', em_producao:'Em produção', pronto:'Pronto', entregue:'Entregue', cancelado:'Cancelado'};
// Rótulo do botão "Avisar: <rótulo>" — "aberto" vira "Recebido" aqui (o texto da mensagem é sobre o
// pedido ter sido recebido, não sobre um badge de status "Aberto"), diferente de PEDIDO_BADGE_LABEL.
const AVISO_STATUS_LABEL = {aberto:'Recebido', em_producao:'Em produção', pronto:'Pronto', entregue:'Entregue', cancelado:'Cancelado'};
const statusPedido = o => o.status_pedido || 'aberto';

function proximoNumero(campo){
  return state.orcamentos.reduce((m,o)=> Math.max(m, Number(o[campo])||0), 0) + 1;
}

function vendedorOptionsHtml(selecionadoId, {incluirTodos=false} = {}){
  const visiveis = state.vendedores.filter(v=> v.ativo!==false || v.id===selecionadoId);
  let html = incluirTodos ? `<option value="todos" ${selecionadoId==='todos'?'selected':''}>Todos os vendedores</option>` : `<option value="">— sem vendedor —</option>`;
  html += visiveis.map(v=>`<option value="${v.id}" ${selecionadoId===v.id?'selected':''}>${v.nome}${v.ativo===false?' (inativo)':''}</option>`).join('');
  return html;
}
// Filtro de vendedor lista TODOS os vendedores (inclusive inativos) já que serve pra achar coisas
// do passado, não só pra escolher um vendedor novo. Uma linha de filtros compartilhada pelas duas
// abas (Orçamentos e Pedidos) — cada uma passa seus próprios ids de elemento/campos de state.
function vendedorFiltroOptionsHtml(selecionado){
  let html = `<option value="todos" ${selecionado==='todos'?'selected':''}>Todos os vendedores</option>`;
  html += state.vendedores.map(v=>`<option value="${v.id}" ${selecionado===v.id?'selected':''}>${v.nome}${v.ativo===false?' (inativo)':''}</option>`).join('');
  return html;
}
function filtrosClienteVendedorHtml(idCliente, idVendedor, valCliente, valVendedor){
  return `
    <div class="row" style="gap:8px; flex-wrap:wrap; margin-bottom:10px;">
      <input class="ipt" id="${idCliente}" placeholder="Filtrar por cliente..." value="${valCliente||''}" style="max-width:220px;">
      <select class="ipt" id="${idVendedor}" style="max-width:100%; width:auto; min-width:190px;">${vendedorFiltroOptionsHtml(valVendedor||'todos')}</select>
    </div>`;
}

function renderOrcamentos(main){
  // Aba Orçamentos = rascunho/enviado (em negociação) + encerrados (já viraram pedido, só
  // leitura/histórico — ver renderPedidos pra gestão de produção/pagamento).
  const orcsTodos = state.orcamentos;
  const filtro = state.filtroOrcStatus || 'todos';
  const filtroCliente = state.filtroOrcCliente || '';
  const filtroVendedor = state.filtroOrcVendedor || 'todos';
  let orcs = filtro==='todos' ? orcsTodos : orcsTodos.filter(o=> statusOrcamento(o)===filtro);
  if(filtroCliente.trim()) orcs = orcs.filter(o=> (o.cliente||'').toLowerCase().includes(filtroCliente.trim().toLowerCase()));
  if(filtroVendedor!=='todos') orcs = orcs.filter(o=> (o.vendedor_id||'')===filtroVendedor);
  const contagem = {
    rascunho: orcsTodos.filter(o=>statusOrcamento(o)==='rascunho').length,
    enviado: orcsTodos.filter(o=>statusOrcamento(o)==='enviado').length,
    pedido: orcsTodos.filter(o=>statusOrcamento(o)==='pedido').length,
  };
  main.innerHTML = `${offlineBanner()}
    <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
      <p class="section-label" style="margin-bottom:0;">${orcs.length} orçamento${orcs.length!==1?'s':''}</p>
      <div class="row" style="gap:6px; flex-wrap:wrap;">
        <button class="btn btn-sm ${filtro==='todos'?'btn-primary':''}" data-filtro-orc="todos">Todos (${orcsTodos.length})</button>
        <button class="btn btn-sm ${filtro==='rascunho'?'btn-primary':''}" data-filtro-orc="rascunho">Rascunhos (${contagem.rascunho})</button>
        <button class="btn btn-sm ${filtro==='enviado'?'btn-primary':''}" data-filtro-orc="enviado">Enviados (${contagem.enviado})</button>
        <button class="btn btn-sm ${filtro==='pedido'?'btn-primary':''}" data-filtro-orc="pedido">Encerrados (${contagem.pedido})</button>
      </div>
    </div>
    ${filtrosClienteVendedorHtml('filtroOrcCliente', 'filtroOrcVendedor', filtroCliente, filtroVendedor)}
    <div class="stack" id="orcList"></div>`;
  document.querySelectorAll('[data-filtro-orc]').forEach(b=> b.addEventListener('click', ()=>{ state.filtroOrcStatus = b.dataset.filtroOrc; renderMain(); }));
  document.getElementById('filtroOrcCliente').addEventListener('input', (e)=>{ state.filtroOrcCliente = e.target.value; renderMain(); });
  document.getElementById('filtroOrcVendedor').addEventListener('change', (e)=>{ state.filtroOrcVendedor = e.target.value; renderMain(); });

  const list = document.getElementById('orcList');
  if(orcsTodos.length===0){
    list.innerHTML = `<div class="empty">${iconReceipt()}<h3>Nenhum orçamento ainda</h3><p>Monte um orçamento a partir do catálogo ou comece do zero.</p></div>`;
  } else if(orcs.length===0){
    list.innerHTML = `<p style="color:var(--text-muted); font-size:.85rem;">Nenhum orçamento encontrado com esses filtros.</p>`;
  } else {
    list.innerHTML = orcs.map(o=>{
      const status = statusOrcamento(o);
      const encerrado = status==='pedido';
      const expanded = state.expandedOrc===o.id;
      const metaTxt = [
        o.orcamento_numero ? `Orçamento #${o.orcamento_numero}` : null,
        new Date(o.criado_em).toLocaleDateString('pt-BR'),
        `${o.itens.length} ite${o.itens.length!==1?'ns':'m'}`,
        o.vendedor_nome || null,
      ].filter(Boolean).join(' · ');
      const itensHtml = expanded ? `<div class="stack" style="margin-top:10px;">${o.itens.map(it=>`
        <div class="list-line"><span>${it.nome} × ${fmtNum(it.quantidade,0)}</span><span class="mono">${fmtBRL(it.preco_unit*it.quantidade)}</span></div>
        ${personalizacaoResumoLinhaHtml(it)}
      `).join('')}
      ${(o.desconto_kit_total>0 || o.desconto_manual_valor>0) ? `<div class="list-line"><span>Subtotal (sem desconto)</span><span class="mono">${fmtBRL(o.subtotal)}</span></div>` : ''}
      ${(o.desconto_kit_linhas&&o.desconto_kit_linhas.length) ? o.desconto_kit_linhas.map(l=>`
        <div class="list-line" style="color:var(--accent);"><span>Desconto de kit — ${l.promoNome} (${fmtNum(l.pct,0)}%)</span><span class="mono">− ${fmtBRL(l.desconto)}</span></div>
      `).join('') : ''}
      ${o.desconto_manual_valor>0 ? `<div class="list-line" style="color:var(--accent);"><span>Desconto negociado (${fmtNum(o.desconto_manual_pct,0)}%)</span><span class="mono">− ${fmtBRL(o.desconto_manual_valor)}</span></div>` : ''}
      ${encerrado ? `<button type="button" class="textbtn" data-ir-pedido="${o.id}" style="display:block; text-align:left; font-size:.8rem; padding:10px 0 0;">Encerrado — virou <strong>Pedido${o.pedido_numero?' #'+o.pedido_numero:''}</strong>. Ver na aba Pedidos →</button>` : ''}
      <div class="row" style="margin-top:8px; flex-wrap:wrap; gap:8px;">
        <button class="btn btn-sm" style="background:var(--accent); border-color:var(--accent); color:var(--accent-ink);" data-whatsapp="${o.id}">Enviar por WhatsApp</button>
        <button class="btn btn-sm" data-copy="${o.id}">Copiar resumo</button>
        <button class="btn btn-sm" data-copiar-orc="${o.id}">Copiar orçamento</button>
        ${!encerrado ? `<button class="btn btn-sm" data-editar-orc="${o.id}">Editar</button>` : ''}
        ${!encerrado ? `<button class="btn btn-sm" data-toggle-status="${o.id}">${status==='enviado'?'Marcar como rascunho':'Marcar como enviado'}</button>` : ''}
        ${!encerrado ? `<button class="btn btn-sm btn-primary" data-converter-pedido="${o.id}">Converter em pedido</button>` : ''}
        ${!encerrado ? `<button class="btn btn-sm btn-ghost" data-del-orc="${o.id}">Excluir</button>` : ''}
      </div>
      </div>` : '';
      const badgeClass = encerrado ? 'badge-pedido' : (status==='enviado' ? 'badge-accent' : 'badge-muted');
      const badgeLabel = encerrado ? 'Encerrado' : (status==='enviado' ? 'Enviado' : 'Rascunho');
      return `<div class="card${expanded?' expanded':''}${encerrado?' encerrado':''}">
        <div class="row" style="cursor:pointer;" data-toggle-orc="${o.id}">
          <div style="flex:1;">
            <h3 style="font-family:'IBM Plex Sans'; font-size:1rem; font-weight:600;">${o.cliente || 'Sem cliente'}</h3>
            <div class="meta" style="font-size:.76rem;color:var(--text-muted);">${metaTxt}</div>
          </div>
          <span class="badge ${badgeClass}">${badgeLabel}</span>
          <span class="mono" style="font-weight:600;">${fmtBRL(o.total)}</span>
        </div>
        ${itensHtml}
      </div>`;
    }).join('');

    list.querySelectorAll('[data-toggle-orc]').forEach(el=>{
      el.addEventListener('click', ()=>{ const id=el.dataset.toggleOrc; state.expandedOrc = state.expandedOrc===id?null:id; renderMain(); });
    });
    list.querySelectorAll('[data-copy]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); copyOrcamentoResumo(el.dataset.copy); });
    });
    list.querySelectorAll('[data-whatsapp]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); enviarOrcamentoWhatsApp(el.dataset.whatsapp); });
    });
    list.querySelectorAll('[data-copiar-orc]').forEach(el=>{
      el.addEventListener('click', (e)=>{ e.stopPropagation(); copiarOrcamento(el.dataset.copiarOrc); });

// Mesmo texto usado pelo "Copiar resumo" e pelo "Enviar por WhatsApp" (ver enviarOrcamentoWhatsApp
// abaixo) — os ícones ■/◆ são símbolos geométricos simples (nunca tratados como emoji de verdade),
// de propósito: um emoji de verdade chega corrompido quando o texto passa por uma URL wa.me/
// api.whatsapp.com?text=... na hora de abrir o link (testado no celular na versão principal do app).
function gerarTextoOrcamento(o){
  let txt = `■ *Orçamento${o.cliente? ' — '+o.cliente : ''}*\n_${new Date(o.criado_em).toLocaleDateString('pt-BR')}_\n\n`;
  o.itens.forEach(it=>{ txt += `◆ *${it.nome}* × ${fmtNum(it.quantidade,0)} — ${fmtBRL(it.preco_unit*it.quantidade)}\n`; });
  if(o.desconto_kit_total>0){
    txt += `\nSubtotal: ${fmtBRL(o.subtotal)}\n`;
    (o.desconto_kit_linhas||[]).forEach(l=>{ txt += `_Desconto de kit — ${l.promoNome} (${fmtNum(l.pct,0)}%): − ${fmtBRL(l.desconto)}_\n`; });
  } else if(o.desconto_manual_valor>0){
    txt += `\nSubtotal: ${fmtBRL(o.subtotal)}\n`;
    txt += `_Desconto negociado (${fmtNum(o.desconto_manual_pct,0)}%): − ${fmtBRL(o.desconto_manual_valor)}_\n`;
  }
  txt += `\n*Total: ${fmtBRL(o.total)}*`;
  return txt;
}
function copyOrcamentoResumo(id){
  const o = byId(state.orcamentos, id);
  if(!o) return;
  const txt = gerarTextoOrcamento(o);
  const done = ()=>showToast('Resumo copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ showToast('Não consegui copiar'); }
  ta.remove();
}
// Aceita número com ou sem DDI, com ou sem formatação (parênteses, traço, espaço).
// Sem DDI, assume Brasil (55) — é o público desse app.
function normalizarTelefoneWhatsApp(tel){
  const digitos = (tel||'').replace(/\D/g,'');
  if(!digitos) return '';
  if(digitos.startsWith('55') && (digitos.length===12 || digitos.length===13)) return digitos;
  if(digitos.length===10 || digitos.length===11) return '55'+digitos; // sem DDI -> assume Brasil
  return digitos; // já veio com outro DDI, ou formato inesperado — manda como está
}
// Abre o WhatsApp já com o texto preenchido — com telefone salvo do cliente, direto pro contato
// (wa.me/<numero>); sem telefone, o link "genérico" do WhatsApp, que deixa a pessoa escolher o
// contato na hora (com um toast avisando). Compartilhado pelo resumo do orçamento e pelos avisos
// de status/pagamento do pedido — só muda o texto.
function enviarWhatsAppParaCliente(o, txt){
  const tel = normalizarTelefoneWhatsApp(o.cliente_telefone);
  const url = tel
    ? `https://wa.me/${tel}?text=${encodeURIComponent(txt)}`
    : `https://api.whatsapp.com/send?text=${encodeURIComponent(txt)}`;
  if(!tel) showToast('Sem WhatsApp salvo — escolha o contato na hora de enviar');
  abrirLinkExterno(url);
}
function enviarOrcamentoWhatsApp(id){
  const o = byId(state.orcamentos, id);
  if(!o) return;
  enviarWhatsAppParaCliente(o, gerarTextoOrcamento(o));
}
// Abre um link externo usando um <a> "de verdade" (criado, clicado e removido na hora), em vez de
// window.open() — alguns navegadores/webviews bloqueiam popups abertos via script mas continuam
// respeitando o clique num link real com target="_blank".
function abrirLinkExterno(url){
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function toggleOrcamentoStatus(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  const novo = o.status==='enviado' ? 'rascunho' : 'enviado';
  if(!state.dbOk){ o.status=novo; renderMain(); return; }
  state.db.collection('orcamentos').doc(id).update({status:novo}).catch(()=>showToast('Não deu pra atualizar agora'));
}
function deleteOrcamento(id){
  if(!state.dbOk){ state.orcamentos = state.orcamentos.filter(o=>o.id!==id); renderMain(); return; }
  state.db.collection('orcamentos').doc(id).delete().then(()=>showToast('Orçamento removido')).catch(()=>showToast('Não deu pra excluir agora'));
}
