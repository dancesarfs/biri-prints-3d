/* -------- promoções sazonais -------- */
function openPromoEditor(id){
  const existing = id ? byId(state.promocoes, id) : null;
  const grupoOptions = state.grupos.map(g=>`<option value="${g.id}" ${existing&&existing.grupo_id===g.id?'selected':''}>${g.nome}</option>`).join('');
  const tiersIniciais = (existing?.tiers && existing.tiers.length) ? existing.tiers : [{min_itens:2, desconto_pct:5},{min_itens:4, desconto_pct:10}];

  openModal(existing?'Editar promoção':'Nova promoção', `
    <div class="stack">
      <label class="field"><span>Nome da promoção<span class="req">*</span></span><input class="ipt" id="pNome" value="${existing?.nome||''}" placeholder="Ex.: Dia dos Professores"></label>
      <label class="field"><span>Grupo de kit<span class="req">*</span></span><select class="ipt" id="pGrupo">${grupoOptions || '<option value="">— cadastre um grupo primeiro —</option>'}</select></label>
      <div class="grid-2">
        <label class="field"><span>Início<span class="req">*</span></span><input class="ipt" id="pInicio" type="date" value="${existing?.data_inicio||''}"></label>
        <label class="field"><span>Fim<span class="req">*</span></span><input class="ipt" id="pFim" type="date" value="${existing?.data_fim||''}"></label>
      </div>
      <div>
        <p class="section-label">Faixas de desconto (pelo nº de produtos distintos no kit)</p>
        <div class="stack" id="pTiers"></div>
        <button type="button" class="textbtn" id="pAddTier" style="align-self:flex-start;">+ Adicionar faixa</button>
      </div>
      <button class="btn btn-primary btn-block" id="pSave">Salvar</button>
    </div>
  `, (bd)=>{
    let tiers = tiersIniciais.map(t=>({...t}));
    const renderTiers = ()=>{
      const box = bd.querySelector('#pTiers');
      box.innerHTML = tiers.map((t,i)=>`
        <div class="row" style="gap:8px;">
          <input class="ipt tier-min" type="number" min="2" step="1" value="${t.min_itens}" placeholder="Nº mín. de produtos" style="flex:1;">
          <input class="ipt tier-pct" type="number" min="0" step="1" value="${t.desconto_pct}" placeholder="% de desconto" style="flex:1;">
          <button type="button" class="btn btn-ghost btn-sm" data-rm-tier="${i}">✕</button>
        </div>`).join('');
      box.querySelectorAll('input').forEach(inp=> inp.addEventListener('input', syncTiersFromInputs));
      box.querySelectorAll('[data-rm-tier]').forEach(b=> b.addEventListener('click', ()=>{
        tiers.splice(Number(b.dataset.rmTier),1); renderTiers();
      }));
    };
    const syncTiersFromInputs = () => {
      const mins = [...bd.querySelectorAll('.tier-min')].map(i=>Number(i.value)||0);
      const pcts = [...bd.querySelectorAll('.tier-pct')].map(i=>Number(i.value)||0);
      tiers = mins.map((min,i)=>({min_itens:min, desconto_pct:pcts[i]||0}));
    };
    renderTiers();
    bd.querySelector('#pAddTier').addEventListener('click', ()=>{
      syncTiersFromInputs();
      tiers.push({min_itens:2, desconto_pct:5});
      renderTiers();
    });

    bd.querySelector('#pSave').addEventListener('click', ()=>{
      syncTiersFromInputs();
      clearFieldErrors(bd);
      const nome = bd.querySelector('#pNome').value.trim();
      const grupo_id = bd.querySelector('#pGrupo').value;
      const data_inicio = bd.querySelector('#pInicio').value;
      const data_fim = bd.querySelector('#pFim').value;
      let temErro = false;
      if(!nome){ markFieldError(bd.querySelector('#pNome'), 'Dá um nome pra promoção'); temErro=true; }
      if(!grupo_id){ markFieldError(bd.querySelector('#pGrupo'), 'Escolhe um grupo de kit'); temErro=true; }
      if(!data_inicio){ markFieldError(bd.querySelector('#pInicio'), 'Preenche a data de início'); temErro=true; }
      if(!data_fim){ markFieldError(bd.querySelector('#pFim'), 'Preenche a data de fim'); temErro=true; }
      if(data_inicio && data_fim && data_fim < data_inicio){
        markFieldError(bd.querySelector('#pFim'), 'A data de fim não pode vir antes do início'); temErro=true;
      }
      const tiersValidos = tiers.filter(t=>t.min_itens>=2 && t.desconto_pct>0);
      if(tiersValidos.length===0 && !temErro){ showToast('Adiciona pelo menos uma faixa de desconto válida'); return; }
      if(tiersValidos.length===0) temErro = true;
      if(temErro){ showToast('Confere os campos destacados'); focusFirstInvalid(bd); return; }
      const data = {nome, grupo_id, data_inicio, data_fim, tiers: tiersValidos};
      if(!state.dbOk){
        if(existing){ Object.assign(existing, data); } else { data.id=uid(); state.promocoes=[...state.promocoes, data]; }
        closeModal(); renderMain(); showToast('Salvo (modo local)');
        return;
      }
      const p = existing ? state.db.collection('promocoes').doc(existing.id).update(data) : state.db.collection('promocoes').add(data);
      p.then(()=>{ closeModal(); showToast('Promoção salva'); }).catch(()=> showToast('Não deu pra salvar agora'));
    });
  });
}

function deletePromocao(id){
  if(!state.dbOk){ state.promocoes = state.promocoes.filter(p=>p.id!==id); renderMain(); return; }
  state.db.collection('promocoes').doc(id).delete().then(()=>showToast('Promoção removida')).catch(()=>showToast('Não deu pra excluir agora'));
}

/* ---------------- boot ---------------- */
function fullRerender(){
  if(document.getElementById('modalBackdrop')) return; // don't disturb an open modal
  renderMain();
}

// Migração única: quando o app ainda usava só uma impressora fixa (potência/preço/vida útil
// dentro de config/geral), cria o primeiro registro em "impressoras" a partir desses valores
// e aponta as peças antigas (sem impressora_id) pra ele — sem exigir recadastro do usuário.
let migracaoImpressoraEmAndamento = false;
async function tentarMigrarImpressora(){
  if(migracaoImpressoraEmAndamento || !state.dbOk) return;
  if(state.impressoras.length > 0) return; // já existe pelo menos uma impressora cadastrada
  const cfgAntiga = state.config || {};
  if(cfgAntiga.potencia_kw===undefined && cfgAntiga.preco_impressora===undefined && cfgAntiga.vida_util_horas===undefined) return;
  migracaoImpressoraEmAndamento = true;
  try{
    const dados = {
      nome: 'Bambu Lab A1',
      marca: 'Bambu Lab',
      modelo: 'A1',
      preco_compra: Number(cfgAntiga.preco_impressora)||0,
      potencia_kw: Number(cfgAntiga.potencia_kw)||0,
      vida_util_horas: Number(cfgAntiga.vida_util_horas)||0,
    };
    const ref = await state.db.collection('impressoras').add(dados);
    const semImpressora = state.produtos.filter(p=>!p.impressora_id);
    await Promise.all(semImpressora.map(p=>
      state.db.collection('produtos').doc(p.id).update({impressora_id: ref.id}).catch(()=>{})
    ));
  }catch(e){ /* tenta de novo na próxima vez que um snapshot chamar essa função */ }
  migracaoImpressoraEmAndamento = false;
}

/* ---------------- importar backup (versão standalone) ----------------
   Formato esperado (o mesmo exportado do sistema anterior):
   { config: {...}, impressoras: [{id,...}], materiais: [{id,...}],
     produtos: [{id,...}], grupos: [{id,...}], promocoes: [{id,...}], orcamentos: [{id,...}] }
   Cada documento é gravado com set() preservando o ID original — sobrescreve se já existir. */
async function importarBackupJSON(backup){
  if(!state.dbOk) throw new Error('sem conexão com o banco de dados agora');
  const db = state.db;
  const escritas = [];
  if(backup.config){
    escritas.push(db.doc('config/geral').set(backup.config));
  }
  const colecoes = ['impressoras', 'materiais', 'produtos', 'grupos', 'promocoes', 'orcamentos'];
  colecoes.forEach(nomeColecao=>{
    const itens = backup[nomeColecao];
    if(!Array.isArray(itens)) return;
    itens.forEach(item=>{
      const { id, ...dados } = item;
      if(!id) return;
      escritas.push(db.collection(nomeColecao).doc(id).set(dados));
    });
  });
  await Promise.all(escritas);
}

let bootStarted = false;
function boot(){
  if(bootStarted) return;
  bootStarted = true;
  renderNav();
  renderMain();
  try{
    const db = firebase.firestore();
    state.db = db; state.dbOk = true;

    db.doc('config/geral').onSnapshot(snap=>{
      state.config = snap.exists ? {...DEFAULT_CONFIG, ...snap.data()} : DEFAULT_CONFIG;
      fullRerender();
      tentarMigrarImpressora();
    }, ()=>{});

    db.collection('materiais').onSnapshot(qs=>{
      state.materiais = qs.docs.map(d=>({id:d.id, ...d.data()}));
      populateMaterialSelect();
      if(state.tab==='calc') recomputeCalc();
      if(state.tab!=='calc') fullRerender();
    }, ()=>{});

    db.collection('impressoras').onSnapshot(qs=>{
      state.impressoras = qs.docs.map(d=>({id:d.id, ...d.data()}));
      populateImpressoraSelect();
      if(state.tab==='calc') recomputeCalc();
      if(state.tab!=='calc') fullRerender();
      tentarMigrarImpressora();
    }, ()=>{});

    db.collection('produtos').onSnapshot(qs=>{
      state.produtos = qs.docs.map(d=>({id:d.id, ...d.data()}));
      if(state.tab!=='calc') fullRerender();
      tentarMigrarImpressora();
    }, ()=>{});

    db.collection('orcamentos').onSnapshot(qs=>{
      state.orcamentos = qs.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=> (b.criado_em||'').localeCompare(a.criado_em||''));
      if(state.tab!=='calc') fullRerender();
    }, ()=>{});

    db.collection('grupos').onSnapshot(qs=>{
      state.grupos = qs.docs.map(d=>({id:d.id, ...d.data()}));
      if(state.tab==='config') fullRerender();
    }, ()=>{});

    db.collection('promocoes').onSnapshot(qs=>{
      state.promocoes = qs.docs.map(d=>({id:d.id, ...d.data()}));
      if(state.tab==='config') fullRerender();
    }, ()=>{});

    db.collection('clientes').onSnapshot(qs=>{
      state.clientes = qs.docs.map(d=>({id:d.id, ...d.data()}));
      if(state.tab==='clientes') fullRerender();
    }, ()=>{});

  }catch(e){ /* stays in local fallback mode */ }
}

/* ---------------- login / autenticação (versão standalone) ---------------- */
firebase.initializeApp(FIREBASE_CONFIG);

const loginScreenEl = document.getElementById('loginScreen');
const appShellEl = document.getElementById('appShell');
const loginErroEl = document.getElementById('loginErro');

function mostrarErroLogin(msg){
  loginErroEl.textContent = msg;
  loginErroEl.style.display = 'block';
}

function tentarLogin(){
  loginErroEl.style.display = 'none';
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  if(!email || !senha){ mostrarErroLogin('Preenche e-mail e senha.'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Entrando…';
  firebase.auth().signInWithEmailAndPassword(email, senha)
    .catch(err=>{
      const msgs = {
        'auth/invalid-email': 'E-mail inválido.',
        'auth/user-not-found': 'Não achei essa conta. Confere se criou o usuário no Firebase.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/invalid-credential': 'E-mail ou senha incorretos.',
        'auth/too-many-requests': 'Muitas tentativas — espera um pouco e tenta de novo.',
      };
      mostrarErroLogin(msgs[err.code] || ('Não deu pra entrar: ' + err.message));
    })
    .finally(()=>{ btn.disabled = false; btn.textContent = 'Entrar'; });
}
document.getElementById('loginBtn').addEventListener('click', tentarLogin);
document.getElementById('loginSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') tentarLogin(); });
document.getElementById('loginEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') tentarLogin(); });

document.getElementById('btnLogout').addEventListener('click', ()=>{
  firebase.auth().signOut();
});

firebase.auth().onAuthStateChanged(user=>{
  if(user){
    loginScreenEl.style.display = 'none';
    appShellEl.style.display = '';
    boot();
  } else {
    appShellEl.style.display = 'none';
    loginScreenEl.style.display = 'flex';
  }
});
</script>
