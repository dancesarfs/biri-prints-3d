<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biri Prints 3D</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EEF0EF;
    --surface:#FFFFFF;
    --surface-2:#E3E7E6;
    --border:#D3D9D7;
    --text:#161918;
    --text-muted:#5B6462;
    --accent:#1D63C7;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEAF9;
    --accent-soft-border:#B7D4EF;
    --warn:#9A6318;
    --warn-soft:#F5E7CE;
    --warn-soft-border:#E6CB99;
    --danger:#B23A2E;
    --danger-soft:#F7DFDB;
    --shadow: 0 1px 2px rgba(20,24,22,.06), 0 6px 16px -8px rgba(20,24,22,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181B1A;
      --surface:#212524;
      --surface-2:#2A2F2D;
      --border:#3A403D;
      --text:#EDEFED;
      --text-muted:#9AA39F;
      --accent:#4DA8F0;
      --accent-ink:#0B1F2E;
      --accent-soft:#1B2C3C;
      --accent-soft-border:#2C4A63;
      --warn:#E3B15C;
      --warn-soft:#332A18;
      --warn-soft-border:#4F3F22;
      --danger:#E2766A;
      --danger-soft:#3A211D;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -10px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181B1A;
    --surface:#212524;
    --surface-2:#2A2F2D;
    --border:#3A403D;
    --text:#EDEFED;
    --text-muted:#9AA39F;
    --accent:#4DA8F0;
    --accent-ink:#0B1F2E;
    --accent-soft:#1B2C3C;
    --accent-soft-border:#2C4A63;
    --warn:#E3B15C;
    --warn-soft:#332A18;
    --warn-soft-border:#4F3F22;
    --danger:#E2766A;
    --danger-soft:#3A211D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -10px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Oswald', sans-serif; margin:0; text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit; font-size:1rem;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  /* ---------- shell ---------- */
  .shell{max-width:1180px; margin:0 auto; min-height:100vh; display:flex;}
  .app-content{flex:1; min-width:0; display:flex; flex-direction:column;}
  header.top{
    padding:18px 16px 14px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--border);
  }
  .hamburger{display:inline-flex; background:none; border:none; color:var(--text); padding:4px; margin-right:2px; flex:none;}
  .hamburger svg{width:24px; height:24px;}
  .mark{width:30px; height:30px; flex:none; color:var(--accent);}
  header.top h1{font-size:1.15rem; letter-spacing:.02em; text-transform:uppercase; font-weight:600;}
  header.top .tagline{font-size:.72rem; color:var(--text-muted); letter-spacing:.03em; margin-top:1px;}
  header.top #vendedorAtualBox{margin-left:auto;}

  main{flex:1; padding:16px 16px 40px; width:100%;}
  @media (min-width:720px){
    main{padding:24px 24px 40px;}
    .hamburger{display:none;}
  }

  /* ---------- menu lateral (sidebar) ---------- */
  .sidebar{
    width:240px; flex:none; background:var(--surface); color:var(--text);
    display:flex; flex-direction:column; border-right:1px solid var(--border);
    transition:width .18s ease;
  }
  .sidebar-head{padding:12px 10px; border-bottom:1px solid var(--border);}
  .sidebar-toggle{
    display:flex; align-items:center; gap:10px; width:100%; background:none; border:none;
    color:var(--text); font-size:.8rem; font-weight:600; padding:9px 8px; border-radius:8px;
  }
  .sidebar-toggle:hover{background:var(--surface-2);}
  .sidebar-toggle svg{width:20px; height:20px; flex:none;}
  .sidebar-nav{flex:1; overflow-y:auto; padding:8px;}
  .nav-item{
    display:flex; align-items:center; gap:12px; width:100%; background:none; border:none;
    color:var(--text); font-size:.85rem; padding:10px 10px; border-radius:8px; text-align:left;
  }
  .nav-item svg{width:19px; height:19px; flex:none; color:var(--text-muted);}
  .nav-item span{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nav-item:hover{background:var(--surface-2);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .nav-item.active svg{color:var(--accent);}
  .nav-item .chevron{width:15px; height:15px; flex:none; margin-left:auto; color:var(--text-muted); transition:transform .15s ease;}
  .nav-item .chevron.aberto{transform:rotate(180deg);}
  .nav-children{padding-left:13px;}
  .nav-item-child{padding-left:16px; font-size:.81rem;}

  .sidebar.colapsado{width:64px;}
  .sidebar.colapsado .sidebar-toggle span,
  .sidebar.colapsado .nav-item span,
  .sidebar.colapsado .nav-item .chevron,
  .sidebar.colapsado .nav-children{display:none;}
  .sidebar.colapsado .nav-item{justify-content:center;}

  .sidebar-backdrop{display:none;}
  @media (max-width:719.98px){
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:60; width:82vw; max-width:300px;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--shadow);
    }
    .sidebar.mobile-aberto{transform:translateX(0);}
    /* no celular, o menu é uma gaveta cheia — o modo "recolher pra ícones" do desktop não se aplica */
    .sidebar.colapsado{width:82vw; max-width:300px;}
    .sidebar.colapsado .sidebar-toggle span,
    .sidebar.colapsado .nav-item span,
    .sidebar.colapsado .nav-item .chevron,
    .sidebar.colapsado .nav-children{display:revert;}
    .sidebar.colapsado .nav-item{justify-content:flex-start;}
    .sidebar-backdrop.visivel{
      display:block; position:fixed; inset:0; background:rgba(10,12,14,.45); z-index:55;
    }
  }

  .section-label{
    font-family:'Oswald', sans-serif; font-size:.78rem; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--text-muted); margin:0 0 10px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .card.expanded{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft), var(--shadow);}
  .card.encerrado{background:var(--surface-2);}
  #orcList, #pedList{gap:22px;}
  .stack{display:flex; flex-direction:column; gap:14px;}
  .row{display:flex; gap:10px; align-items:center;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (min-width:560px){ .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;} }

  label.field{display:flex; flex-direction:column; gap:5px;}
  label.field span{font-size:.72rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
  label.field span .req{color:var(--danger); margin-left:2px;}
  input.ipt, select.ipt{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:10px 11px; color:var(--text); width:100%;
  }
  input.ipt:focus, select.ipt:focus{border-color:var(--accent);}
  input.ipt.invalid, select.ipt.invalid{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger);}
  .field-error{font-size:.74rem; color:var(--danger); margin-top:-2px; grid-column:1 / -1;}
  input.time-input{flex:1; min-width:0; text-align:right;}
  .unit-suffix{font-size:.78rem; color:var(--text-muted); font-weight:600; flex:none;}

  .btn{
    border-radius:9px; padding:10px 16px; font-weight:600; font-size:.85rem;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-danger{background:var(--danger-soft); border-color:var(--danger-soft); color:var(--danger);}
  .btn-ghost{background:none; border-color:transparent; color:var(--text-muted);}
  .btn-sm{padding:6px 11px; font-size:.76rem;}
  .btn-block{width:100%;}

  .breakdown-row{display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px dashed var(--border); font-size:.86rem;}
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-row .lbl{color:var(--text-muted);}
  .breakdown-row.total .lbl{color:var(--text); font-weight:600;}
  .breakdown-row.total{border-top:1px solid var(--border); border-bottom:none; margin-top:4px; padding-top:10px;}

  .price-tile{
    background:var(--accent-soft); border:1px solid var(--accent-soft-border); border-radius:14px;
    padding:18px 16px; text-align:center;
  }
  .price-tile .cap{font-size:.72rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--accent);}
  .price-tile .num{font-family:'IBM Plex Mono'; font-size:2.15rem; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums;}
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:.68rem; font-weight:600;
    text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:99px;
  }
  .badge-warn{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-soft-border);}
  .badge-accent{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-soft-border);}
  .badge-muted{background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border);}
  .badge-pedido{background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent);}
  .badge-danger{background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger-soft);}

  .cards-grid{display:grid; grid-template-columns:1fr; gap:12px;}
  @media (min-width:640px){ .cards-grid{grid-template-columns:1fr 1fr;} }
  @media (min-width:960px){ .cards-grid{grid-template-columns:1fr 1fr 1fr;} }

  .item-card{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px; box-shadow:var(--shadow);}
  .item-card .top-row{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .item-card h3{font-size:1rem; font-weight:600; font-family:'IBM Plex Sans';}
  .item-card .meta{font-size:.76rem; color:var(--text-muted); margin-top:2px;}
  .item-card .price{font-family:'IBM Plex Mono'; font-weight:600; font-size:1.15rem; white-space:nowrap;}
  .item-card .actions{display:flex; gap:8px; margin-top:12px;}

  .empty{text-align:center; padding:48px 16px; color:var(--text-muted);}
  .empty svg{width:40px; height:40px; margin-bottom:10px; opacity:.5;}
  .empty p{margin:4px 0 14px; font-size:.88rem;}

  .config-grid{display:grid; grid-template-columns:1fr; gap:10px;}
  @media (min-width:640px){ .config-grid{grid-template-columns:1fr 1fr;} }
  .spec{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .spec .k{font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted);}
  .spec .v{font-family:'IBM Plex Mono'; font-size:1.1rem; font-weight:600; margin-top:2px;}
  .spec .note{font-size:.74rem; color:var(--text-muted); margin-top:5px; line-height:1.4;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(10,12,11,.5); z-index:70; display:flex; align-items:flex-end; justify-content:center;}
  @media (min-width:640px){ .modal-backdrop{align-items:center;} }
  .modal{
    background:var(--surface); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    border-radius:16px 16px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.25);
  }
  @media (min-width:640px){ .modal{border-radius:16px; padding:22px;} }
  .modal h2{font-size:1.05rem; text-transform:uppercase; letter-spacing:.02em; margin-bottom:14px;}
  .modal .close-x{position:absolute; top:14px; right:14px;}

  .list-line{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .list-line:last-child{border-bottom:none;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:9px 16px; border-radius:99px;
    font-size:.82rem; font-weight:600; z-index:80; box-shadow:var(--shadow);
  }
  .fab{
    position:fixed; right:18px; bottom:28px; z-index:15;
    width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    border:none; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  }
  .fab svg{width:24px; height:24px;}
  .offline-banner{
    background:var(--warn-soft); border:1px solid var(--warn-soft-border); color:var(--warn);
    border-radius:10px; padding:9px 12px; font-size:.78rem; margin-bottom:14px;
  }
  .textbtn{background:none; border:none; color:var(--accent); font-weight:600; font-size:.82rem; padding:4px 0;}

  /* ---- tela de login (versão standalone/GitHub, fora do Claude) ---- */
  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:28px 24px; box-shadow:var(--shadow);
  }
  .login-card .mark{display:block; margin:0 auto 10px;}
  .login-card h1{text-align:center; font-size:1.1rem; letter-spacing:.02em; text-transform:uppercase; font-weight:600; margin-bottom:2px;}
  .login-card .cap{text-align:center; font-size:.8rem; color:var(--text-muted); margin-bottom:18px;}
  #btnLogout{margin-left:auto;}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <svg class="mark" viewBox="0 0 32 32" fill="none" style="width:34px;height:34px;"><path d="M6 24 L16 4 L26 24" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 24h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M16 4v8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1>Biri Prints 3D</h1>
    <p class="cap">Entre pra acessar seu catálogo e orçamentos</p>
    <div class="stack">
      <label class="field"><span>E-mail</span><input class="ipt" id="loginEmail" type="email" autocomplete="username"></label>
      <label class="field"><span>Senha</span><input class="ipt" id="loginSenha" type="password" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
      <p id="loginErro" class="field-error" style="display:none;"></p>
    </div>
  </div>
</div>

<div class="shell" id="appShell" style="display:none;">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="sidebar-toggle" id="sidebarToggle"><svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Recolher menu</span></button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-content">
    <header class="top">
      <button class="hamburger" id="btnAbrirMenu" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <svg class="mark" viewBox="0 0 32 32" fill="none"><path d="M6 24 L16 4 L26 24" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 24h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M16 4v8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div>
        <h1>Biri Prints 3D</h1>
        <div class="tagline">Precificação 3D</div>
      </div>
      <div id="vendedorAtualBox"></div>
      <button class="btn btn-sm btn-ghost" id="btnLogout" title="Sair">Sair</button>
    </header>
    <main id="main"></main>
  </div>
</div>

<!--
  Biri Prints 3D — versão standalone (fora do Claude, com Firebase)
  Antes de usar, siga o README.md que veio junto com este arquivo:
  1. Crie um projeto Firebase gratuito e preencha FIREBASE_CONFIG logo abaixo.
  2. Ative Authentication (E-mail/senha) e crie seu usuário.
  3. Ative o Firestore e cole as regras de segurança indicadas no README.
  4. Hospede este arquivo (GitHub Pages, por exemplo) ou abra localmente.
-->
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

<script>
'use strict';

/* ================= CONFIGURAÇÃO DO FIREBASE =================
   Preencha com os dados do SEU projeto Firebase (veja o README.md):
   Firebase Console → Configurações do projeto → Seus apps → app Web → "SDK setup and configuration".
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBfG_P9tMjMxsZleE5J8I_iS3w1r7U2ZCA",
  authDomain: "biri-prints-3d.firebaseapp.com",
  projectId: "biri-prints-3d",
  storageBucket: "biri-prints-3d.firebasestorage.app",
  messagingSenderId: "478151575357",
  appId: "1:478151575357:web:12ca56ce2fa5d02dc2e754",
};

/* ---------------- constants ---------------- */
// Uma única árvore de navegação serve o desktop (sidebar fixa, recolhível a uma "trilha" só de
// ícones) e o celular (a mesma lista, como gaveta full-screen aberta pelo botão ☰ no cabeçalho).
// "Admin" é o único item com submenu — os demais navegam direto.
const NAV_TREE = [
  {id:'catalogo', label:'Catálogo', icon: iconLayers},
  {id:'orcamentos', label:'Orçamentos', icon: iconReceipt},
  {id:'pedidos', label:'Pedidos', icon: iconPedido},
  {id:'admin', label:'Admin', icon: iconGear, children:[
    {id:'admin-parametros', label:'Parâmetros de custo', icon: iconSliders},
    {id:'admin-impressoras', label:'Impressoras', icon: iconPrinter},
    {id:'admin-materiais', label:'Materiais', icon: iconMaterial},
    {id:'admin-grupos', label:'Grupos de kit', icon: iconGrupo},
    {id:'admin-promocoes', label:'Promoções sazonais', icon: iconPromo},
    {id:'admin-vendedores', label:'Vendedores', icon: iconVendedor},
  ]},
  {id:'clientes', label:'Clientes', icon: iconClientes},
];
// ids de todas as sub-páginas dentro de "Admin" (usado pra saber se a aba atual pertence ao grupo).
const ADMIN_TAB_IDS = NAV_TREE.find(i=>i.id==='admin').children.map(c=>c.id);

const DEFAULT_CONFIG = {
  tarifa_kwh: 0.94375,
  falha_pct: 0.10,
  mao_de_obra_hora: 0,
  margem_pct: 1.0,
  preco_minimo: 8,
};
const DEFAULT_MATERIAIS = [
  {id:'seed-pla-voolt', nome:'PLA Básico', marca:'Voolt', preco_kg:100},
];
const DEFAULT_IMPRESSORAS = [
  {id:'seed-impressora-a1', nome:'Bambu Lab A1', marca:'Bambu Lab', modelo:'A1', preco_compra:4500, potencia_kw:0.12, vida_util_horas:3000},
];
const DEFAULT_PRODUTOS = [
  {id:'seed-teste', nome:'TESTE', material_id:'seed-pla-voolt', impressora_id:'seed-impressora-a1', gramatura:17, tempo_horas:1.35, custo_embalagem:0},
];

/* ---------------- state ---------------- */
const state = {
  dbOk: false,
  db: null,
  config: DEFAULT_CONFIG,
  materiais: DEFAULT_MATERIAIS,
  impressoras: DEFAULT_IMPRESSORAS,
  produtos: DEFAULT_PRODUTOS,
  orcamentos: [],
  grupos: [],
  promocoes: [],
  clientes: [],
  vendedores: [],
  vendedorAtualId: null,
  tab: 'catalogo',
  expandedOrc: null,
  sidebarColapsado: false,
  adminExpandido: false,
  menuMobileAberto: false,
  filtroOrcStatus: 'todos',
  filtroOrcCliente: '',
  filtroOrcVendedor: 'todos',
  filtroPedStatus: 'todos',
  filtroPedCliente: '',
  filtroPedVendedor: 'todos',
};

const fmtBRL = n => (isFinite(n)?n:0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtNum = (n, d=2) => (isFinite(n)?n:0).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
function fmtTempo(horasDecimais){
  const totalMin = Math.round((Number(horasDecimais)||0) * 60);
  const hh = Math.floor(totalMin/60), mm = totalMin%60;
  if(hh>0 && mm>0) return `${hh}h ${mm}min`;
  if(hh>0) return `${hh}h`;
  return `${mm}min`;
}
const byId = (arr, id) => arr.find(x => x.id === id);

// Resolve gramatura/tempo pra uma peça numa impressora específica: usa o perfil salvo
// pra essa impressora (produto.perfis_impressora[impressoraId]) quando existir, senão os valores padrão da peça.
function perfilParaImpressora(produto, impressoraId){
  if(impressoraId && impressoraId !== produto.impressora_id && produto.perfis_impressora && produto.perfis_impressora[impressoraId]){
    const pf = produto.perfis_impressora[impressoraId];
    return {gramatura: pf.gramatura, tempo_horas: pf.tempo_horas};
  }
  return {gramatura: produto.gramatura, tempo_horas: produto.tempo_horas};
}

// Calcula o preço de uma peça usando uma impressora específica (padrão da peça ou alternativa),
// aplicando o ajuste manual por cima do resultado — independente de qual impressora gerou a base.
function calcPecaComImpressora(produto, impressoraId, cfg){
  const material = byId(state.materiais, produto.material_id);
  const impressora = byId(state.impressoras, impressoraId || produto.impressora_id);
  const {gramatura, tempo_horas} = perfilParaImpressora(produto, impressoraId);
  const r = calcPreco({material, impressora, gramatura, tempo_horas, custo_embalagem: produto.custo_embalagem}, cfg);
  const ajuste = Number(produto.ajuste_manual)||0;
  return {...r, precoCalculado:r.precoFinal, ajuste, precoFinal: r.precoFinal + ajuste, impressoraUsada: impressora, gramaturaUsada: gramatura, tempoUsado: tempo_horas};
}

function precoAjustado(produto, cfg){
  return calcPecaComImpressora(produto, produto.impressora_id, cfg);
}

function calcPreco({material, impressora, gramatura, tempo_horas, custo_embalagem}, cfg){
  const g = Number(gramatura)||0, h = Number(tempo_horas)||0, emb = Number(custo_embalagem)||0;
  const custoMaterial = material ? (g/1000) * Number(material.preco_kg||0) : 0;
  const potenciaKw = impressora ? Number(impressora.potencia_kw)||0 : 0;
  const precoImpressora = impressora ? Number(impressora.preco_compra)||0 : 0;
  const vidaUtilHoras = impressora ? Number(impressora.vida_util_horas)||0 : 0;
  const custoEnergia = h * (potenciaKw * cfg.tarifa_kwh);
  const custoDesgaste = h * (precoImpressora / (vidaUtilHoras||1));
  const subtotal = custoMaterial + custoEnergia + custoDesgaste;
  const custoFalhas = subtotal * cfg.falha_pct;
  const custoTecnico = subtotal + custoFalhas;
  const custoMaoObra = h * cfg.mao_de_obra_hora;
  const custoTotal = custoTecnico + custoMaoObra + emb;
  const lucro = custoTotal * cfg.margem_pct;
  const precoBruto = custoTotal + lucro;
  const precoFinal = Math.max(precoBruto, cfg.preco_minimo);
  return {custoMaterial, custoEnergia, custoDesgaste, subtotal, custoFalhas, custoTecnico, custoMaoObra, custoEmbalagem:emb, custoTotal, lucro, precoBruto, precoFinal, pisoAplicado: precoBruto < cfg.preco_minimo};
}

function salvarPerfilImpressora(produto, impressoraId, gramatura, tempo_horas){
  const perfis = {...(produto.perfis_impressora||{})};
  perfis[impressoraId] = {gramatura: Number(gramatura)||0, tempo_horas: Number(tempo_horas)||0};
  if(!state.dbOk){ produto.perfis_impressora = perfis; return; }
  state.db.collection('produtos').doc(produto.id).update({perfis_impressora: perfis}).catch(()=> showToast('Não deu pra salvar o perfil agora'));
}

/* ---------------- kits & promoções sazonais ---------------- */
function promocaoStatus(promo, hojeISO){
  const hoje = hojeISO || new Date().toISOString().slice(0,10);
  if(promo.data_inicio && hoje < promo.data_inicio) return 'agendada';
  if(promo.data_fim && hoje > promo.data_fim) return 'encerrada';
  return 'ativa';
}

function melhorTier(tiers, count){
  if(!Array.isArray(tiers)) return null;
  let best = null;
  tiers.forEach(t=>{
    const min = Number(t.min_itens)||0;
    if(count >= min && (!best || min > Number(best.min_itens))) best = t;
  });
  return best;
}

// Calcula, sem empilhar, o melhor desconto de kit aplicável a cada item de um orçamento.
// itens: [{produto_id?, nome, preco_unit, quantidade}]; a contagem do kit é por PRODUTOS DISTINTOS presentes.
function calcularDescontosKit(itens, grupos, promocoes, hojeISO){
  const hoje = hojeISO || new Date().toISOString().slice(0,10);
  const idsNoOrcamento = new Set((itens||[]).filter(it=>it.produto_id).map(it=>it.produto_id));

  const promosAtivas = (promocoes||[]).filter(p=> promocaoStatus(p, hoje)==='ativa');

  const combos = [];
  promosAtivas.forEach(promo=>{
    const grupo = byId(grupos||[], promo.grupo_id);
    if(!grupo) return;
    const membrosPresentes = (grupo.produto_ids||[]).filter(pid=>idsNoOrcamento.has(pid));
    const count = membrosPresentes.length;
    const tier = melhorTier(promo.tiers, count);
    if(!tier) return;
    combos.push({grupo, promo, membrosPresentes, pct: Number(tier.desconto_pct)||0});
  });

  // por item, escolhe só o melhor combo entre os que o incluem (nunca empilha descontos)
  const porItem = (itens||[]).map(it=>{
    if(!it.produto_id) return {it, pct:0, combo:null};
    let melhor = null;
    combos.forEach(c=>{
      if(c.membrosPresentes.includes(it.produto_id) && (!melhor || c.pct > melhor.pct)) melhor = c;
    });
    return {it, pct: melhor?melhor.pct:0, combo: melhor};
  });

  const linhasMap = new Map();
  let total = 0;
  porItem.forEach(({it, pct, combo})=>{
    if(pct<=0 || !combo) return;
    const subtotalItem = it.preco_unit * it.quantidade;
    const desconto = subtotalItem * (pct/100);
    total += desconto;
    const key = combo.promo.id || combo.promo.nome;
    if(!linhasMap.has(key)){
      linhasMap.set(key, {grupoNome:combo.grupo.nome, promoNome:combo.promo.nome, pct, itens:[], subtotal:0, desconto:0});
    }
    const linha = linhasMap.get(key);
    linha.itens.push(it.nome);
    linha.subtotal += subtotalItem;
    linha.desconto += desconto;
  });

  return {total, linhas:[...linhasMap.values()]};
}

}

/* ---------------- validação de campos obrigatórios ---------------- */
function clearFieldErrors(scope){
  scope.querySelectorAll('.ipt.invalid').forEach(el=> el.classList.remove('invalid'));
  scope.querySelectorAll('.field-error').forEach(el=> el.remove());
}
function markFieldError(inputEl, msg){
  if(!inputEl) return inputEl;
  if(!inputEl.classList.contains('invalid')){
    inputEl.classList.add('invalid');
    const err = document.createElement('div');
    err.className='field-error';
    err.textContent = msg;
    inputEl.insertAdjacentElement('afterend', err);
    const clearOnEdit = ()=>{
      inputEl.classList.remove('invalid');
      const sib = inputEl.nextElementSibling;
      if(sib && sib.classList.contains('field-error')) sib.remove();
      inputEl.removeEventListener('input', clearOnEdit);
      inputEl.removeEventListener('change', clearOnEdit);
    };
    inputEl.addEventListener('input', clearOnEdit);
    inputEl.addEventListener('change', clearOnEdit);
  }
  return inputEl;
}
function focusFirstInvalid(scope){
  const first = scope.querySelector('.ipt.invalid');
  if(first){ first.scrollIntoView({behavior:'smooth', block:'center'}); first.focus(); }
}
// pra pares de campo (ex.: horas + minutos de um mesmo "tempo"): mostra a mensagem só no primeiro,
// mas marca e limpa os dois juntos.
function markFieldErrorPair(mainEl, extraEl, msg){
  markFieldError(mainEl, msg);
  if(extraEl && !extraEl.classList.contains('invalid')){
    extraEl.classList.add('invalid');
    const clearOnEdit = ()=>{
      extraEl.classList.remove('invalid');
      extraEl.removeEventListener('input', clearOnEdit);
      extraEl.removeEventListener('change', clearOnEdit);
    };
    extraEl.addEventListener('input', clearOnEdit);
    extraEl.addEventListener('change', clearOnEdit);
  }
}

/* ---------------- máscara e validação de telefone/e-mail ---------------- */
// Mesma convenção usada em normalizarTelefoneWhatsApp: campo guarda o número LOCAL, sem
// DDI (o DDI Brasil é assumido só na hora de montar o link do WhatsApp). Formata progressivamente
// enquanto digita: (11) 1234-5678 (fixo, 10 dígitos) ou (11) 91234-5678 (celular, 11 dígitos).
function mascararTelefone(valor){
  const d = String(valor||'').replace(/\D/g,'').slice(0,11);
  if(!d) return '';
  if(d.length<=2) return `(${d}`;
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
// Liga a máscara automática num campo de telefone: formata o valor já existente (útil ao editar um
// registro salvo antes da máscara existir) e reformata a cada tecla digitada, mantendo o cursor
// no fim (uso normal desses campos é digitar em sequência, sem editar no meio do número).
function aplicarMascaraTelefone(inputEl){
  if(!inputEl) return;
  if(inputEl.value) inputEl.value = mascararTelefone(inputEl.value);
  inputEl.addEventListener('input', ()=>{
    const noFim = inputEl.selectionEnd === inputEl.value.length;
    inputEl.value = mascararTelefone(inputEl.value);
    if(noFim) inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
  });
}
// Válido = 10 dígitos (fixo, DDD+8) ou 11 (celular, DDD+9). Campo vazio não é validado aqui —
// obrigatoriedade é decidida por quem chama, campo a campo (ex.: só se o "aceite" exigir contato).
function telefoneValido(valor){
  const d = String(valor||'').replace(/\D/g,'');
  return d.length===10 || d.length===11;
}
function emailValido(valor){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(valor||'').trim());
}

function openModal(title, bodyHtml, onMount){
  closeModal();
  const bd = document.createElement('div');
  bd.className='modal-backdrop'; bd.id='modalBackdrop';
  bd.innerHTML = `<div class="modal"><h2>${title}</h2>${bodyHtml}</div>`;
  bd.addEventListener('click', e=>{ if(e.target===bd) closeModal(); });
  document.body.appendChild(bd);
  if(onMount) onMount(bd);
}
function closeModal(){ const el=document.getElementById('modalBackdrop'); if(el) el.remove(); }

/* ---------------- menu lateral (sidebar) ---------------- */
function emGrupoAdmin(tabId){ return ADMIN_TAB_IDS.includes(tabId); }

function irParaAba(tabId){
  state.tab = tabId;
  state.expandedOrc = null;
  state.menuMobileAberto = false; // navegar fecha a gaveta no celular
  renderNav();
  renderMain();
}

function renderNav(){
  const nav = document.getElementById('sidebarNav');
  const adminAtivo = emGrupoAdmin(state.tab);
  const adminAberto = state.adminExpandido || adminAtivo;
  nav.innerHTML = NAV_TREE.map(item=>{
    if(item.children){
      return `<div class="nav-group">
        <button class="nav-item ${adminAtivo && !adminAberto ? 'active':''}" data-nav-group="${item.id}">
          ${item.icon()}<span>${item.label}</span>
          <span class="chevron ${adminAberto?'aberto':''}">${iconChevronDown()}</span>
        </button>
        <div class="nav-children" ${adminAberto?'':'style="display:none;"'}>
          ${item.children.map(c=>`<button class="nav-item nav-item-child ${state.tab===c.id?'active':''}" data-nav="${c.id}">${c.icon()}<span>${c.label}</span></button>`).join('')}
        </div>
      </div>`;
    }
    return `<button class="nav-item ${state.tab===item.id?'active':''}" data-nav="${item.id}">${item.icon()}<span>${item.label}</span></button>`;
  }).join('');

  nav.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=> irParaAba(b.dataset.nav));
  });
  nav.querySelectorAll('[data-nav-group]').forEach(b=>{
    b.addEventListener('click', ()=>{
      // Se o menu estiver recolhido a ícones (só existe no desktop), primeiro reabre por
      // completo — não dá pra mostrar os filhos indentados numa trilha estreita.
      if(state.sidebarColapsado){ state.sidebarColapsado=false; try{ localStorage.setItem('sidebarColapsado','0'); }catch(e){} }
      state.adminExpandido = !state.adminExpandido;
      renderNav();
    });
  });

  const sidebarEl = document.getElementById('sidebar');
  sidebarEl.classList.toggle('colapsado', state.sidebarColapsado);
  sidebarEl.classList.toggle('mobile-aberto', state.menuMobileAberto);
  document.getElementById('sidebarBackdrop').classList.toggle('visivel', state.menuMobileAberto);

  renderVendedorAtualBadge();
}
// Liga os controles "fixos" do menu (botão de recolher, hambúrguer do cabeçalho, fundo da gaveta)
// — diferente dos itens de navegação (recriados a cada renderNav), esses elementos nunca são
// substituídos, então essa função roda uma única vez, no boot.
function wireSidebarChrome(){
  document.getElementById('sidebarToggle').addEventListener('click', ()=>{
    if(window.innerWidth < 720){ state.menuMobileAberto = false; } // no celular, "recolher" = fechar a gaveta
    else {
      state.sidebarColapsado = !state.sidebarColapsado;
      try{ localStorage.setItem('sidebarColapsado', state.sidebarColapsado?'1':'0'); }catch(e){}
    }
    renderNav();
  });
  document.getElementById('btnAbrirMenu').addEventListener('click', ()=>{ state.menuMobileAberto = true; renderNav(); });
  document.getElementById('sidebarBackdrop').addEventListener('click', ()=>{ state.menuMobileAberto = false; renderNav(); });
  try{ state.sidebarColapsado = localStorage.getItem('sidebarColapsado') === '1'; }catch(e){}
}

        <label class="row" style="gap:9px; cursor:pointer;">
          <input type="checkbox" id="cUsarAjuste" style="width:18px;height:18px;flex:none;">
          <span style="font-size:.86rem;">Definir um preço manual (ajuste de mercado)</span>
        </label>
        <div id="cAjusteBox" class="stack" style="display:none;">
          <label class="field"><span>Preço final (R$)</span><input class="ipt" id="cPrecoFinal" type="number" step="0.01"></label>
          <button type="button" class="textbtn" id="cReset" style="align-self:flex-start;">Usar o valor calculado</button>
        </div>
      </div>

      <div class="price-tile" id="priceTile"></div>
      <div id="pisoNote"></div>

      <button class="btn btn-primary btn-block" id="btnSalvarCatalogo">Salvar no catálogo</button>
    </div>
  `, ()=>{
    populateMaterialSelect();
    populateImpressoraSelect();
    ['cNome','cGram','cTempoH','cTempoM','cEmb','cPrecoFinal'].forEach(id=>{
      document.getElementById(id).addEventListener('input', recomputeCalc);
    });
    document.getElementById('cMaterial').addEventListener('change', recomputeCalc);
    document.getElementById('cImpressora').addEventListener('change', recomputeCalc);
    document.getElementById('btnSalvarCatalogo').addEventListener('click', saveCurrentCalcToCatalogo);

    const cChk = document.getElementById('cUsarAjuste');
    cChk.addEventListener('change', ()=>{
      document.getElementById('cAjusteBox').style.display = cChk.checked ? 'flex' : 'none';
      if(cChk.checked){
        const r = calcPreco(readCalcDraft(), state.config);
        document.getElementById('cPrecoFinal').value = r.precoFinal.toFixed(2);
      }
      recomputeCalc();
    });
    document.getElementById('cReset').addEventListener('click', ()=>{
      const r = calcPreco(readCalcDraft(), state.config);
      document.getElementById('cPrecoFinal').value = r.precoFinal.toFixed(2);
      recomputeCalc();
    });

    recomputeCalc();
  });
}

function populateMaterialSelect(){
  const sel = document.getElementById('cMaterial');
  if(!sel) return;
  const prev = sel.value;
  sel.innerHTML = state.materiais.map(m=>`<option value="${m.id}">${m.nome} — ${m.marca} (${fmtBRL(m.preco_kg)}/kg)</option>`).join('');
  if(prev && byId(state.materiais, prev)) sel.value = prev;
}

function populateImpressoraSelect(){
  const sel = document.getElementById('cImpressora');
  if(!sel) return;
  const prev = sel.value;
  sel.innerHTML = state.impressoras.map(i=>`<option value="${i.id}">${i.nome}</option>`).join('');
  if(prev && byId(state.impressoras, prev)) sel.value = prev;
}

function readCalcDraft(){
  const matId = document.getElementById('cMaterial')?.value;
  const impId = document.getElementById('cImpressora')?.value;
  const h = Number(document.getElementById('cTempoH')?.value) || 0;
  const m = Number(document.getElementById('cTempoM')?.value) || 0;
  return {
    nome: document.getElementById('cNome')?.value.trim() || '',
    material_id: matId,
    material: byId(state.materiais, matId),
    impressora_id: impId,
    impressora: byId(state.impressoras, impId),
    gramatura: document.getElementById('cGram')?.value,
    tempo_horas: h + m/60,
    custo_embalagem: document.getElementById('cEmb')?.value,
  };
}

function recomputeCalc(){
  const draft = readCalcDraft();
  const r = calcPreco(draft, state.config);
  const rows = [
    ['Custo Material', r.custoMaterial],
    ['Custo Energia', r.custoEnergia],
    ['Custo Desgaste', r.custoDesgaste],
    ['Subtotal', r.subtotal],
    [`Custo Falhas (${fmtNum(state.config.falha_pct*100,0)}%)`, r.custoFalhas],
    ['Custo Técnico', r.custoTecnico],
    ['Mão de Obra', r.custoMaoObra],
    ['Embalagem', r.custoEmbalagem],
  ];
  document.getElementById('breakdownCard').innerHTML =
    rows.map(([l,v])=>`<div class="breakdown-row"><span class="lbl">${l}</span><span class="mono">${fmtBRL(v)}</span></div>`).join('') +
    `<div class="breakdown-row total"><span class="lbl">Custo Total</span><span class="mono">${fmtBRL(r.custoTotal)}</span></div>` +
    `<div class="breakdown-row"><span class="lbl">Lucro (${fmtNum(state.config.margem_pct*100,0)}% markup)</span><span class="mono">${fmtBRL(r.lucro)}</span></div>`;

  const usarAjuste = document.getElementById('cUsarAjuste')?.checked;
  let precoExibido = r.precoFinal;
  let ajusteInfo = '';
  if(usarAjuste){
    const raw = document.getElementById('cPrecoFinal')?.value.trim();
    const desejado = raw==='' ? r.precoFinal : Number(raw);
    precoExibido = isFinite(desejado) ? desejado : r.precoFinal;
    const ajuste = precoExibido - r.precoFinal;
    if(ajuste !== 0){
      ajusteInfo = `<div class="cap" style="margin-top:2px;">Calculado ${fmtBRL(r.precoFinal)} ${ajuste>0?'+':'−'} ${fmtBRL(Math.abs(ajuste))}</div>`;
    }
  }
  document.getElementById('priceTile').innerHTML = `<div class="cap">Preço final</div><div class="num">${fmtBRL(precoExibido)}</div>${ajusteInfo}`;
  document.getElementById('pisoNote').innerHTML = r.pisoAplicado
    ? `<div class="row" style="justify-content:center;margin-top:-6px;"><span class="badge badge-warn">Piso de ${fmtBRL(state.config.preco_minimo)} aplicado</span></div>` : '';
}

function saveCurrentCalcToCatalogo(){
  const draft = readCalcDraft();
  const scope = document.getElementById('modalBackdrop') || document.getElementById('main');
  clearFieldErrors(scope);
  let temErro = false;
  if(!draft.nome){ markFieldError(document.getElementById('cNome'), 'Dá um nome pra peça'); temErro=true; }
  if(!draft.material_id){ markFieldError(document.getElementById('cMaterial'), 'Cadastre um material em Admin primeiro'); temErro=true; }
  if(!draft.impressora_id){ markFieldError(document.getElementById('cImpressora'), 'Cadastre uma impressora em Admin primeiro'); temErro=true; }
  if(!(Number(draft.gramatura)>0)){ markFieldError(document.getElementById('cGram'), 'Informe a gramatura da peça'); temErro=true; }
  if(!(Number(draft.tempo_horas)>0)){ markFieldErrorPair(document.getElementById('cTempoH'), document.getElementById('cTempoM'), 'Informe o tempo de máquina'); temErro=true; }
  if(temErro){ showToast('Confere os campos destacados'); focusFirstInvalid(scope); return; }
  const r = calcPreco(draft, state.config);
  let ajuste_manual = 0;
  if(document.getElementById('cUsarAjuste')?.checked){
    const raw = document.getElementById('cPrecoFinal')?.value.trim();
    const desejado = raw==='' ? r.precoFinal : Number(raw);
    ajuste_manual = isFinite(desejado) ? (desejado - r.precoFinal) : 0;
  }
  const data = {
    nome: draft.nome,
    material_id: draft.material_id,
    impressora_id: draft.impressora_id,
    gramatura: Number(draft.gramatura)||0,
    tempo_horas: Number(draft.tempo_horas)||0,
    custo_embalagem: Number(draft.custo_embalagem)||0,
    ajuste_manual,
    criado_em: new Date().toISOString(),
  };
  if(!state.dbOk){
    data.id = uid();
    state.produtos = [data, ...state.produtos];
    closeModal();
    if(state.tab==='catalogo') renderMain();
    showToast('Salvo (modo local, sem nuvem)');
    return;
  }
  state.db.collection('produtos').add(data).then(()=>{
    closeModal();
    showToast('Salvo no catálogo');
  }).catch(()=> showToast('Não deu pra salvar agora, tenta de novo'));
}

function renderCatalogo(main){
  const produtos = state.produtos;
  if(produtos.length===0){
    main.innerHTML = `${offlineBanner()}<div class="empty">${iconEmptyBox()}<h3>Nenhuma peça salva ainda</h3><p>Clique em "Adicionar Produto" pra calcular o preço e salvar sua primeira peça no catálogo.</p><button class="btn btn-primary" id="goCalc">Adicionar Produto</button></div>`;
    document.getElementById('goCalc').addEventListener('click', abrirNovoProduto);
    return;
  }
  main.innerHTML = `${offlineBanner()}
    <div class="row" style="justify-content:space-between; margin-bottom:2px; gap:8px; flex-wrap:wrap;">
      <p class="section-label" style="margin-bottom:0;">${produtos.length} peça${produtos.length>1?'s':''} no catálogo</p>
      <div class="row" style="gap:8px; flex-wrap:wrap;">
        <button class="btn btn-sm btn-primary" id="btnAdicionarProduto">Adicionar Produto</button>

    </div>

  const grid = document.getElementById('catGrid');
  grid.innerHTML = produtos.map(p=>{
    const material = byId(state.materiais, p.material_id);
    const impressora = byId(state.impressoras, p.impressora_id);
    const r = precoAjustado(p, state.config);
    const ajusteLine = r.ajuste !== 0
      ? `<div class="meta">Calculado ${fmtBRL(r.precoCalculado)} ${r.ajuste>0?'+':'−'} ${fmtBRL(Math.abs(r.ajuste))} de ajuste</div>` : '';
    return `<div class="item-card">
      <div class="top-row">
        <div>
          <h3>${p.nome}</h3>
          <div class="meta">${material? material.nome+' · '+material.marca : 'material removido'} · ${fmtNum(p.gramatura,0)}g · ${fmtTempo(p.tempo_horas)}</div>
          <div class="meta">${impressora ? '🖨️ '+impressora.nome : 'impressora removida'}</div>
          ${ajusteLine}
        </div>
        <div class="price mono">${fmtBRL(r.precoFinal)}</div>
      </div>
      <div class="actions">
        <button class="btn btn-sm" data-edit="${p.id}">Editar</button>
        <button class="btn btn-sm" data-dup="${p.id}">Duplicar</button>
        <button class="btn btn-sm" data-add-orc="${p.id}">+ Orçamento</button>
        <button class="btn btn-sm btn-ghost" data-del="${p.id}">Excluir</button>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=> openProdutoEditor(b.dataset.edit));
  });
  grid.querySelectorAll('[data-dup]').forEach(b=>{
    b.addEventListener('click', ()=> openProdutoEditor(b.dataset.dup, true));
  });
  grid.querySelectorAll('[data-add-orc]').forEach(b=>{
    b.addEventListener('click', ()=> openOrcamentoBuilder(null, b.dataset.addOrc));
  });
  grid.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=> confirmThenDelete(b, ()=> deleteProduto(b.dataset.del)));
  });
}

function gerarTextoCatalogo(produtos){
  if(!produtos || produtos.length===0) return '';
  let txt = `● *Catálogo Biri Prints 3D*\n\n`;
  produtos.forEach(p=>{
    const r = precoAjustado(p, state.config);
    txt += `◆ *${p.nome}* — ${fmtBRL(r.precoFinal)}\n`;
  });
  txt += `\n_Valores sujeitos a alteração._`;
  const promoAtiva = (state.promocoes||[]).some(promo => promocaoStatus(promo)==='ativa');
  if(promoAtiva){
    txt += `\n\n▲ Kits com desconto disponíveis nesse período — me chama!`;
  }
  return txt;
}

async function copiarOuCompartilharTexto(txt){
  if(navigator.share){
    try{
      await navigator.share({text: txt});
      showToast('Compartilhado');
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // usuário cancelou o compartilhamento
      // outro erro (ex.: não suportado nesse navegador) -> cai pro clipboard
    }
  }
  const done = () => showToast('Lista copiada');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else {
    fallbackCopy(txt, done);
  }
}

function openCompartilharCatalogo(){
  if(state.produtos.length===0){ showToast('Cadastre peças no catálogo primeiro'); return; }
  const checks = state.produtos.map(p=>`
    <label class="row" style="gap:9px; cursor:pointer;">
      <input type="checkbox" class="share-prod-chk" data-id="${p.id}" checked style="width:18px;height:18px;flex:none;">
      <span style="font-size:.86rem; flex:1;">${p.nome}</span>
    </label>`).join('');

  openModal('Compartilhar catálogo', `
    <div class="stack">
      <div>
        <p class="section-label">Peças a incluir</p>
        <div class="stack" style="max-height:220px; overflow-y:auto;">${checks}</div>
      </div>
      <div>
        <p class="section-label">Prévia</p>
        <textarea class="ipt mono" id="shPreview" readonly rows="10" style="resize:vertical; white-space:pre-wrap;"></textarea>
      </div>
      <button class="btn btn-primary btn-block" id="shCopiar">Copiar / Compartilhar</button>
    </div>
  `, (bd)=>{
    const atualizarPreview = ()=>{
      const idsSelecionados = new Set([...bd.querySelectorAll('.share-prod-chk:checked')].map(c=>c.dataset.id));
      const selecionados = state.produtos.filter(p=>idsSelecionados.has(p.id));
      bd.querySelector('#shPreview').value = gerarTextoCatalogo(selecionados);
    };
    atualizarPreview();
    bd.querySelectorAll('.share-prod-chk').forEach(chk=> chk.addEventListener('change', atualizarPreview));
    bd.querySelector('#shCopiar').addEventListener('click', ()=>{
      const idsSelecionados = new Set([...bd.querySelectorAll('.share-prod-chk:checked')].map(c=>c.dataset.id));
      if(idsSelecionados.size===0){ showToast('Selecione pelo menos uma peça'); return; }
      copiarOuCompartilharTexto(bd.querySelector('#shPreview').value);
    });
  });
}

function openProdutoEditor(id, duplicar){
  const existing = byId(state.produtos, id);
  if(!existing) return;
  const totalMin = Math.round((Number(existing.tempo_horas)||0) * 60);
  const initH = Math.floor(totalMin/60), initM = totalMin%60;
  const ajusteAtual = Number(existing.ajuste_manual)||0;
  const nomeInicial = duplicar ? `${existing.nome} (cópia)` : existing.nome;
  const materialOptions = state.materiais.map(m=>
    `<option value="${m.id}" ${m.id===existing.material_id?'selected':''}>${m.nome} — ${m.marca} (${fmtBRL(m.preco_kg)}/kg)</option>`
  ).join('');
  const impressoraOptionsPadrao = state.impressoras.map(i=>
    `<option value="${i.id}" ${i.id===existing.impressora_id?'selected':''}>${i.nome}</option>`
  ).join('');

  openModal(duplicar?'Duplicar peça':'Editar peça', `
    ${duplicar?'<p style="font-size:.8rem;color:var(--text-muted);margin:0 0 4px;">Revise os dados abaixo e salve — isso cria uma peça nova, sem alterar a original.</p>':''}
    <div class="stack">
      <label class="field"><span>Nome da peça<span class="req">*</span></span><input class="ipt" id="epNome" value="${nomeInicial}"></label>
      <div class="grid-2">
        <label class="field"><span>Material<span class="req">*</span></span><select class="ipt" id="epMaterial">${materialOptions}</select></label>
        <label class="field"><span>Impressora padrão<span class="req">*</span></span><select class="ipt" id="epImpressora">${impressoraOptionsPadrao}</select></label>
      </div>
      <div class="grid-2">
        <label class="field"><span>Gramatura (g)<span class="req">*</span></span><input class="ipt" id="epGram" type="number" step="0.1" value="${existing.gramatura}"></label>
        <label class="field"><span>Custo de embalagem (R$)</span><input class="ipt" id="epEmb" type="number" step="0.01" value="${Number(existing.custo_embalagem)||0}"></label>
      </div>
      <div class="field">
        <span>Tempo de máquina<span class="req">*</span></span>
        <div class="row" style="gap:6px;">
          <input class="ipt time-input" id="epTempoH" type="number" min="0" step="1" value="${initH}">
          <span class="unit-suffix">h</span>
          <input class="ipt time-input" id="epTempoM" type="number" min="0" max="59" step="1" value="${initM}">
          <span class="unit-suffix">min</span>
        </div>
      </div>

      <div class="breakdown-row"><span class="lbl">Preço calculado pela fórmula</span><span class="mono" id="epCalculado"></span></div>

      <label class="row" style="gap:9px; cursor:pointer;">
        <input type="checkbox" id="epUsarAjuste" style="width:18px;height:18px;flex:none;">
        <span style="font-size:.86rem;">Definir um preço manual (ajuste de mercado)</span>
      </label>
      <div id="epAjusteBox" class="stack" style="display:none;">
        <label class="field">
          <span>Preço final (R$)</span>
          <input class="ipt" id="epPrecoFinal" type="number" step="0.01">
        </label>
        <button type="button" class="textbtn" id="epReset" style="align-self:flex-start;">Usar o valor calculado</button>
        <p style="font-size:.76rem;color:var(--text-muted);margin:0;">Some por cima do valor calculado — se você mudar material, gramatura, tempo etc. depois, o cálculo se atualiza sozinho e esse ajuste continua sendo aplicado em cima do novo valor.</p>
      </div>
      <p id="epSemAjusteNote" style="font-size:.76rem;color:var(--text-muted);margin:0;">Sem essa opção marcada, o preço final é sempre o valor calculado pela fórmula, acima.</p>

      <div>
        <p class="section-label">Perfis por impressora (opcional)</p>
        <p style="font-size:.76rem;color:var(--text-muted);margin:0 0 8px;">Se essa peça leva um tempo ou gramatura diferente em outra impressora, cadastre o perfil aqui. Sem perfil, a peça usa os valores acima em qualquer impressora escolhida num orçamento.</p>
        <div class="stack" id="epPerfis"></div>
        <button type="button" class="textbtn" id="epAddPerfil" style="align-self:flex-start;">+ Adicionar perfil de impressora</button>
      </div>

      <button class="btn btn-primary btn-block" id="epSave">${duplicar?'Salvar como nova peça':'Salvar alterações'}</button>
    </div>
  `, (bd)=>{
    const readDraftAndRecalc = () => {
      const material = byId(state.materiais, bd.querySelector('#epMaterial').value);
      const impressora = byId(state.impressoras, bd.querySelector('#epImpressora').value);
      const gramatura = bd.querySelector('#epGram').value;
      const h = Number(bd.querySelector('#epTempoH').value)||0, m = Number(bd.querySelector('#epTempoM').value)||0;
      const custo_embalagem = bd.querySelector('#epEmb').value;
      const r = calcPreco({material, impressora, gramatura, tempo_horas: h+m/60, custo_embalagem}, state.config);
      bd.querySelector('#epCalculado').textContent = fmtBRL(r.precoFinal);
      return r;
    };
    let lastCalc = readDraftAndRecalc();

    const chk = bd.querySelector('#epUsarAjuste');
    const box = bd.querySelector('#epAjusteBox');
    const semAjusteNote = bd.querySelector('#epSemAjusteNote');
    const syncBoxVisibility = () => {
      box.style.display = chk.checked ? 'flex' : 'none';
      semAjusteNote.style.display = chk.checked ? 'none' : 'block';
    };
    chk.checked = ajusteAtual !== 0;
    bd.querySelector('#epPrecoFinal').value = (lastCalc.precoFinal + ajusteAtual).toFixed(2);
    syncBoxVisibility();

    chk.addEventListener('change', ()=>{
      if(chk.checked){ bd.querySelector('#epPrecoFinal').value = (lastCalc.precoFinal + ajusteAtual).toFixed(2); }
      syncBoxVisibility();
    });

    ['epMaterial','epImpressora','epGram','epTempoH','epTempoM','epEmb'].forEach(id=>{
      bd.querySelector('#'+id).addEventListener('input', ()=>{ lastCalc = readDraftAndRecalc(); });
    });
    bd.querySelector('#epImpressora').addEventListener('change', ()=>{ lastCalc = readDraftAndRecalc(); renderPerfis(); });
    bd.querySelector('#epReset').addEventListener('click', ()=>{
      bd.querySelector('#epPrecoFinal').value = lastCalc.precoFinal.toFixed(2);
    });

    // ---- perfis por impressora (tempo/gramatura alternativos) ----
    let perfis = existing.perfis_impressora
      ? Object.entries(existing.perfis_impressora).map(([impressora_id, v])=>({impressora_id, gramatura:v.gramatura, tempo_horas:v.tempo_horas}))
      : [];
    const renderPerfis = ()=>{
      const box2 = bd.querySelector('#epPerfis');
      const impressoraPadraoId = bd.querySelector('#epImpressora').value;
      box2.innerHTML = perfis.length ? perfis.map((pf,i)=>{
        const outrosEscolhidos = perfis.filter((_,j)=>j!==i).map(p=>p.impressora_id).concat([impressoraPadraoId]);
        const opts = state.impressoras.filter(imp=> !outrosEscolhidos.includes(imp.id) || imp.id===pf.impressora_id)
          .map(imp=>`<option value="${imp.id}" ${imp.id===pf.impressora_id?'selected':''}>${imp.nome}</option>`).join('');
        const totalMin2 = Math.round((Number(pf.tempo_horas)||0)*60);
        const ph = Math.floor(totalMin2/60), pm = totalMin2%60;
        return `<div class="card" style="padding:10px;">
          <div class="stack">
            <div class="grid-2">
              <select class="ipt perfil-imp" data-idx="${i}">${opts}</select>
              <input class="ipt perfil-gram" data-idx="${i}" type="number" step="0.1" value="${pf.gramatura}" placeholder="Gramatura (g)">
            </div>
            <div class="row" style="gap:6px;">
              <input class="ipt time-input perfil-h" data-idx="${i}" type="number" min="0" step="1" value="${ph}">
              <span class="unit-suffix">h</span>
              <input class="ipt time-input perfil-m" data-idx="${i}" type="number" min="0" max="59" step="1" value="${pm}">
              <span class="unit-suffix">min</span>
              <button type="button" class="btn btn-ghost btn-sm" data-rm-perfil="${i}">✕</button>
            </div>
          </div>
        </div>`;
      }).join('') : `<p style="color:var(--text-muted); font-size:.8rem;">Nenhum perfil alternativo cadastrado.</p>`;

      box2.querySelectorAll('.perfil-imp').forEach(sel=> sel.addEventListener('change', ()=>{ perfis[Number(sel.dataset.idx)].impressora_id = sel.value; renderPerfis(); }));
      box2.querySelectorAll('.perfil-gram').forEach(inp=> inp.addEventListener('input', ()=>{ perfis[Number(inp.dataset.idx)].gramatura = inp.value; }));
      box2.querySelectorAll('.perfil-h, .perfil-m').forEach(inp=> inp.addEventListener('input', ()=>{
        const idx = Number(inp.dataset.idx);
        const hh = Number(box2.querySelector(`.perfil-h[data-idx="${idx}"]`).value)||0;
        const mm = Number(box2.querySelector(`.perfil-m[data-idx="${idx}"]`).value)||0;
        perfis[idx].tempo_horas = hh + mm/60;
      }));
      box2.querySelectorAll('[data-rm-perfil]').forEach(b=> b.addEventListener('click', ()=>{ perfis.splice(Number(b.dataset.rmPerfil),1); renderPerfis(); }));
    };
    renderPerfis();

    bd.querySelector('#epAddPerfil').addEventListener('click', ()=>{
      const usados = perfis.map(p=>p.impressora_id).concat([bd.querySelector('#epImpressora').value]);
      const disponivel = state.impressoras.find(imp=> !usados.includes(imp.id));
      if(!disponivel){ showToast('Cadastre outra impressora em Admin pra adicionar um perfil'); return; }
      perfis.push({impressora_id: disponivel.id, gramatura: existing.gramatura||0, tempo_horas: existing.tempo_horas||0});
      renderPerfis();
    });

    bd.querySelector('#epSave').addEventListener('click', ()=>{
      clearFieldErrors(bd);
      const nome = bd.querySelector('#epNome').value.trim();
      const material_id = bd.querySelector('#epMaterial').value;
      const impressora_id = bd.querySelector('#epImpressora').value;
      const gramatura = Number(bd.querySelector('#epGram').value)||0;
      const h = Number(bd.querySelector('#epTempoH').value)||0, m = Number(bd.querySelector('#epTempoM').value)||0;
      let temErro = false;
      if(!nome){ markFieldError(bd.querySelector('#epNome'), 'Dá um nome pra peça'); temErro=true; }
      if(!material_id){ markFieldError(bd.querySelector('#epMaterial'), 'Cadastre um material em Admin primeiro'); temErro=true; }
      if(!impressora_id){ markFieldError(bd.querySelector('#epImpressora'), 'Cadastre uma impressora em Admin primeiro'); temErro=true; }
      if(!(gramatura>0)){ markFieldError(bd.querySelector('#epGram'), 'Informe a gramatura da peça'); temErro=true; }
      if(!((h + m/60)>0)){ markFieldErrorPair(bd.querySelector('#epTempoH'), bd.querySelector('#epTempoM'), 'Informe o tempo de máquina'); temErro=true; }
      if(temErro){ showToast('Confere os campos destacados'); focusFirstInvalid(bd); return; }
      const custo_embalagem = Number(bd.querySelector('#epEmb').value)||0;
      const material = byId(state.materiais, material_id);
      const impressora = byId(state.impressoras, impressora_id);
      const r = calcPreco({material, impressora, gramatura, tempo_horas: h+m/60, custo_embalagem}, state.config);
      let ajuste_manual = 0;
      if(chk.checked){
        const raw = bd.querySelector('#epPrecoFinal').value.trim();
        const precoFinalDesejado = raw==='' ? r.precoFinal : Number(raw);
        ajuste_manual = isFinite(precoFinalDesejado) ? (precoFinalDesejado - r.precoFinal) : 0;
      }
      const perfis_impressora = {};
      perfis.forEach(p=>{ if(p.impressora_id) perfis_impressora[p.impressora_id] = {gramatura:Number(p.gramatura)||0, tempo_horas:Number(p.tempo_horas)||0}; });
      const data = {nome, material_id, impressora_id, gramatura, tempo_horas: h+m/60, custo_embalagem, ajuste_manual, perfis_impressora};

      if(duplicar){
        if(!state.dbOk){
          data.id = uid(); data.criado_em = new Date().toISOString();
          state.produtos = [data, ...state.produtos];
          closeModal(); state.tab='catalogo'; renderNav(); renderMain(); showToast('Peça duplicada (modo local)');
          return;
        }
        state.db.collection('produtos').add({...data, criado_em: new Date().toISOString()})
          .then(()=>{ closeModal(); showToast('Peça duplicada'); })
          .catch(()=> showToast('Não deu pra salvar agora'));
        return;
      }

      if(!state.dbOk){ Object.assign(existing, data); closeModal(); renderMain(); showToast('Salvo (modo local)'); return; }
      state.db.collection('produtos').doc(existing.id).update(data)
        .then(()=>{ closeModal(); showToast('Peça atualizada'); })
        .catch(()=> showToast('Não deu pra salvar agora'));
    });
  });
}

function confirmThenAction(btn, onConfirm, opts={}){
  const confirmText = opts.confirmText || 'Confirmar?';
  const confirmClass = opts.confirmClass || 'btn-danger';
  if(btn.dataset.confirming){ onConfirm(); return; }
  btn.dataset.confirming='1';
  const original = btn.textContent;
  btn.textContent = confirmText;
  btn.classList.add(confirmClass);
  setTimeout(()=>{ if(btn.isConnected){ btn.dataset.confirming=''; btn.textContent=original; btn.classList.remove(confirmClass); } }, 2500);
}
function confirmThenDelete(btn, onConfirm){ confirmThenAction(btn, onConfirm, {confirmText:'Confirmar?', confirmClass:'btn-danger'}); }

function deleteProduto(id){
  if(!state.dbOk){ state.produtos = state.produtos.filter(p=>p.id!==id); renderMain(); return; }
  state.db.collection('produtos').doc(id).delete().then(()=>showToast('Peça removida')).catch(()=>showToast('Não deu pra excluir agora'));
}

/* ================= ORÇAMENTOS ================= */
// Status "rascunho" é o padrão — um orçamento antigo sem o campo `status` (de antes dessa
// distinção existir) conta como rascunho também, nunca fica "orfão" fora dos filtros.
const statusOrcamento = o => (o.status==='enviado' || o.status==='pedido') ? o.status : 'rascunho';

// Depois que um orçamento vira pedido, ele ganha um sub-status próprio de acompanhamento de
// produção/entrega (independente do status "rascunho/enviado/pedido" acima). "aberto" é o padrão
// pra pedido sem esse campo ainda. "Pago" é um campo à parte (booleano), não uma etapa dessa
// sequência — o vendedor pode cobrar adiantado ou só na entrega.
const PEDIDO_STAGES = [
  {v:'aberto', label:'Aberto'},
  {v:'em_producao', label:'Em produção'},
  {v:'pronto', label:'Pronto'},
  {v:'entregue', label:'Entregue'},
];
const PEDIDO_BADGE_CLASS = {aberto:'badge-muted', em_producao:'badge-warn', pronto:'badge-accent', entregue:'badge-pedido', cancelado:'badge-danger'};
const PEDIDO_BADGE_LABEL = {aberto:'Aberto', em_producao:'Em produção', pronto:'Pronto', entregue:'Entregue', cancelado:'Cancelado'};
const statusPedido = o => o.status_pedido || 'aberto';

function proximoNumero(campo){
  return state.orcamentos.reduce((m,o)=> Math.max(m, Number(o[campo])||0), 0) + 1;
}

function vendedorOptionsHtml(selecionadoId, {incluirTodos=false} = {}){
  const visiveis = state.vendedores.filter(v=> v.ativo!==false || v.id===selecionadoId);
  let html = incluirTodos ? `<option value="todos" ${selecionadoId==='todos'?'selected':''}>Todos os vendedores</option>` : `<option value="">— sem vendedor —</option>`;
  html += visiveis.map(v=>`<option value="${v.id}" ${selecionadoId===v.id?'selected':''}>${v.nome}${v.ativo===false?' (inativo)':''}</option>`).join('');
  return html;
}
// Filtro de vendedor lista TODOS os vendedores (inclusive inativos) já que serve pra achar coisas
// do passado, não só pra escolher um vendedor novo. Uma linha de filtros compartilhada pelas duas
// abas (Orçamentos e Pedidos) — cada uma passa seus próprios ids de elemento/campos de state.
function vendedorFiltroOptionsHtml(selecionado){
  let html = `<option value="todos" ${selecionado==='todos'?'selected':''}>Todos os vendedores</option>`;
  html += state.vendedores.map(v=>`<option value="${v.id}" ${selecionado===v.id?'selected':''}>${v.nome}${v.ativo===false?' (inativo)':''}</option>`).join('');
  return html;
}
function filtrosClienteVendedorHtml(idCliente, idVendedor, valCliente, valVendedor){

    <div class="row" style="gap:8px; flex-wrap:wrap; margin-bottom:10px;">
      <input class="ipt" id="${idCliente}" placeholder="Filtrar por cliente..." value="${valCliente||''}" style="max-width:220px;">
      <select class="ipt" id="${idVendedor}" style="max-width:200px;">${vendedorFiltroOptionsHtml(valVendedor||'todos')}</select>
    </div>`;
}

// Mesmo texto usado pelo "Copiar resumo" e pelo "Enviar por WhatsApp" (ver enviarOrcamentoWhatsApp
// abaixo) — os ícones ■/◆ são símbolos geométricos simples (nunca tratados como emoji de verdade),
// de propósito: um emoji de verdade chega corrompido quando o texto passa por uma URL wa.me/
// api.whatsapp.com?text=... na hora de abrir o link (testado no celular na versão principal do app).
function gerarTextoOrcamento(o){
  let txt = `■ *Orçamento${o.cliente? ' — '+o.cliente : ''}*\n_${new Date(o.criado_em).toLocaleDateString('pt-BR')}_\n\n`;
  o.itens.forEach(it=>{ txt += `◆ *${it.nome}* × ${fmtNum(it.quantidade,0)} — ${fmtBRL(it.preco_unit*it.quantidade)}\n`; });
  if(o.desconto_kit_total>0){
    txt += `\nSubtotal: ${fmtBRL(o.subtotal)}\n`;
    (o.desconto_kit_linhas||[]).forEach(l=>{ txt += `_Desconto de kit — ${l.promoNome} (${fmtNum(l.pct,0)}%): − ${fmtBRL(l.desconto)}_\n`; });
  }
  txt += `\n*Total: ${fmtBRL(o.total)}*`;
  return txt;
}
function copyOrcamentoResumo(id){
  const o = byId(state.orcamentos, id);
  if(!o) return;
  const txt = gerarTextoOrcamento(o);
  const done = ()=>showToast('Resumo copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ showToast('Não consegui copiar'); }
  ta.remove();
}
// Aceita número com ou sem DDI, com ou sem formatação (parênteses, traço, espaço).
// Sem DDI, assume Brasil (55) — é o público desse app.
function normalizarTelefoneWhatsApp(tel){
  const digitos = (tel||'').replace(/\D/g,'');
  if(!digitos) return '';
  if(digitos.startsWith('55') && (digitos.length===12 || digitos.length===13)) return digitos;
  if(digitos.length===10 || digitos.length===11) return '55'+digitos; // sem DDI -> assume Brasil
  return digitos; // já veio com outro DDI, ou formato inesperado — manda como está
}
function enviarOrcamentoWhatsApp(id){
  const o = byId(state.orcamentos, id);
  if(!o) return;
  const txt = gerarTextoOrcamento(o);
  const tel = normalizarTelefoneWhatsApp(o.cliente_telefone);
  // Com telefone: abre a conversa direto com esse contato (wa.me/<numero>).
  // Sem telefone: link "genérico" do WhatsApp, que deixa a pessoa escolher o contato na hora.
  const url = tel
    ? `https://wa.me/${tel}?text=${encodeURIComponent(txt)}`
    : `https://api.whatsapp.com/send?text=${encodeURIComponent(txt)}`;
  if(!tel) showToast('Sem WhatsApp salvo — escolha o contato na hora de enviar');
  abrirLinkExterno(url);
}
// Abre um link externo usando um <a> "de verdade" (criado, clicado e removido na hora), em vez de
// window.open() — alguns navegadores/webviews bloqueiam popups abertos via script mas continuam
// respeitando o clique num link real com target="_blank".
function abrirLinkExterno(url){
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function toggleOrcamentoStatus(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  const novo = o.status==='enviado' ? 'rascunho' : 'enviado';
  if(!state.dbOk){ o.status=novo; renderMain(); return; }
  state.db.collection('orcamentos').doc(id).update({status:novo}).catch(()=>showToast('Não deu pra atualizar agora'));
}
function deleteOrcamento(id){
  if(!state.dbOk){ state.orcamentos = state.orcamentos.filter(o=>o.id!==id); renderMain(); return; }
  state.db.collection('orcamentos').doc(id).delete().then(()=>showToast('Orçamento removido')).catch(()=>showToast('Não deu pra excluir agora'));
}

        <button class="btn btn-sm ${filtro==='cancelado'?'btn-primary':''}" data-filtro-ped="cancelado">Cancelados (${contagemPed.cancelado})</button>
