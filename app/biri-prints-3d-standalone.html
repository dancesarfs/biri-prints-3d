// Marca a venda como fechada, depois que o cliente aprovou o orçamento. Guarda quando isso
// aconteceu (convertido_em) — não é usado em nenhum cálculo, é só registro. Pedido tem um botão
// de reverter (reverterPedido) pra corrigir um clique errado sem precisar excluir e refazer tudo.
function converterEmPedido(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  // status_pedido sempre reinicia em "aberto" (mesmo se esse pedido já tinha sido revertido antes
  // e está sendo convertido de novo). "pago" é preservado: se o cliente já tinha pago antes de uma
  // reversão por engano, não faz sentido esquecer isso ao converter de novo. O vendedor do PEDIDO é
  // sempre quem está usando o app AGORA (vendedor atual) — pode ser diferente de quem criou o
  // orçamento original (vendedor_id) —, e o número do pedido é atribuído só aqui, na conversão.
  const vendedorAtual = state.vendedorAtualId ? byId(state.vendedores, state.vendedorAtualId) : null;
  const data = {
    status:'pedido', convertido_em: new Date().toISOString(), status_pedido:'aberto', pago: o.pago===true,
    pedido_numero: proximoNumero('pedido_numero'),
    vendedor_pedido_id: vendedorAtual?.id || null, vendedor_pedido_nome: vendedorAtual?.nome || '',
  };
  if(!state.dbOk){ Object.assign(o, data); renderMain(); showToast('Orçamento convertido em pedido!'); return; }
  state.db.collection('orcamentos').doc(id).update(data)
    .then(()=>showToast('Orçamento convertido em pedido!'))
    .catch(()=>showToast('Não deu pra converter agora'));
}
function reverterPedido(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  const data = {status:'enviado', convertido_em: null, status_pedido: null, pedido_numero: null, vendedor_pedido_id: null, vendedor_pedido_nome: null};
  if(!state.dbOk){ Object.assign(o, data); renderMain(); showToast('Voltou a ser orçamento'); return; }
  state.db.collection('orcamentos').doc(id).update(data)
    .then(()=>showToast('Voltou a ser orçamento'))
    .catch(()=>showToast('Não deu pra reverter agora'));
}
// Troca o vendedor ATRIBUÍDO AO PEDIDO (quem converteu/está tocando a venda) — independente do
// vendedor que criou o orçamento original (vendedor_id, nunca muda depois de criado).
function setVendedorPedido(id, vendedorId){
  const o = byId(state.orcamentos, id); if(!o) return;
  const v = vendedorId ? byId(state.vendedores, vendedorId) : null;
  const data = {vendedor_pedido_id: v?.id || null, vendedor_pedido_nome: v?.nome || ''};
  if(!state.dbOk){ Object.assign(o, data); renderMain(); return; }
  state.db.collection('orcamentos').doc(id).update(data).catch(()=>showToast('Não deu pra atualizar agora'));
}
// "Copiar orçamento" — pra um orçamento encerrado (virou pedido) ou pra duplicar rápido um
// orçamento aberto. Sempre cria um orçamento NOVO (nunca edita o original): abre o construtor já
// preenchido, recalculando os itens de catálogo pelas condições comerciais de HOJE e assumindo o
// vendedor ATUAL como responsável pela cópia.
function copiarOrcamento(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  openOrcamentoBuilder(null, null, o);
}
// Avança/retrocede o pedido pela sequência Aberto -> Em produção -> Pronto -> Entregue (o
// vendedor escolhe livremente no seletor, sem precisar passar etapa por etapa nem confirmar).
// Bloqueia especificamente a transição para "Em produção" enquanto houver alguma peça com
// personalização pendente (cor/texto ainda não escolhido) — pedidos sem personalização, ou já
// preenchidos, seguem livres; pedidos antigos que já passaram dessa etapa antes dessa checagem
// existir também nunca são afetados retroativamente (o bloqueio só entra na hora dessa transição).
function setStatusPedido(id, novoStatus){
  const o = byId(state.orcamentos, id); if(!o) return;
  if(novoStatus==='em_producao' && pedidoTemPersonalizacaoPendente(o)){
    showToast('Falta preencher a personalização de alguma peça antes de avançar para "Em produção"');
    renderMain();
    return;
  }
  if(!state.dbOk){ o.status_pedido = novoStatus; renderMain(); return; }
  state.db.collection('orcamentos').doc(id).update({status_pedido:novoStatus}).catch(()=>showToast('Não deu pra atualizar agora'));
}
// Cancelar é a única transição de status_pedido com confirmação de 2 cliques — diferente de mudar
// entre Aberto/Em produção/Pronto/Entregue, cancelar comunica "essa venda não vai acontecer".
function cancelarPedido(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  const data = {status_pedido:'cancelado'};
  if(!state.dbOk){ Object.assign(o, data); renderMain(); showToast('Pedido cancelado'); return; }
  state.db.collection('orcamentos').doc(id).update(data)
    .then(()=>showToast('Pedido cancelado'))
    .catch(()=>showToast('Não deu pra cancelar agora'));
}
function reabrirPedido(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  const data = {status_pedido:'aberto'};
  if(!state.dbOk){ Object.assign(o, data); renderMain(); showToast('Pedido reaberto'); return; }
  state.db.collection('orcamentos').doc(id).update(data)
    .then(()=>showToast('Pedido reaberto'))
    .catch(()=>showToast('Não deu pra reabrir agora'));
}
// "Pago" é independente do status_pedido de propósito — o vendedor pode receber adiantado ou só na
// entrega, então é um toggle à parte, não uma etapa.
function togglePagamento(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  const novoPago = !o.pago;
  const data = {pago: novoPago, pago_em: novoPago ? new Date().toISOString() : null};
  if(!state.dbOk){ Object.assign(o, data); renderMain(); return; }
  state.db.collection('orcamentos').doc(id).update(data).catch(()=>showToast('Não deu pra atualizar agora'));
}

// Avisos manuais de WhatsApp pro cliente sobre o andamento do pedido — 100% manual, igual ao
// "Enviar por WhatsApp" do orçamento: só abre a conversa com o texto pronto, quem manda de
// verdade é o vendedor. Símbolos geométricos (■ ◆ ●), não emoji de verdade, pelo mesmo motivo de
// gerarTextoOrcamento (emoji corrompe passando pela URL do wa.me). "aberto" cobre tanto o aviso de
// "pedido recebido" (logo após converter) quanto reaberturas — é o mesmo texto pro mesmo status.
function saudacaoCliente(o){
  return o.cliente ? `Oi, ${o.cliente}!` : 'Oi!';
}
const TEXTO_STATUS_PEDIDO = {
  // Único status com uma exceção à regra "nunca detalhar personalização no WhatsApp" (ver
  // blocoPersonalizacaoRecebido): é o único ponto de checagem com o cliente antes de gastar
  // material/tempo de impressão numa peça com cor/nome errado — os demais avisos seguem genéricos.
  aberto: o => {
    const bloco = blocoPersonalizacaoRecebido(o);
    const confirmacao = bloco ? `\n\nSó pra confirmar a personalização antes de eu começar a imprimir:\n${bloco}\n\nTá tudo certo? Qualquer ajuste, me chama por aqui antes que eu comece a produção.` : '';
    return `■ *Pedido recebido — Biri Prints 3D*\n\n${saudacaoCliente(o)} Recebemos seu pedido certinho por aqui e ele já entrou na nossa fila de produção.${confirmacao} Qualquer novidade eu te aviso por aqui. Obrigado pela confiança!`;
  },
  em_producao: o => `● *Atualização do seu pedido — Biri Prints 3D*\n\n${saudacaoCliente(o)} Seu pedido está em produção agora — já colocamos pra rodar. Assim que sair te aviso por aqui!`,
  pronto: o => `● *Atualização do seu pedido — Biri Prints 3D*\n\n${saudacaoCliente(o)} Seu pedido ficou pronto! Já podemos combinar a entrega ou retirada — me chama por aqui.`,
  entregue: o => `● *Atualização do seu pedido — Biri Prints 3D*\n\n${saudacaoCliente(o)} Seu pedido foi entregue. Espero que goste bastante — se puder me contar o que achou, fico feliz em ouvir. Obrigado por comprar com a gente!`,
  cancelado: o => `● *Atualização do seu pedido — Biri Prints 3D*\n\n${saudacaoCliente(o)} Passando pra avisar que seu pedido foi cancelado. Qualquer dúvida, é só me chamar.`,
};
function textoAvisoStatusPedido(o){
  return TEXTO_STATUS_PEDIDO[statusPedido(o)](o);
}
function textoAvisoPagamento(o){
  return `◆ *Pagamento confirmado — Biri Prints 3D*\n\n${saudacaoCliente(o)} Confirmando aqui que recebemos o pagamento do seu pedido. Muito obrigado!`;
}
function enviarAvisoStatusPedido(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  enviarWhatsAppParaCliente(o, textoAvisoStatusPedido(o));
}
function enviarAvisoPagamento(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  enviarWhatsAppParaCliente(o, textoAvisoPagamento(o));
}
// Lista os atributos que faltam definir numa peça (cor e/ou o rótulo de texto cadastrado em "Partes
// e cores"), agregado por produto — nunca por unidade. Com só 1 parte personalizável (caso comum),
// vem sem prefixo ("cor, nome"); com mais de 1, cada atributo ganha "de {nome da parte}" pra não
// confundir qual é qual (mesma regra de desambiguação já usada em personalizacaoResumoUnidades).
function atributosPersonalizaveisTexto(produto){
  const partes = partesPersonalizaveis(produto);
  const multiplasPartes = partes.length > 1;
  const atributos = [];
  partes.forEach(p=>{
    const sufixo = multiplasPartes ? ` de ${p.nome || 'peça'}` : '';
    if(p.tipo_cor==='personalizavel') atributos.push(`cor${sufixo}`);
    if(p.texto_personalizavel) atributos.push(`${(p.rotulo_texto||'texto').toLowerCase()}${sufixo}`);
  });
  return atributos.join(', ');
}
// Mensagem de cobrança da personalização que falta — lista só as peças ainda pendentes (não repete
// as que já foram escolhidas), uma linha por peça com os atributos que faltam (nunca unidade por
// unidade). Pode ser reenviada quantas vezes for preciso, é só um follow-up.
function textoPedirPersonalizacao(o){
  const linhas = itensComPersonalizacaoPendente(o).map(({it, produto})=>
    `◆ ${it.nome} (${fmtNum(it.quantidade,0)} un.) — ${atributosPersonalizaveisTexto(produto)}`
  ).join('\n');
  return `■ *Falta só a personalização — Biri Prints 3D*\n\n${saudacaoCliente(o)} Pra colocar seu pedido pra produção, preciso que você me passe estes dados (pode ser igual ou diferente em cada peça):\n\n${linhas}\n\nPode mandar tudo por aqui que eu já anoto e sigo com a produção. Obrigado!`;
}
function enviarPedirPersonalizacao(id){
  const o = byId(state.orcamentos, id); if(!o) return;
  enviarWhatsAppParaCliente(o, textoPedirPersonalizacao(o));
}

function openOrcamentoBuilder(existingId, prefillProdutoId, copiarDe){
  const existing = existingId ? byId(state.orcamentos, existingId) : null;
  // Orçamento encerrado (já virou pedido) não pode mais ser editado — só copiado (ver "Copiar
  // orçamento" na lista) ou gerenciado pela aba Pedidos.
  if(existing && existing.status==='pedido'){
    showToast('Esse orçamento está encerrado (virou pedido) — use "Copiar" pra criar um novo, se precisar');
    return;
  }
  const base = copiarDe || existing;
  const draft = {
    cliente: base?.cliente || '',
    cliente_telefone: base?.cliente_telefone || '',
    cliente_id: base?.cliente_id || null,
    vendedor_id: copiarDe ? (state.vendedorAtualId || null) : (existing?.vendedor_id || state.vendedorAtualId || null),
    // "Copiar orçamento" nunca herda o desconto negociado do original — nasce sempre zerado.
    desconto_manual_pct: copiarDe ? 0 : (Number(existing?.desconto_manual_pct) || 0),
    itens: [],
  };
  if(copiarDe){
    // Recalcula pelas condições comerciais de agora: item de catálogo busca o preço ATUAL do
    // produto (pode ter mudado desde o orçamento original); item avulso não tem "preço atual" pra
    // buscar, então é copiado do jeito que estava. "personalizacoes" nunca é herdada — mesma regra
    // do desconto negociado, nasce em branco pra escolher de novo nessa cópia.
    draft.itens = copiarDe.itens.map(it=>{
      const p = it.produto_id ? byId(state.produtos, it.produto_id) : null;
      if(p){
        const r = precoAjustado(p, state.config);
        return {nome:p.nome, preco_unit:r.precoFinal, quantidade:it.quantidade, produto_id:p.id, impressora_id:p.impressora_id, incluido:true};
      }
      const {personalizacoes, ...resto} = it;
      return {...resto, incluido:true};
    });
  } else if(existing){
    draft.itens = existing.itens.slice();
  }
  // Se o orçamento já tem um cliente cadastrado vinculado, resolve o registro atual (pode ter
  // mudado telefone/e-mail desde que o orçamento foi criado). Se o cliente foi excluído do
  // cadastro depois, mantém o snapshot salvo no orçamento e avisa que ele não existe mais.
  draft.clienteSelecionado = draft.cliente_id
    ? (byId(state.clientes, draft.cliente_id) || {id:draft.cliente_id, nome:draft.cliente, telefone:draft.cliente_telefone, _removido:true})
    : null;
  if(prefillProdutoId){
    const p = byId(state.produtos, prefillProdutoId);
    if(p){
      const r = precoAjustado(p, state.config);
      draft.itens.push({nome:p.nome, preco_unit:r.precoFinal, quantidade:1, produto_id:p.id, impressora_id:p.impressora_id, incluido:true});
    }
  }

  const produtoOptions = state.produtos.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('');

  openModal(existing?'Editar orçamento':(copiarDe?'Copiar orçamento':'Novo orçamento'), `
    <div class="stack modal-sections">
      <div>
        <p class="section-label" style="margin-bottom:8px;">Cliente</p>
        <div id="oClienteBox"></div>
      </div>
      <label class="field"><span>Vendedor responsável</span><select class="ipt" id="oVendedor">${vendedorOptionsHtml(draft.vendedor_id)}</select></label>

      ${state.grupos.length ? `
      <div>
        <p class="section-label" style="margin-bottom:8px;">Adicionar kit completo</p>
        <div class="row" style="flex-wrap:wrap; gap:8px;">
          ${state.grupos.map(g=>`<button type="button" class="btn btn-sm" data-add-kit="${g.id}">+ Kit ${g.nome}</button>`).join('')}
        </div>
      </div>` : ''}

      <div>
        <p class="section-label" style="margin-bottom:8px;">Adicionar item</p>
        <div class="stack">
          <div class="grid-2">
            <select class="ipt" id="oProdSel"><option value="">— item avulso —</option>${produtoOptions}</select>
            <input class="ipt" id="oQtd" type="number" min="1" step="1" value="1" placeholder="Qtd.">
          </div>
          <div class="grid-2" id="oAvulsoRow">
            <input class="ipt" id="oAvulsoNome" placeholder="Nome do item">
            <input class="ipt" id="oAvulsoPreco" type="number" step="0.01" placeholder="Preço unit. (R$)">
          </div>
          <button class="btn btn-block" id="oAddItem">Adicionar item</button>
        </div>
      </div>

      <div>
        <p class="section-label">Itens</p>
        <div id="oItensList" class="stack"></div>
        <div id="oKitDescontos"></div>
      </div>

      <div>
        <p class="section-label" style="margin-bottom:8px;">Desconto negociado</p>
        <label class="field">
          <span>Percentual (%)</span>
          <input class="ipt" id="oDescontoManual" type="number" min="0" max="100" step="1" value="${draft.desconto_manual_pct}">
        </label>
        <p id="oDescontoManualMsg" style="font-size:.74rem;color:var(--text-muted);margin:6px 0 0;"></p>
        <div id="oDescontoManualLinha"></div>
      </div>

      <div>
        <div class="breakdown-row" id="oSubtotalRow" style="display:none;"><span class="lbl">Subtotal</span><span class="mono" id="oSubtotal"></span></div>
        <div class="breakdown-row total"><span class="lbl">Total</span><span class="mono" id="oTotal"></span></div>
      </div>

      <button class="btn btn-primary btn-block" id="oSalvar">${existing?'Salvar alterações':'Criar orçamento'}</button>
    </div>
  `, (bd)=>{
    // Modo do seletor de cliente: "buscar" (cliente já cadastrado) ou "novo" (cadastra ali mesmo).
    // Editando um orçamento com cliente vinculado, começa já mostrando ele selecionado; editando
    // um orçamento antigo com só o nome em texto (sem vínculo), começa em "novo" pra não perder
    // o que já tinha; orçamento em branco começa em "buscar" (fluxo mais comum pra quem já tem
    // clientes cadastrados).
    let clienteModo = draft.cliente_id ? 'buscar' : (draft.cliente ? 'novo' : 'buscar');

    const renderClienteSecao = ()=>{
      const box = bd.querySelector('#oClienteBox');
      const modoBtns = `
        <div class="row" style="gap:8px; margin-bottom:10px;">
          <button type="button" class="btn btn-sm ${clienteModo==='buscar'?'btn-primary':''}" data-cliente-modo="buscar">Cliente existente</button>
          <button type="button" class="btn btn-sm ${clienteModo==='novo'?'btn-primary':''}" data-cliente-modo="novo">Novo cliente</button>
        </div>`;
      if(clienteModo==='buscar' && draft.clienteSelecionado){
        const c = draft.clienteSelecionado;
        box.innerHTML = modoBtns + `
          <div class="card" style="padding:12px; background:var(--surface-2);">
            <div class="row" style="justify-content:space-between; align-items:flex-start;">
              <div>
                <h3 style="font-size:.95rem;">${c.nome}${c._removido?' <span style="font-weight:400;color:var(--text-muted);">(removido do cadastro)</span>':''}</h3>
                <div class="meta">${[c.telefone, c.email].filter(Boolean).join(' · ') || 'Sem contato salvo'}</div>
              </div>
              <button type="button" class="btn btn-sm btn-ghost" id="oClienteTrocar">Trocar</button>
            </div>
          </div>`;
        box.querySelector('#oClienteTrocar').addEventListener('click', ()=>{ draft.clienteSelecionado=null; draft.cliente_id=null; renderClienteSecao(); });
      } else if(clienteModo==='buscar'){
        box.innerHTML = modoBtns + `
          <input class="ipt" id="oClienteBusca" placeholder="Buscar cliente por nome...">
          <div class="stack" id="oClienteResultados" style="margin-top:8px;"></div>`;
        const inputBusca = box.querySelector('#oClienteBusca');
        const resultsBox = box.querySelector('#oClienteResultados');
        const renderResultados = ()=>{
          if(state.clientes.length===0){
            resultsBox.innerHTML = `<p style="color:var(--text-muted); font-size:.82rem;">Nenhum cliente cadastrado ainda — cadastre em "Novo cliente".</p>`;
            return;
          }
          const termo = inputBusca.value.trim().toLowerCase();
          const encontrados = (termo ? state.clientes.filter(c=>c.nome.toLowerCase().includes(termo)) : state.clientes).slice(0,6);
          resultsBox.innerHTML = encontrados.length ? encontrados.map(c=>`
            <button type="button" class="btn" style="justify-content:space-between; text-align:left;" data-cliente-sel="${c.id}">
              <span>${c.nome}</span><span class="meta" style="font-size:.74rem;">${c.telefone||c.email||''}</span>
            </button>`).join('') : `<p style="color:var(--text-muted); font-size:.82rem;">Nenhum cliente encontrado.</p>`;
          resultsBox.querySelectorAll('[data-cliente-sel]').forEach(b=> b.addEventListener('click', ()=>{
            draft.cliente_id = b.dataset.clienteSel;
            draft.clienteSelecionado = byId(state.clientes, draft.cliente_id);
            renderClienteSecao();
          }));
        };
        renderResultados();
        inputBusca.addEventListener('input', renderResultados);
      } else {
        box.innerHTML = modoBtns + `
          <div class="stack">
            <label class="field"><span>Nome completo</span><input class="ipt" id="oClienteNome" value="${!draft.cliente_id?draft.cliente:''}" placeholder="Ex.: Maria da Silva"></label>
            <label class="field"><span>WhatsApp</span><input class="ipt" id="oClienteTelNovo" type="tel" inputmode="tel" placeholder="(11) 91234-5678" value="${!draft.cliente_id?draft.cliente_telefone:''}"></label>
            <label class="field"><span>E-mail</span><input class="ipt" id="oClienteEmailNovo" type="email" placeholder="cliente@email.com"></label>
            <label class="row" style="gap:8px; cursor:pointer;">
              <input type="checkbox" id="oClienteAceitaEmail" style="width:17px;height:17px;flex:none;">
              <span style="font-size:.82rem;">Aceita novidades por e-mail</span>
            </label>
            <label class="row" style="gap:8px; cursor:pointer;">
              <input type="checkbox" id="oClienteAceitaWhatsapp" style="width:17px;height:17px;flex:none;">
              <span style="font-size:.82rem;">Aceita novidades por WhatsApp</span>
            </label>
            <p style="font-size:.74rem;color:var(--text-muted); margin:0;">Deixe o nome em branco pra não vincular esse orçamento a nenhum cliente. Preenchendo, ele é salvo no seu cadastro de clientes ao salvar o orçamento.</p>
          </div>`;
        aplicarMascaraTelefone(box.querySelector('#oClienteTelNovo'));
      }
      box.querySelectorAll('[data-cliente-modo]').forEach(b=> b.addEventListener('click', ()=>{
        clienteModo = b.dataset.clienteModo;
        renderClienteSecao();
      }));
    };
    renderClienteSecao();

    let expandirImpressoraIdx = null;
    let expandirPersonalizarIdx = null;

    // Uma unidade por bloco, um select de cor (filtrado pelo material da peça, igual ao editor de
    // peça) e/ou um input de texto por parte personalizável dessa peça — só as partes que pedem
    // alguma escolha aparecem aqui (ver partesPersonalizaveis). Com só 1 parte personalizável (o
    // caso comum), os campos vêm sem prefixo de nome pra não poluir; com mais de 1, cada campo é
    // prefixado pelo nome da parte pra não confundir qual é qual.
    const renderPersonalizarForm = (i, it, produto)=>{
      const partes = partesPersonalizaveis(produto);
      const unidadesHtml = Array.from({length: it.quantidade}, (_, u)=>{
        const unidade = (it.personalizacoes && it.personalizacoes[u]) || {};
        const camposHtml = partes.map((p, pi)=>{
          const valor = unidade[p.id] || {};
          const prefixo = partes.length>1 ? (p.nome || `Parte ${pi+1}`)+' — ' : '';
          let html = '';
          if(p.tipo_cor==='personalizavel'){
            html += `<label class="field" style="flex:1;"><span>${prefixo}Cor</span><select class="ipt pz-cor" data-u="${u}" data-parte="${p.id}">${corOptionsHtml(valor.cor_id, produto.material_id)}</select></label>`;
          }
          if(p.texto_personalizavel){
            html += `<label class="field" style="flex:1;"><span>${prefixo}${p.rotulo_texto||'Texto'}${p.texto_obrigatorio?'':' (opcional)'}</span><input class="ipt pz-texto" data-u="${u}" data-parte="${p.id}" value="${valor.texto||''}" ${p.texto_max_chars?`maxlength="${p.texto_max_chars}"`:''}></label>`;
          }
          return html;
        }).join('');
        return `<div class="row" style="gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:6px;">
          <span style="font-size:.78rem; color:var(--text-muted); min-width:64px;">Unidade ${u+1}</span>
          ${camposHtml}
        </div>`;
      }).join('');
      return `<div class="card" style="padding:10px; margin-top:6px; background:var(--surface-2);">
        <div class="stack">
          ${it.quantidade>1 ? `<button type="button" class="btn btn-sm" data-aplicar-todas-pz="${i}">Aplicar a escolha da Unidade 1 pra todas</button>` : ''}
          ${unidadesHtml}
        </div>
      </div>`;
    };

    const renderTrocaImpressoraForm = (i, it, produto)=>{
      const impressoraOptions = state.impressoras.map(imp=>`<option value="${imp.id}" ${imp.id===it.impressora_id?'selected':''}>${imp.nome}</option>`).join('');
      const {gramatura, tempo_horas} = perfilParaImpressora(produto, it.impressora_id);
      const totalMin = Math.round((Number(tempo_horas)||0)*60);
      const hh = Math.floor(totalMin/60), mm = totalMin%60;
      return `<div class="card" style="padding:10px; margin-top:6px; background:var(--surface-2);">
        <div class="stack">
          <label class="field"><span>Impressora pra este orçamento</span><select class="ipt" id="itImp${i}">${impressoraOptions}</select></label>
          <div class="grid-2">
            <label class="field"><span>Gramatura (g)</span><input class="ipt" id="itGram${i}" type="number" step="0.1" value="${gramatura}"></label>
            <div class="field">
              <span>Tempo</span>
              <div class="row" style="gap:6px;">
                <input class="ipt time-input" id="itH${i}" type="number" min="0" step="1" value="${hh}">
                <span class="unit-suffix">h</span>
                <input class="ipt time-input" id="itM${i}" type="number" min="0" max="59" step="1" value="${mm}">
                <span class="unit-suffix">min</span>
              </div>
            </div>
          </div>
          <label class="row" style="gap:8px; cursor:pointer;">
            <input type="checkbox" id="itSalvarPerfil${i}" style="width:16px;height:16px;flex:none;">
            <span style="font-size:.78rem;">Salvar como padrão dessa peça nessa impressora</span>
          </label>
          <button type="button" class="btn btn-sm btn-primary" data-aplicar-imp="${i}">Aplicar</button>
        </div>
      </div>`;
    };

    const renderItens = ()=>{
      const list = bd.querySelector('#oItensList');
      list.innerHTML = draft.itens.length ? draft.itens.map((it,i)=>{
        const incluido = it.incluido !== false;
        const produto = it.produto_id ? byId(state.produtos, it.produto_id) : null;
        const impressoraAtual = produto && it.impressora_id ? byId(state.impressoras, it.impressora_id) : null;
        const trocaImpressoraHtml = produto ? `
          <button type="button" class="textbtn" data-toggle-imp="${i}" style="font-size:.74rem; padding:2px 0;">🖨️ ${impressoraAtual ? impressoraAtual.nome : 'impressora'} ${expandirImpressoraIdx===i ? '▲' : '▼'}</button>
          ${expandirImpressoraIdx===i ? renderTrocaImpressoraForm(i, it, produto) : ''}
        ` : '';
        const progressoPz = produto ? personalizacaoItemProgresso(it, produto) : {aplicavel:false};
        const personalizarHtml = progressoPz.aplicavel ? `
          <button type="button" class="textbtn" data-toggle-personalizar="${i}" style="font-size:.74rem; padding:2px 0;">🎨 Personalizar (${progressoPz.completas}/${progressoPz.total} preenchidas) ${expandirPersonalizarIdx===i ? '▲' : '▼'}</button>
          ${expandirPersonalizarIdx===i ? renderPersonalizarForm(i, it, produto) : ''}
        ` : '';
        const resumoPz = produto ? personalizacaoResumoUnidades(it, produto) : '';
        return `<div class="list-line" style="${incluido?'':'opacity:.45;'} flex-direction:column; align-items:stretch;">
          <div class="row" style="justify-content:space-between;">
            <label class="row" style="gap:8px; align-items:center; cursor:pointer; flex:1;">
              <input type="checkbox" class="item-incl-chk" data-idx="${i}" ${incluido?'checked':''} style="width:17px;height:17px;flex:none;">
              <span>${it.nome} × ${it.quantidade}</span>
            </label>
            <span class="row" style="gap:10px;"><span class="mono">${fmtBRL(it.preco_unit*it.quantidade)}</span><button class="btn btn-ghost btn-sm" data-rm="${i}">✕</button></span>
          </div>
          ${resumoPz ? `<div class="pz-resumo" data-idx="${i}" style="font-size:.74rem; color:var(--text-muted); margin-top:2px;">🎨 ${resumoPz}</div>` : ''}
          ${trocaImpressoraHtml}
          ${personalizarHtml}
        </div>`;
      }).join('') : `<p style="color:var(--text-muted); font-size:.85rem;">Nenhum item ainda.</p>`;
      list.querySelectorAll('[data-rm]').forEach(b=> b.addEventListener('click', ()=>{ draft.itens.splice(Number(b.dataset.rm),1); renderItens(); }));
      list.querySelectorAll('.item-incl-chk').forEach(chk=> chk.addEventListener('change', ()=>{
        draft.itens[Number(chk.dataset.idx)].incluido = chk.checked;
        renderItens();
      }));
      list.querySelectorAll('[data-toggle-imp]').forEach(b=> b.addEventListener('click', ()=>{
        const idx = Number(b.dataset.toggleImp);
        expandirImpressoraIdx = expandirImpressoraIdx===idx ? null : idx;
        renderItens();
      }));
      if(expandirImpressoraIdx !== null){
        const idx = expandirImpressoraIdx;
        const selEl = list.querySelector(`#itImp${idx}`);
        if(selEl){
          selEl.addEventListener('change', ()=>{
            const produto = byId(state.produtos, draft.itens[idx].produto_id);
            const {gramatura, tempo_horas} = perfilParaImpressora(produto, selEl.value);
            const totalMin = Math.round((Number(tempo_horas)||0)*60);
            list.querySelector(`#itGram${idx}`).value = gramatura;
            list.querySelector(`#itH${idx}`).value = Math.floor(totalMin/60);
            list.querySelector(`#itM${idx}`).value = totalMin%60;
          });
        }
      }
      list.querySelectorAll('[data-aplicar-imp]').forEach(b=> b.addEventListener('click', ()=>{
        const i = Number(b.dataset.aplicarImp);
        const it = draft.itens[i];
        const produto = byId(state.produtos, it.produto_id);
        const novaImpId = list.querySelector(`#itImp${i}`).value;
        const gramatura = Number(list.querySelector(`#itGram${i}`).value)||0;
        const h = Number(list.querySelector(`#itH${i}`).value)||0, m = Number(list.querySelector(`#itM${i}`).value)||0;
        const tempo_horas = h + m/60;
        const impressora = byId(state.impressoras, novaImpId);
        const material = byId(state.materiais, produto.material_id);
        const r = calcPreco({material, impressora, gramatura, tempo_horas, custo_embalagem: produto.custo_embalagem}, state.config);
        it.impressora_id = novaImpId;
        it.preco_unit = r.precoFinal + (Number(produto.ajuste_manual)||0);
        const salvarChk = list.querySelector(`#itSalvarPerfil${i}`);
        if(salvarChk && salvarChk.checked && novaImpId !== produto.impressora_id){
          salvarPerfilImpressora(produto, novaImpId, gramatura, tempo_horas);
        }
        expandirImpressoraIdx = null;
        renderItens();
        showToast('Impressora do item atualizada');
      }));

      list.querySelectorAll('[data-toggle-personalizar]').forEach(b=> b.addEventListener('click', ()=>{
        const idx = Number(b.dataset.togglePersonalizar);
        expandirPersonalizarIdx = expandirPersonalizarIdx===idx ? null : idx;
        renderItens();
      }));
      if(expandirPersonalizarIdx !== null){
        const idx = expandirPersonalizarIdx;
        const it = draft.itens[idx];
        // Só o select de cor re-renderiza a lista ao vivo (precisa recalcular o contador de
        // preenchidas); o input de texto só grava no estado a cada tecla, sem re-renderizar (senão
        // o campo perderia o foco/cursor no meio da digitação) — o resumo/contador só é atualizado
        // de novo quando o campo perde o foco (ou em qualquer outra ação que já re-renderize).
        list.querySelectorAll('.pz-cor').forEach(sel=> sel.addEventListener('change', ()=>{
          setPersonalizacaoValor(it, Number(sel.dataset.u), sel.dataset.parte, 'cor_id', sel.value);
          renderItens();
        }));
        list.querySelectorAll('.pz-texto').forEach(inp=> {
          inp.addEventListener('input', ()=>{
            setPersonalizacaoValor(it, Number(inp.dataset.u), inp.dataset.parte, 'texto', inp.value);
          });
          inp.addEventListener('blur', ()=> renderItens());
        });
        const btnAplicarTodas = list.querySelector(`[data-aplicar-todas-pz="${idx}"]`);
        if(btnAplicarTodas){
          btnAplicarTodas.addEventListener('click', ()=>{
            const unidade0 = (it.personalizacoes && it.personalizacoes[0]) || {};
            it.personalizacoes = Array.from({length: it.quantidade}, ()=> JSON.parse(JSON.stringify(unidade0)));
            renderItens();
            showToast('Personalização da Unidade 1 aplicada a todas');
          });
        }
      }

      const itensIncluidos = draft.itens.filter(it=> it.incluido !== false);
      const subtotal = itensIncluidos.reduce((s,it)=>s+it.preco_unit*it.quantidade,0);
      const kit = calcularDescontosKit(itensIncluidos, state.grupos, state.promocoes);
      draft._kitTotal = kit.total;
      draft._kitLinhas = kit.linhas;

      const kitBox = bd.querySelector('#oKitDescontos');
      kitBox.innerHTML = kit.linhas.length ? `<div class="card" style="padding:12px; margin:10px 0; background:var(--accent-soft); border-color:var(--accent-soft-border);">
        <p class="section-label" style="margin-bottom:6px;">Desconto de kit detectado</p>
        ${kit.linhas.map(l=>`<div class="breakdown-row"><span class="lbl">${l.promoNome} · ${l.itens.length} produtos (${fmtNum(l.pct,0)}%)</span><span class="mono">− ${fmtBRL(l.desconto)}</span></div>`).join('')}
      </div>` : '';

      // Desconto negociado (manual) e desconto de kit são mutuamente exclusivos — kit tem
      // prioridade. Se o kit ficar ativo enquanto havia um desconto manual, zera o manual e avisa
      // por toast (só nessa transição — depois de zerado, essa checagem não dispara de novo até o
      // vendedor digitar um valor novo).
      const kitAtivo = kit.total > 0;
      if(kitAtivo && draft.desconto_manual_pct > 0){
        draft.desconto_manual_pct = 0;
        showToast('Desconto de kit ativado — o desconto negociado foi zerado');
      }
      const descontoManualValor = kitAtivo ? 0 : subtotal * (draft.desconto_manual_pct/100);

      const descInput = bd.querySelector('#oDescontoManual');
      descInput.disabled = kitAtivo;
      descInput.value = draft.desconto_manual_pct;
      bd.querySelector('#oDescontoManualMsg').textContent = kitAtivo
        ? 'Desabilitado enquanto o desconto de kit estiver ativo.' : '';
      bd.querySelector('#oDescontoManualLinha').innerHTML = descontoManualValor>0
        ? `<div class="breakdown-row"><span class="lbl">Desconto negociado (${fmtNum(draft.desconto_manual_pct,0)}%)</span><span class="mono">− ${fmtBRL(descontoManualValor)}</span></div>` : '';

      bd.querySelector('#oSubtotalRow').style.display = (kit.total>0 || descontoManualValor>0) ? 'flex' : 'none';
      bd.querySelector('#oSubtotal').textContent = fmtBRL(subtotal);
      bd.querySelector('#oTotal').textContent = fmtBRL(subtotal - kit.total - descontoManualValor);
    };
    renderItens();

    bd.querySelector('#oDescontoManual').addEventListener('input', (e)=>{
      let v = Number(e.target.value);
      if(!isFinite(v)) v = 0;
      draft.desconto_manual_pct = Math.max(0, Math.min(100, v));
      renderItens();
    });

    bd.querySelectorAll('[data-add-kit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const grupo = byId(state.grupos, btn.dataset.addKit);
        if(!grupo) return;
        (grupo.produto_ids||[]).forEach(pid=>{
          const p = byId(state.produtos, pid);
          if(!p) return;
          const existente = draft.itens.find(it=>it.produto_id===pid);
          if(existente){ existente.incluido = true; }
          else {
            const r = precoAjustado(p, state.config);
            draft.itens.push({nome:p.nome, preco_unit:r.precoFinal, quantidade:1, produto_id:p.id, impressora_id:p.impressora_id, incluido:true});
          }
        });
        renderItens();
        showToast(`Itens do kit "${grupo.nome}" adicionados`);
      });
    });

    bd.querySelector('#oAddItem').addEventListener('click', ()=>{
      clearFieldErrors(bd.querySelector('#oAvulsoRow'));
      const prodId = bd.querySelector('#oProdSel').value;
      const qtd = Number(bd.querySelector('#oQtd').value)||1;
      if(prodId){
        const p = byId(state.produtos, prodId);
        const r = precoAjustado(p, state.config);
        draft.itens.push({nome:p.nome, preco_unit:r.precoFinal, quantidade:qtd, produto_id:p.id, impressora_id:p.impressora_id, incluido:true});
      } else {
        const nome = bd.querySelector('#oAvulsoNome').value.trim();
        const preco = Number(bd.querySelector('#oAvulsoPreco').value)||0;
        let temErro = false;
        if(!nome){ markFieldError(bd.querySelector('#oAvulsoNome'), 'Dá um nome pro item avulso'); temErro=true; }
        if(!(preco>0)){ markFieldError(bd.querySelector('#oAvulsoPreco'), 'Informe o preço do item'); temErro=true; }
        if(temErro){ showToast('Confere os campos destacados'); focusFirstInvalid(bd.querySelector('#oAvulsoRow')); return; }
        draft.itens.push({nome, preco_unit:preco, quantidade:qtd, incluido:true});
        bd.querySelector('#oAvulsoNome').value=''; bd.querySelector('#oAvulsoPreco').value='';
      }
      renderItens();
    });

    bd.querySelector('#oSalvar').addEventListener('click', async ()=>{
      const itensFinais = draft.itens.filter(it=>it.incluido!==false).map(({incluido, ...rest})=>rest);
      if(itensFinais.length===0){ showToast('Selecione pelo menos um item'); return; }

      let cliente = '', cliente_telefone = '', cliente_id = null;
      if(clienteModo==='buscar'){
        // Se está em "buscar" mas ninguém foi selecionado, segue sem cliente — igual ao
        // comportamento de sempre quando o campo cliente ficava em branco.
        if(draft.clienteSelecionado){
          cliente = draft.clienteSelecionado.nome;
          cliente_telefone = draft.clienteSelecionado.telefone || '';
          cliente_id = draft.clienteSelecionado.id;
        }
      } else {
        clearFieldErrors(bd.querySelector('#oClienteBox'));
        const nomeNovo = bd.querySelector('#oClienteNome').value.trim();
        if(nomeNovo){
          const telefoneNovo = bd.querySelector('#oClienteTelNovo').value.trim();
          const emailNovo = bd.querySelector('#oClienteEmailNovo').value.trim();
          const aceitaEmailNovo = bd.querySelector('#oClienteAceitaEmail').checked;
          const aceitaWhatsappNovo = bd.querySelector('#oClienteAceitaWhatsapp').checked;
          let temErro = false;
          if(aceitaWhatsappNovo && !telefoneNovo){ markFieldError(bd.querySelector('#oClienteTelNovo'), 'Precisa de um WhatsApp pra mandar novidades por lá'); temErro=true; }
          if(aceitaEmailNovo && !emailNovo){ markFieldError(bd.querySelector('#oClienteEmailNovo'), 'Precisa de um e-mail pra mandar novidades por lá'); temErro=true; }
          if(telefoneNovo && !telefoneValido(telefoneNovo)){ markFieldError(bd.querySelector('#oClienteTelNovo'), 'Telefone inválido — confira o DDD e o número'); temErro=true; }
          if(emailNovo && !emailValido(emailNovo)){ markFieldError(bd.querySelector('#oClienteEmailNovo'), 'E-mail inválido'); temErro=true; }
          if(temErro){ showToast('Confere os campos destacados'); focusFirstInvalid(bd.querySelector('#oClienteBox')); return; }
          const clienteData = {nome:nomeNovo, telefone:telefoneNovo, email:emailNovo, aceita_email:aceitaEmailNovo, aceita_whatsapp:aceitaWhatsappNovo};
          // Cadastra o cliente novo de verdade (não só como texto solto no orçamento), pra
          // já aparecer no cadastro e poder ser encontrado em "Cliente existente" da próxima vez.
          if(!state.dbOk){
            clienteData.id = uid();
            state.clientes = [...state.clientes, clienteData];
            cliente_id = clienteData.id;
          } else {
            try{ const ref = await state.db.collection('clientes').add(clienteData); cliente_id = ref.id; }
            catch(e){ /* não deu pra cadastrar o cliente agora — segue salvando o orçamento com os dados como texto mesmo assim */ }
          }
          cliente = nomeNovo;
          cliente_telefone = telefoneNovo;
        }
      }

      const vendedorSel = bd.querySelector('#oVendedor').value;
      const vendedor_id = vendedorSel || null;
      const vendedor_nome = vendedor_id ? (byId(state.vendedores, vendedor_id)?.nome || '') : '';
      const subtotal = itensFinais.reduce((s,it)=>s+it.preco_unit*it.quantidade,0);
      const kit = calcularDescontosKit(itensFinais, state.grupos, state.promocoes);
      // Desconto de kit e desconto negociado (manual) nunca convivem — kit sempre tem prioridade,
      // mesma regra aplicada ao vivo em renderItens() (recalculada aqui de novo, sem confiar só no
      // que já estava marcado na tela).
      const desconto_manual_pct = kit.total>0 ? 0 : (Number(draft.desconto_manual_pct)||0);
      const desconto_manual_valor = subtotal * (desconto_manual_pct/100);
      const total = subtotal - kit.total - desconto_manual_valor;
      const data = {
        cliente, cliente_telefone, cliente_id, vendedor_id, vendedor_nome,
        itens: itensFinais, subtotal, desconto_kit_total: kit.total, desconto_kit_linhas: kit.linhas,
        desconto_manual_pct, desconto_manual_valor, total,
        status: existing?.status || 'rascunho', criado_em: existing?.criado_em || new Date().toISOString(),
      };
      // Número sequencial só é atribuído na criação — orçamento editado mantém o número que já tinha.
      if(!existing) data.orcamento_numero = proximoNumero('orcamento_numero');
      if(!state.dbOk){
        if(existing){ Object.assign(existing, data); } else { data.id=uid(); state.orcamentos=[data, ...state.orcamentos]; }
        closeModal(); irParaAba('orcamentos'); showToast('Salvo (modo local)');
        return;
      }
      const p = existing ? state.db.collection('orcamentos').doc(existing.id).update(data) : state.db.collection('orcamentos').add(data);
      p.then(()=>{ closeModal(); irParaAba('orcamentos'); showToast('Orçamento salvo'); })
       .catch(()=> showToast('Não deu pra salvar agora'));
    });
  });
}

/* ================= CLIENTES ================= */
const CLIENTES_FILTROS_URL_KEYS = ['clienteNome', 'clienteEmail', 'clienteTelefone'];

function clientesFiltroAtivo(){
  return !!(state.filtroClienteNome || state.filtroClienteEmail || state.filtroClienteTelefone);
}

function clientesFiltrados(){
  const nome = (state.filtroClienteNome||'').trim().toLowerCase();
  const email = (state.filtroClienteEmail||'').trim().toLowerCase();
  const telefone = normalizarTelefoneBusca(state.filtroClienteTelefone);
  return state.clientes.filter(c=>{
    if(nome && !(c.nome||'').toLowerCase().includes(nome)) return false;
    if(email && !(c.email||'').toLowerCase().includes(email)) return false;
    if(telefone && !normalizarTelefoneBusca(c.telefone).includes(telefone)) return false;
    return true;
  });
}

// Mesmo raciocínio do replaceState nos filtros de Catálogo: os filtros de Clientes mudam a cada
// tecla (com debounce nos de e-mail/telefone), então pushState empilharia o histórico do
// navegador inutilmente. O objetivo (compartilhar/voltar sem perder a seleção) é atendido por um
// link recarregável.
function sincronizarURLFiltrosClientes(){
  const url = new URL(location.href);
  CLIENTES_FILTROS_URL_KEYS.forEach(k=> url.searchParams.delete(k));
  if(state.filtroClienteNome) url.searchParams.set('clienteNome', state.filtroClienteNome);
  if(state.filtroClienteEmail) url.searchParams.set('clienteEmail', state.filtroClienteEmail);
  if(state.filtroClienteTelefone) url.searchParams.set('clienteTelefone', state.filtroClienteTelefone);
  history.replaceState(null, '', url.pathname + (url.searchParams.toString()?'?'+url.searchParams.toString():'') + url.hash);
}

// Chamado no boot(), antes do primeiro render — se o link trazia filtro de clientes, força a aba
// pra Clientes (senão um link compartilhado abriria numa aba qualquer e o filtro ficaria escondido).
function lerFiltrosClientesDaURL(){
  const params = new URLSearchParams(location.search);
  if(!CLIENTES_FILTROS_URL_KEYS.some(k=> params.has(k))) return;
  state.filtroClienteNome = params.get('clienteNome') || '';
  state.filtroClienteEmail = params.get('clienteEmail') || '';
  state.filtroClienteTelefone = params.get('clienteTelefone') || '';
  state.tab = 'clientes';
}

function renderClientes(main){
  if(state.clientes.length===0){
    main.innerHTML = `${offlineBanner()}<div class="empty">${iconClientes()}<h3>Nenhum cliente cadastrado</h3><p>Cadastre aqui, ou direto na tela de orçamento ao montar um novo.</p></div>`;
    addFab('fabNovoCliente', ()=>openClienteEditor(null));
    return;
  }

  main.innerHTML = `${offlineBanner()}
    <div class="row" style="justify-content:space-between; margin-bottom:2px; flex-wrap:wrap; gap:8px;">
      <p class="section-label" id="clienteContagem" style="margin-bottom:0;"></p>
      <button class="btn btn-sm" id="btnLimparFiltrosClientes" style="display:none;">Limpar filtros</button>
    </div>
    <div class="row" style="gap:8px; flex-wrap:wrap; margin-bottom:12px;">
      <input class="ipt" id="clienteBusca" placeholder="Buscar por nome..." value="${state.filtroClienteNome||''}" style="max-width:220px;">
      <input class="ipt" id="clienteBuscaEmail" placeholder="Buscar por e-mail..." value="${state.filtroClienteEmail||''}" style="max-width:220px;">
      <input class="ipt" id="clienteBuscaTelefone" placeholder="Buscar por telefone..." value="${state.filtroClienteTelefone||''}" style="max-width:220px;">
    </div>
    <div class="stack" id="clienteList"></div>
  `;

  const buscaNome = document.getElementById('clienteBusca');
  const buscaEmail = document.getElementById('clienteBuscaEmail');
  const buscaTelefone = document.getElementById('clienteBuscaTelefone');
  const contagemEl = document.getElementById('clienteContagem');
  const limparBtn = document.getElementById('btnLimparFiltrosClientes');

  function atualizarListaClientes(){
    const list = document.getElementById('clienteList');
    const filtrados = clientesFiltrados();
    const ativo = clientesFiltroAtivo();
    contagemEl.textContent = ativo
      ? `${filtrados.length} de ${state.clientes.length} cliente${state.clientes.length>1?'s':''} encontrado${filtrados.length===1?'':'s'}`
      : `${state.clientes.length} cliente${state.clientes.length!==1?'s':''}`;
    limparBtn.style.display = ativo ? '' : 'none';
    if(filtrados.length===0){
      list.innerHTML = `<div class="empty">${iconClientes()}<h3>Nenhum cliente encontrado</h3><p>Tenta ajustar ou limpar os filtros pra ver outros clientes cadastrados.</p></div>`;
      return;
    }
    list.innerHTML = filtrados.map(c=>`
      <div class="item-card">
        <div class="top-row">
          <div><h3>${c.nome}</h3><div class="meta">${[c.telefone, c.email].filter(Boolean).join(' · ') || 'Sem contato salvo'}</div></div>
        </div>
        ${(c.aceita_email || c.aceita_whatsapp) ? `<div class="row" style="flex-wrap:wrap; gap:6px; margin-top:8px;">
          ${c.aceita_email ? '<span class="badge badge-muted">Aceita e-mail</span>' : ''}
          ${c.aceita_whatsapp ? '<span class="badge badge-muted">Aceita WhatsApp</span>' : ''}
        </div>` : ''}
        <div class="actions">
          <button class="btn btn-sm" data-edit-cliente="${c.id}">Editar</button>
          <button class="btn btn-sm btn-ghost" data-del-cliente="${c.id}">Excluir</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('[data-edit-cliente]').forEach(b=> b.addEventListener('click', ()=>openClienteEditor(b.dataset.editCliente)));
    list.querySelectorAll('[data-del-cliente]').forEach(b=> b.addEventListener('click', ()=>confirmThenDelete(b, ()=>deleteCliente(b.dataset.delCliente))));
  }
  atualizarListaClientes();

  buscaNome.addEventListener('input', ()=>{
    state.filtroClienteNome = buscaNome.value;
    sincronizarURLFiltrosClientes();
    atualizarListaClientes();
  });

  let emailTimeout = null;
  buscaEmail.addEventListener('input', ()=>{
    const valor = buscaEmail.value;
    clearTimeout(emailTimeout);
    emailTimeout = setTimeout(()=>{
      state.filtroClienteEmail = valor;
      sincronizarURLFiltrosClientes();
      atualizarListaClientes();
    }, 300);
  });

  let telefoneTimeout = null;
  buscaTelefone.addEventListener('input', ()=>{
    const valor = buscaTelefone.value;
    clearTimeout(telefoneTimeout);
    telefoneTimeout = setTimeout(()=>{
      state.filtroClienteTelefone = valor;
      sincronizarURLFiltrosClientes();
      atualizarListaClientes();
    }, 300);
  });

  limparBtn.addEventListener('click', ()=>{
    state.filtroClienteNome = '';
    state.filtroClienteEmail = '';
    state.filtroClienteTelefone = '';
    sincronizarURLFiltrosClientes();
    renderMain();
  });

  addFab('fabNovoCliente', ()=>openClienteEditor(null));
}

// onSaved(cliente) opcional: chamado depois de salvar com sucesso, com o registro completo
// (inclusive o id novo, se for criação) — reservado pra uso futuro (ex.: vincular direto num
// orçamento), mesmo padrão já usado na versão principal.
function openClienteEditor(id, onSaved){
  const existing = id ? byId(state.clientes, id) : null;
  openModal(existing?'Editar cliente':'Novo cliente', `
    <div class="stack">
      <label class="field"><span>Nome completo<span class="req">*</span></span><input class="ipt" id="clNome" value="${existing?.nome||''}" placeholder="Ex.: Maria da Silva"></label>
      <label class="field"><span>WhatsApp</span><input class="ipt" id="clTelefone" type="tel" inputmode="tel" placeholder="(11) 91234-5678" value="${existing?.telefone||''}"></label>
      <label class="field"><span>E-mail</span><input class="ipt" id="clEmail" type="email" placeholder="cliente@email.com" value="${existing?.email||''}"></label>
      <label class="row" style="gap:8px; cursor:pointer;">
        <input type="checkbox" id="clAceitaEmail" style="width:18px;height:18px;flex:none;" ${existing?.aceita_email?'checked':''}>
        <span style="font-size:.86rem;">Aceita receber novidades por e-mail</span>
      </label>
      <label class="row" style="gap:8px; cursor:pointer;">

// Lista de cores pro seletor de "cor fixa" de uma parte de produto — SÓ as disponíveis no material
// que o produto usa (mais a já selecionada mesmo que tenha deixado de valer pra esse material,
// mesmo espírito do fallback "material removido" do Catálogo — não faz a cor salva desaparecer
// silenciosamente). Dentro disso, ativas + a já selecionada, igual a vendedorOptionsHtml.
function corOptionsHtml(selecionadoId, materialId){
  const doMaterial = state.cores.filter(c=> (c.material_ids||[]).includes(materialId));
  const visiveis = doMaterial.filter(c=> c.ativa!==false || c.id===selecionadoId);
  const selecionadaForaDaLista = selecionadoId && !visiveis.some(c=>c.id===selecionadoId) ? byId(state.cores, selecionadoId) : null;
  let html = `<option value="">— sem cor definida —</option>`;
  html += visiveis.map(c=>`<option value="${c.id}" ${selecionadoId===c.id?'selected':''}>${c.nome}${c.ativa===false?' (inativa)':''}</option>`).join('');
  if(selecionadaForaDaLista) html += `<option value="${selecionadaForaDaLista.id}" selected>${selecionadaForaDaLista.nome} (não disponível nesse material)</option>`;
  return html;
}

/* ---------------- personalização por unidade no orçamento (Etapa 2) ---------------- */
// Partes de uma peça que exigem alguma escolha por unidade — cor personalizável e/ou texto
// personalizável. Partes com cor fixa (e sem texto) já ficam 100% decididas no cadastro da peça,
// não aparecem aqui.
function partesPersonalizaveis(produto){
  return (produto?.partes || []).filter(p => p.tipo_cor === 'personalizavel' || p.texto_personalizavel);
}
// Uma unidade só conta como "preenchida" pra uma parte se: cor escolhida, quando a parte pede cor
// (sempre obrigatória — toda peça impressa precisa de uma cor definida); e texto preenchido, quando
// a parte pede texto E foi marcada como obrigatória no cadastro (texto opcional nunca bloqueia).
function personalizacaoUnidadeCompleta(parte, valor){
  if(parte.tipo_cor==='personalizavel' && !(valor && valor.cor_id)) return false;
  if(parte.texto_personalizavel && parte.texto_obrigatorio && !(valor && String(valor.texto||'').trim())) return false;
  return true;
}
// Quantas unidades (de 0 até it.quantidade) já têm todas as partes personalizáveis preenchidas —
// usado tanto pro contador no botão "Personalizar" quanto pra bloquear a conversão em pedido.
function personalizacaoItemProgresso(it, produto){
  const partes = partesPersonalizaveis(produto);
  if(partes.length===0) return {aplicavel:false, completas:0, total:0};
  const total = it.quantidade;
  let completas = 0;
  for(let u=0; u<total; u++){
    const unidade = (it.personalizacoes && it.personalizacoes[u]) || {};
    if(partes.every(p => personalizacaoUnidadeCompleta(p, unidade[p.id]))) completas++;
  }
  return {aplicavel:true, completas, total};
}
// Grava a escolha (cor_id ou texto) de uma unidade/parte específica, criando a estrutura sob
// demanda — item nasce sem "personalizacoes" até a primeira escolha (não precisa inicializar em
// cada ponto que cria um item novo no orçamento).
function setPersonalizacaoValor(it, unidadeIdx, parteId, campo, valor){
  if(!it.personalizacoes) it.personalizacoes = [];
  if(!it.personalizacoes[unidadeIdx]) it.personalizacoes[unidadeIdx] = {};
  if(!it.personalizacoes[unidadeIdx][parteId]) it.personalizacoes[unidadeIdx][parteId] = {};
  it.personalizacoes[unidadeIdx][parteId][campo] = valor;
}
// Resumo compacto de um item pra exibir na lista (Orçamentos/Pedidos) e no bloco especial da
// mensagem de "pedido recebido" — uma unidade por trecho ("1) Azul · 2) Vermelho — "Maria""),
// só as unidades que já têm alguma escolha (nada preenchido ainda não aparece). Com mais de 1 parte
// personalizável na mesma peça, cada trecho é prefixado pelo nome da parte pra não confundir qual é qual.
function personalizacaoResumoUnidades(it, produto){
  const partes = partesPersonalizaveis(produto);
  if(!partes.length) return '';
  const linhas = [];
  for(let u=0; u<it.quantidade; u++){
    const unidade = (it.personalizacoes && it.personalizacoes[u]) || {};
    const partesTxt = partes.map((p, pi)=>{
      const v = unidade[p.id] || {};
      const corNome = v.cor_id ? (byId(state.cores, v.cor_id)?.nome || '') : '';
      const bits = [corNome, v.texto ? `"${v.texto}"` : ''].filter(Boolean);
      if(!bits.length) return '';
      const prefixo = partes.length>1 ? `${p.nome || 'Parte '+(pi+1)}: ` : '';
      return prefixo + bits.join(' — ');
    }).filter(Boolean).join('; ');
    if(partesTxt) linhas.push(it.quantidade>1 ? `${u+1}) ${partesTxt}` : partesTxt);
  }
  return linhas.join(' · ');
}
// Itens do pedido com personalização ainda incompleta — não é um flag salvo, é sempre calculado
// na hora a partir de it.personalizacoes x produto.partes (personalizacaoItemProgresso), pra nunca
// dessincronizar do que já foi de fato preenchido. Usado pro badge, pro filtro e pro bloqueio de
// "Aberto -> Em produção" em Pedidos (a conversão de Orçamento pra Pedido não bloqueia mais nisso).
function itensComPersonalizacaoPendente(o){
  return (o.itens||[]).filter(it=>{
    if(it.incluido===false) return false;
    const produto = it.produto_id ? byId(state.produtos, it.produto_id) : null;
    if(!produto) return false;
    const prog = personalizacaoItemProgresso(it, produto);
    return prog.aplicavel && prog.completas < prog.total;
  }).map(it=>({it, produto: byId(state.produtos, it.produto_id)}));
}
function pedidoTemPersonalizacaoPendente(o){
  return itensComPersonalizacaoPendente(o).length > 0;
}
// Bloco extra SÓ na mensagem de "pedido recebido" (nunca nas de mudança de status nem no texto do
// orçamento) — resumo compacto do que foi escolhido, pro vendedor confirmar com o cliente ANTES de
// gastar material/tempo de impressão numa peça com cor/nome errado. Item sem nenhuma personalização
// escolhida não entra; se o pedido inteiro não tiver nada personalizado, o bloco todo vem vazio.
function blocoPersonalizacaoRecebido(o){
  const linhas = (o.itens||[]).filter(it=>it.incluido!==false).map(it=>{
    const produto = it.produto_id ? byId(state.produtos, it.produto_id) : null;
    if(!produto) return null;
    const resumo = personalizacaoResumoUnidades(it, produto);
    return resumo ? `◆ *${it.nome}*: ${resumo}` : null;
  }).filter(Boolean);
  return linhas.join('\n');
}
// Mesmo resumo compacto, mas pra exibir junto do item nas listas de Orçamentos/Pedidos (não no
// WhatsApp) — reaproveita personalizacaoResumoUnidades pra não duplicar a formatação.
function personalizacaoResumoLinhaHtml(it){
  const produto = it.produto_id ? byId(state.produtos, it.produto_id) : null;
  if(!produto) return '';
  const resumo = personalizacaoResumoUnidades(it, produto);
  return resumo ? `<div class="list-line" style="font-size:.74rem; color:var(--text-muted);"><span>🎨 ${resumo}</span></div>` : '';
}
// Formulário de preenchimento direto no card do Pedido (sem abrir o editor de peça) — mesmo padrão
// visual do renderPersonalizarForm do construtor de orçamento (um select de cor e/ou input de texto
// por unidade), só que grava direto no pedido em produção em vez de num rascunho local. Só aparece
// pra itens com personalização pendente e enquanto o pedido está "Aberto" (ver renderPedidos).
function renderPersonalizarPedidoForm(o, itemIdx, it, produto){
  const partes = partesPersonalizaveis(produto);
  const unidadesHtml = Array.from({length: it.quantidade}, (_, u)=>{
    const unidade = (it.personalizacoes && it.personalizacoes[u]) || {};
    const camposHtml = partes.map((p, pi)=>{
      const valor = unidade[p.id] || {};
      const prefixo = partes.length>1 ? (p.nome || `Parte ${pi+1}`)+' — ' : '';
      let html = '';
      if(p.tipo_cor==='personalizavel'){
        html += `<label class="field" style="flex:1;"><span>${prefixo}Cor</span><select class="ipt ppz-cor" data-pedido="${o.id}" data-item="${itemIdx}" data-u="${u}" data-parte="${p.id}">${corOptionsHtml(valor.cor_id, produto.material_id)}</select></label>`;
      }
      if(p.texto_personalizavel){
        html += `<label class="field" style="flex:1;"><span>${prefixo}${p.rotulo_texto||'Texto'}${p.texto_obrigatorio?'':' (opcional)'}</span><input class="ipt ppz-texto" data-pedido="${o.id}" data-item="${itemIdx}" data-u="${u}" data-parte="${p.id}" value="${valor.texto||''}" ${p.texto_max_chars?`maxlength="${p.texto_max_chars}"`:''}></label>`;
      }
      return html;
    }).join('');
    return `<div class="row" style="gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:6px;">
      <span style="font-size:.78rem; color:var(--text-muted); min-width:64px;">Unidade ${u+1}</span>
      ${camposHtml}
    </div>`;
  }).join('');
  return `<div class="card" style="padding:10px; margin-top:6px; background:var(--pending-soft); border-color:var(--pending-soft-border);">
    <p style="font-size:.74rem; color:var(--pending); font-weight:600; margin:0 0 6px;">🎨 Falta personalizar: ${it.nome}</p>
    <div class="stack">${unidadesHtml}</div>
  </div>`;
}
// Grava a escolha de cor/texto de uma unidade direto no pedido — atualiza o estado local na hora
// (pro contador/badge/desbloqueio do "Em produção" refletirem de imediato) e só então manda pro
// Firestore em segundo plano, igual ao padrão usado no resto do Pedidos.
function atualizarPersonalizacaoPedido(id, itemIdx, unidadeIdx, parteId, campo, valor){
  const o = byId(state.orcamentos, id); if(!o) return;
  setPersonalizacaoValor(o.itens[itemIdx], unidadeIdx, parteId, campo, valor);
  renderMain();
  if(state.dbOk) state.db.collection('orcamentos').doc(id).update({itens: o.itens}).catch(()=>showToast('Não deu pra salvar agora'));
}

// ---- "Vendedor atual" (quem está usando o app agora) ----
// Além do login (que dá acesso ao app), existe uma identificação de "quem está cadastrando" nesse
// aparelho — salva no localStorage, sempre trocável, serve pra pré-preencher quem criou um
// orçamento ou converteu um pedido. Enquanto nenhum vendedor válido estiver escolhido nesse
// aparelho, uma tela cobre o app inteiro pedindo pra escolher (ou cadastrar) um vendedor.
function renderVendedorPickerHtml(){
  const ativos = state.vendedores.filter(v=>v.ativo!==false);
  return `
    <div class="stack">
      ${ativos.length ? ativos.map(v=>`<button type="button" class="btn btn-block" style="justify-content:flex-start;" data-escolher-vendedor="${v.id}">${v.nome}</button>`).join('')
        : `<p style="color:var(--text-muted); font-size:.85rem;">Nenhum vendedor cadastrado ainda.</p>`}
      <button type="button" class="btn btn-block btn-ghost" id="btnNovoVendedorGate">+ Cadastrar vendedor</button>
    </div>`;
}
function wireVendedorPicker(container, onEscolher){
  container.querySelectorAll('[data-escolher-vendedor]').forEach(b=> b.addEventListener('click', ()=> onEscolher(b.dataset.escolherVendedor)));
  const btnNovo = container.querySelector('#btnNovoVendedorGate');
  if(btnNovo) btnNovo.addEventListener('click', ()=> openVendedorEditor(null, (v)=> onEscolher(v.id)));
}
function mostrarGateVendedor(){
  let el = document.getElementById('vendedorGate');
  if(!el){ el = document.createElement('div'); el.id='vendedorGate'; el.className='modal-backdrop'; document.body.appendChild(el); }
  // Sem clique-fora-fecha (diferente do modal comum) — não dá pra usar o app sem escolher.
  el.innerHTML = `<div class="modal"><h2>Quem está usando agora?</h2>
    <p style="font-size:.82rem;color:var(--text-muted); margin:-6px 0 12px;">Escolha seu nome pra identificar quem está cadastrando orçamentos e pedidos.</p>
    ${renderVendedorPickerHtml()}</div>`;
  wireVendedorPicker(el, (id)=> selecionarVendedorAtual(id));
}
function selecionarVendedorAtual(id){
  state.vendedorAtualId = id;
  try{ localStorage.setItem('vendedorAtualId', id); }catch(e){}
  const g = document.getElementById('vendedorGate'); if(g) g.remove();
  renderNav(); renderMain();
}
// Chamado no boot e sempre que a lista de vendedores mudar (chegada de dados do Firestore,
// alguém sendo desativado etc.) — resolve o vendedor salvo no aparelho, se ainda for válido, ou
// mostra a tela de escolha.
function checarVendedorAtual(){
  let atual = state.vendedorAtualId ? byId(state.vendedores, state.vendedorAtualId) : null;
  if(!atual || atual.ativo===false){
    let salvo = null;
    try{ salvo = localStorage.getItem('vendedorAtualId'); }catch(e){}
    const salvoValido = salvo ? byId(state.vendedores, salvo) : null;
    if(salvoValido && salvoValido.ativo!==false){ state.vendedorAtualId = salvo; atual = salvoValido; }
  }
  if(atual && atual.ativo!==false){
    const g = document.getElementById('vendedorGate'); if(g) g.remove();
    renderVendedorAtualBadge();
  } else {
    mostrarGateVendedor();
  }
}
function abrirTrocaVendedorModal(){
  openModal('Trocar de vendedor', renderVendedorPickerHtml(), (bd)=>{
    wireVendedorPicker(bd, (id)=>{ closeModal(); selecionarVendedorAtual(id); });
  });
}
function renderVendedorAtualBadge(){
  const box = document.getElementById('vendedorAtualBox');
  if(!box) return;
  const v = state.vendedorAtualId ? byId(state.vendedores, state.vendedorAtualId) : null;
  box.innerHTML = v ? `<button class="textbtn" id="btnTrocarVendedor" style="white-space:nowrap;">${v.nome} · trocar</button>` : '';
  const btn = document.getElementById('btnTrocarVendedor');
  if(btn) btn.addEventListener('click', abrirTrocaVendedorModal);
}
// No celular, "Danilo · trocar" + "Sair" não cabem por extenso ao lado do nome do app — ficam
// atrás desse menu compacto (ícone de usuário no cabeçalho). Reaproveita a mesma troca de
// vendedor e o mesmo botão de sair de sempre, só reorganizando onde o vendedor aciona cada um.
function abrirMenuUsuarioMobile(){
  const v = state.vendedorAtualId ? byId(state.vendedores, state.vendedorAtualId) : null;
  openModal('Menu', `
    <div class="stack">
      ${v ? `<div><p style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);margin:0 0 2px;">Vendedor atual</p><p style="font-weight:600;margin:0;">${v.nome}</p></div>` : ''}
      <button class="btn btn-block" id="mnuTrocarVendedor">Trocar de vendedor</button>
      <button class="btn btn-block btn-ghost" id="mnuSair">Sair</button>
    </div>
  `, (bd)=>{
    bd.querySelector('#mnuTrocarVendedor').addEventListener('click', ()=>{ closeModal(); abrirTrocaVendedorModal(); });
    bd.querySelector('#mnuSair').addEventListener('click', ()=>{ closeModal(); document.getElementById('btnLogout').click(); });
  });
}

/* ================= AJUSTES / CONFIG ================= */
const CONFIG_META = [
  {k:'tarifa_kwh', label:'Tarifa de energia', unit:'R$/kWh', step:'0.00001', note:'Tarifa cheia da conta de energia (TUSD + TE, com impostos).'},
  {k:'falha_pct', label:'Taxa de falhas', unit:'%', step:'1', pct:true, note:'Aplicada sobre material + energia + desgaste.'},
  {k:'mao_de_obra_hora', label:'Mão de obra', unit:'R$/hora', step:'0.5', note:'Hoje zerada — projeto pessoal, sem cobrar a própria hora.'},
  {k:'margem_pct', label:'Margem (markup)', unit:'%', step:'1', pct:true, note:'Aplicada sobre o custo total. 100% = preço 2× o custo.'},
  {k:'preco_minimo', label:'Preço mínimo', unit:'R$/peça', step:'0.5', note:'Piso: o preço final nunca fica abaixo disso.'},
];

function renderAdminParametros(main){
  const cfg = state.config;
  main.innerHTML = `
    ${offlineBanner()}
    <div class="card stack" style="margin-bottom:22px;">
      <p class="section-label" style="margin-bottom:0;">Importar backup</p>
      <p style="font-size:.78rem;color:var(--text-muted);margin:0;">Importa um arquivo de backup (.json) exportado do sistema — usa isso uma vez, pra trazer os dados que já existiam antes de migrar pra cá. Peças/impressoras/materiais/grupos/promoções com o mesmo ID são substituídos; o resto fica como está.</p>
      <input type="file" id="importarBackupInput" accept="application/json" class="ipt">
      <p id="importarBackupStatus" style="font-size:.78rem;margin:0;color:${importarBackupStatusCor};">${importarBackupStatusMsg}</p>
    </div>

    <div class="row" style="justify-content:space-between; margin-bottom:2px;">
      <p class="section-label" style="margin-bottom:0;">Parâmetros de custo</p>
      <button class="btn btn-sm" id="btnEditCfg">Editar</button>
    </div>
    <div class="config-grid" id="cfgGrid" style="margin-bottom:22px;"></div>
  `;
  const isCurrencyUnit = u => u==='R$' || u==='R$/hora' || u==='R$/peça';
  document.getElementById('cfgGrid').innerHTML = CONFIG_META.map(m=>{
    const raw = cfg[m.k];
    let val;
    if(m.pct) val = fmtNum(raw*100,0)+'%';
    else if(isCurrencyUnit(m.unit)) val = fmtBRL(raw);
    else {
      const decimals = m.k==='tarifa_kwh' ? 5 : (m.k==='vida_util_horas' ? 0 : 2);
      val = `${fmtNum(raw, decimals)} ${m.unit}`;
    }
    return `<div class="spec"><div class="k">${m.label}</div><div class="v">${val}</div><div class="note">${m.note}</div></div>`;
  }).join('');

  document.getElementById('importarBackupInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    // Guarda a mensagem em variáveis de módulo (importarBackupStatusMsg/Cor), não só no DOM: cada
    // escrita no banco durante a importação dispara um onSnapshot que re-renderiza esta tela do
    // zero (renderAdminParametros recria a página inteira, inclusive um <p id="importarBackupStatus">
    // vazio) — sem isso, uma dessas atualizações chegando depois de "Importando…"/"sucesso" ser
    // exibido apagava a mensagem de volta pro vazio. Reconsultar o elemento a cada chamada
    // continua necessário: o elemento capturado no início ficaria "órfão" (fora do DOM) depois de
    // qualquer um desses re-renders.
    const setStatus = (msg, cor)=>{
      importarBackupStatusMsg = msg; importarBackupStatusCor = cor;
      const el = document.getElementById('importarBackupStatus');
      if(el){ el.textContent = msg; el.style.color = cor; }
    };
    setStatus('Importando…', 'var(--text-muted)');
    try{
      const texto = await file.text();
      const backup = JSON.parse(texto);
      await importarBackupJSON(backup);
      setStatus('Backup importado com sucesso!', 'var(--accent)');
    }catch(err){
      setStatus('Não deu pra importar: ' + err.message, 'var(--danger)');
    }
    e.target.value = '';
  });

  document.getElementById('btnEditCfg').addEventListener('click', openConfigEditor);
}

function openConfigEditor(){
  const cfg = state.config;
  const fieldsHtml = CONFIG_META.map(m=>{
    const displayVal = m.pct ? (cfg[m.k]*100) : cfg[m.k];
    return `<label class="field"><span>${m.label} (${m.unit})</span><input class="ipt" id="cfg_${m.k}" type="number" step="${m.step}" value="${displayVal}"></label>`;
  }).join('');
  openModal('Editar parâmetros', `<div class="stack">${fieldsHtml}<button class="btn btn-primary btn-block" id="cfgSave">Salvar</button></div>`, (bd)=>{
    bd.querySelector('#cfgSave').addEventListener('click', ()=>{
      const next = {...cfg};
      CONFIG_META.forEach(m=>{
        const raw = Number(bd.querySelector('#cfg_'+m.k).value);
        next[m.k] = m.pct ? raw/100 : raw;
      });
      if(!state.dbOk){ state.config = next; closeModal(); renderMain(); showToast('Salvo (modo local)'); return; }
      state.db.doc('config/geral').set(next).then(()=>{ closeModal(); showToast('Parâmetros atualizados'); })
        .catch(()=> showToast('Não deu pra salvar agora'));
    });
  });
}

function openMaterialEditor(id){
  const existing = id ? byId(state.materiais, id) : null;
  openModal(existing?'Editar material':'Novo material', `
    <div class="stack">
      <label class="field"><span>Nome<span class="req">*</span></span><input class="ipt" id="mNome" value="${existing?.nome||''}" placeholder="Ex.: PETG"></label>
      <label class="field"><span>Marca</span><input class="ipt" id="mMarca" value="${existing?.marca||''}" placeholder="Ex.: Voolt"></label>
      <label class="field"><span>Preço por Kg (R$)<span class="req">*</span></span><input class="ipt" id="mPreco" type="number" step="0.01" value="${existing?.preco_kg??''}" placeholder="100"></label>
      <button class="btn btn-primary btn-block" id="mSave">Salvar</button>
    </div>
  `, (bd)=>{
    bd.querySelector('#mSave').addEventListener('click', ()=>{
      clearFieldErrors(bd);
      const nome = bd.querySelector('#mNome').value.trim();
      const marca = bd.querySelector('#mMarca').value.trim();
      const preco_kg = Number(bd.querySelector('#mPreco').value)||0;
      let temErro = false;
      if(!nome){ markFieldError(bd.querySelector('#mNome'), 'Dá um nome pro material'); temErro=true; }
      if(!(preco_kg>0)){ markFieldError(bd.querySelector('#mPreco'), 'Informe o preço por kg'); temErro=true; }
      if(temErro){ showToast('Confere os campos destacados'); focusFirstInvalid(bd); return; }
      const data = {nome, marca, preco_kg};
      if(!state.dbOk){
        if(existing){ Object.assign(existing, data); } else { data.id=uid(); state.materiais=[...state.materiais, data]; }
        closeModal(); renderMain(); showToast('Salvo (modo local)');
        return;
      }
      const p = existing ? state.db.collection('materiais').doc(existing.id).update(data) : state.db.collection('materiais').add(data);
      p.then(()=>{ closeModal(); showToast('Material salvo'); }).catch(()=> showToast('Não deu pra salvar agora'));
    });
  });
}

function deleteMaterial(id){
  if(!state.dbOk){ state.materiais = state.materiais.filter(m=>m.id!==id); renderMain(); return; }
  state.db.collection('materiais').doc(id).delete().then(()=>showToast('Material removido')).catch(()=>showToast('Não deu pra excluir agora'));
}
